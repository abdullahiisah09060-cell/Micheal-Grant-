<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- Gov Banner -->
    <div class="gov-banner">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA Flag">
        <span>Official Account Recovery Service</span>
    </div>

    <div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 20px;">
        <div class="card" style="max-width: 450px; width: 100%;">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="sba-logo.png" alt="SBA Logo" style="height: 60px; margin-bottom: 15px;">
                <h2 style="color: var(--sba-navy);">Password Recovery</h2>
                <p style="color: var(--text-secondary); font-size: 14px;">Enter your email to receive a secure reset link.</p>
            </div>

            <form id="forgotForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" style="margin-bottom: 20px;">
                    Send Reset Link
                </button>
            </form>

            <div style="text-align: center; border-top: 1px solid var(--border); padding-top: 20px;">
                <a href="login.html" style="color: var(--sba-navy); font-weight: 600; text-decoration: none; font-size: 14px;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="forgot-password.js"></script>
</body>
</html>
