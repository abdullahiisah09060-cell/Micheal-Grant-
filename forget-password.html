<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="auth-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 400px; width: 90%; padding: 40px; text-align: center;">
            <div class="sba-logo" style="justify-content: center; margin-bottom: 24px;">
                <svg width="40" height="40" viewBox="0 0 60 60"><path d="M8 8 H24 V14 H14 V24 H8 Z" fill="#003087"/></svg>
            </div>
            <h3>Reset Password</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 30px;">Enter your email to receive a password reset link.</p>
            
            <form id="resetForm">
                <div class="form-group" style="text-align: left;">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" required>
                </div>
                <button type="submit" id="btn" class="btn btn--primary btn--full">Send Reset Link</button>
            </form>

            <div id="successState" style="display: none; margin-top: 20px;">
                <div style="color: var(--success); font-weight: 600;">✓ Link Sent!</div>
                <p style="font-size: 0.85rem; margin-top: 10px;">Check your inbox (and spam) for instructions.</p>
            </div>

            <a href="login.html" style="display: block; margin-top: 30px; font-size: 0.9rem; color: var(--navy);">Back to Sign In</a>
        </div>
    </div>

    <script type="module">
        import { auth, sendPasswordResetEmail } from './firebase-config.js';
        import { initTheme, showToast } from './app.js';

        initTheme();
        const form = document.getElementById('resetForm');
        
        form.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = 'Sending...';
            btn.disabled = true;

            try {
                await sendPasswordResetEmail(auth, document.getElementById('email').value);
                form.style.display = 'none';
                document.getElementById('successState').style.display = 'block';
            } catch (error) {
                showToast("Error: " + error.message, "error");
                btn.innerText = 'Send Reset Link';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
