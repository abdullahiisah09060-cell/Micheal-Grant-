<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
        .auth-card { max-width: 420px; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="sba-logo" style="justify-content: center; margin-bottom: 32px;">
                <svg class="sba-logo__mark" viewBox="0 0 80 80"><path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/><text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text><text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text><text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text></svg>
            </div>
            
            <div id="resetContent">
                <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 12px;">Reset Password</h1>
                <p class="text-muted mb-8">Enter your email and we'll send you a link to get back into your account.</p>

                <div class="card card--shadow text-left">
                    <form id="resetForm">
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
                        </div>
                        <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Send Reset Link</button>
                    </form>
                    <a href="login.html" class="btn btn--ghost btn--full mt-4" style="font-size: 0.85rem;"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
                </div>
            </div>

            <div id="successContent" style="display: none; animation: fadeSlide 0.4s ease;">
                <div class="status-screen__icon status-screen__icon--success"><i class="fa-solid fa-envelope-circle-check"></i></div>
                <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 12px;">Check your email</h2>
                <p class="text-muted mb-8">We have sent password recovery instructions to <strong id="sentEmail"></strong>. Please check your inbox and spam folder.</p>
                <a href="login.html" class="btn btn--primary">Back to Login</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, sendPasswordResetEmail } from './firebase-config.js';
        import { initTheme, setButtonLoading, showToast } from './app.js';

        initTheme();

        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            setButtonLoading(submitBtn, true, 'Sending...');

            try {
                await sendPasswordResetEmail(auth, email);
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('resetContent').style.display = 'none';
                document.getElementById('successContent').style.display = 'block';
            } catch (err) {
                console.error(err);
                showToast(err.message, 'error');
                setButtonLoading(submitBtn, false);
            }
        };
    </script>
</body>
</html>
