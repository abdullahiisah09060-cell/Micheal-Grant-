<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); flex-direction: column; }
    </style>
</head>
<body>
    <div class="gov-banner" style="position: fixed; top: 0; left: 0; right: 0;">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA">
        <span>An official website of the United States government</span>
    </div>

    <div class="auth-container">
        <div style="max-width: 420px; width: 100%; text-align: center;">
            <a href="index.html" class="sba-logo mb-12" style="justify-content: center;">
                <svg class="sba-logo__mark" viewBox="0 0 80 80"><path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/><text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text><text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text><text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text></svg>
                <div class="sba-logo__text"><span class="sba-logo__name">U.S. Small Business</span><span class="sba-logo__sub">Administration</span></div>
            </a>
            
            <div id="resetView">
                <h1 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 12px; color: var(--navy);">Reset Password</h1>
                <p class="text-muted mb-8">Enter your registered email address and we'll send you a recovery link.</p>
                <div class="card card--shadow text-left">
                    <form id="resetForm">
                        <div class="form-group"><label class="form-label">Email Address</label><input type="email" id="email" class="form-input" required></div>
                        <button type="submit" class="btn btn--primary btn--full btn--lg" id="btnReset">Send Reset Link</button>
                    </form>
                    <a href="login.html" class="btn btn--ghost btn--full mt-4"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
                </div>
            </div>

            <div id="successView" style="display: none; animation: fadeSlide 0.4s ease;">
                <div style="width: 80px; height: 80px; background: var(--success-bg); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 24px; border: 2px solid var(--success-border);"><i class="fa-solid fa-envelope-circle-check"></i></div>
                <h2 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 12px; color: var(--navy);">Email Dispatched</h2>
                <p class="text-muted mb-8">Recovery instructions sent to <strong id="sentMail" class="text-navy"></strong>. Please check your inbox.</p>
                <a href="login.html" class="btn btn--primary btn--full btn--lg">Return to Sign In</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, sendPasswordResetEmail } from './firebase-config.js';
        import { initTheme, setButtonLoading, showToast } from './app.js';
        initTheme();
        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReset');
            const email = document.getElementById('email').value.trim();
            setButtonLoading(btn, true, 'Sending...');
            try {
                await sendPasswordResetEmail(auth, email);
                document.getElementById('sentMail').textContent = email;
                document.getElementById('resetView').style.display = 'none';
                document.getElementById('successView').style.display = 'block';
            } catch (err) { showToast(err.message, 'error'); setButtonLoading(btn, false); }
        };
    </script>
</body>
</html>
