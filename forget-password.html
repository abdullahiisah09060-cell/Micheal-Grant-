<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <div class="gov-banner">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA Flag">
        <span>An official website of the United States government</span>
    </div>

    <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div style="max-width:400px; width:100%;" id="recoveryContainer">
            <div style="text-align:center; margin-bottom:32px;">
                <div class="sba-logo" style="justify-content:center; margin-bottom:24px;">
                    <svg class="sba-logo__mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/>
                        <path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/>
                        <text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text>
                        <text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text>
                        <text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text>
                    </svg>
                </div>
                <h1 style="font-size:1.5rem; font-weight:800; color:var(--navy);">Reset Your Password</h1>
                <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:8px;">Enter your email to receive a recovery link</p>
            </div>

            <div class="card">
                <form id="resetForm">
                    <div class="form-group">
                        <label class="form-label">Account Email</label>
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                    </div>
                    <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn">Send Recovery Link</button>
                </form>

                <div style="text-align:center; margin-top:24px;">
                    <a href="login.html" style="font-size:0.9rem; font-weight:700; color:var(--navy); text-decoration:none;">
                        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, sendPasswordResetEmail } from './firebase-config.js';
        import { setButtonLoading, initTheme, showToast } from './app.js';

        initTheme();

        const resetForm = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const container = document.getElementById('recoveryContainer');

        resetForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            setButtonLoading(submitBtn, true, 'Sending...');

            try {
                await sendPasswordResetEmail(auth, email);
                container.innerHTML = `
                    <div class="card text-center" style="padding:40px 24px;">
                        <div style="width:64px; height:64px; background:var(--success-bg); color:var(--success); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto 24px;">
                            <i class="fa-solid fa-paper-plane"></i>
                        </div>
                        <h2 style="font-weight:800; color:var(--navy); margin-bottom:12px;">Link Sent!</h2>
                        <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:24px;">Check your email <b>${email}</b> for instructions to reset your password.</p>
                        <a href="login.html" class="btn btn--primary btn--full">Return to Login</a>
                    </div>
                `;
            } catch (error) {
                setButtonLoading(submitBtn, false);
                showToast('Failed to send recovery link. Check your email address.', 'error');
            }
        };
    </script>
</body>
</html>
