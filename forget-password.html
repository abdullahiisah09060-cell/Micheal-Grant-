<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SBA Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div style="max-width: 420px; width: 100%; text-align: center;">
        <div class="sba-logo mb-12" style="justify-content: center;">
            <svg class="sba-logo__mark" viewBox="0 0 80 80"><path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/><text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text><text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text><text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text></svg>
        </div>
        <div id="formV">
            <h1 style="font-size: 1.8rem; font-weight: 900; color: var(--navy); margin-bottom: 12px;">Reset Password</h1>
            <p class="text-muted mb-8">Enter your email and we'll send a recovery link.</p>
            <div class="card card--shadow text-left">
                <form id="fForm">
                    <div class="form-group"><label class="form-label">Email Address</label><input type="email" id="email" class="form-input" required></div>
                    <button type="submit" class="btn btn--primary btn--full btn--lg" id="btn">Send recovery link</button>
                </form>
                <a href="login.html" class="btn btn--ghost btn--full mt-4">Back to Login</a>
            </div>
        </div>
        <div id="sentV" style="display:none;" class="fade-in">
            <div style="font-size:4rem; color:var(--success); margin-bottom:20px;"><i class="fa-solid fa-circle-check"></i></div>
            <h2 style="color:var(--navy); font-weight:900;">Link Dispatched</h2>
            <p class="text-muted mb-8">Please check your inbox and follow the instructions to reset your password.</p>
            <a href="login.html" class="btn btn--primary">Return to Sign In</a>
        </div>
    </div>
    <script type="module">
        import { auth, sendPasswordResetEmail } from './firebase-config.js';
        import { initTheme, setButtonLoading, showToast } from './app.js';
        initTheme();
        document.getElementById('fForm').onsubmit = async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn'); setButtonLoading(btn, true);
            try { await sendPasswordResetEmail(auth, document.getElementById('email').value.trim()); document.getElementById('formV').style.display='none'; document.getElementById('sentV').style.display='block'; }
            catch (err) { showToast(err.message, 'error'); setButtonLoading(btn, false); }
        };
    </script>
</body>
</html>
