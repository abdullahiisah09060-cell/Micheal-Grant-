<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SBA Grant Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; background:var(--bg);">

<div class="gov-banner">
    <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="US Flag">
    <span>An official website of the United States government</span>
</div>

<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div style="width:100%; max-width:440px;">
        <div style="text-align:center; margin-bottom:32px;">
            <div class="sba-logo" style="justify-content:center; margin-bottom:24px;">
                <svg class="sba-logo__mark" viewBox="0 0 80 80" width="60" height="60">
                    <path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/>
                    <path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/>
                    <text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text>
                    <text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text>
                    <text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text>
                </svg>
            </div>
            <h1 style="font-size:1.5rem; font-weight:800; color:var(--text-primary);">Reset your password</h1>
            <p style="color:var(--text-secondary); margin-top:8px;">Enter your email to receive a recovery link</p>
        </div>

        <div class="card card--shadow" id="resetCard">
            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div style="position:relative;">
                        <i class="fa-solid fa-envelope" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required style="padding-left:40px;">
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Send Recovery Link</button>
            </form>

            <div style="margin-top:24px; text-align:center;">
                <a href="login.html" class="footer__link" style="font-weight:700; color:var(--navy);"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
            </div>
        </div>

        <div class="card card--shadow" id="successState" style="display:none; text-align:center;">
            <div style="width:60px; height:60px; background:var(--success-bg); color:var(--success); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto 20px;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 style="font-weight:800; margin-bottom:12px;">Link Sent!</h2>
            <p style="color:var(--text-secondary); margin-bottom:24px;">Check your email inbox for instructions to reset your password.</p>
            <a href="login.html" class="btn btn--primary btn--full">Return to Login</a>
        </div>
    </div>
</div>

<script type="module">
    import * as app from './app.js';
    import * as fb from './firebase-config.js';

    app.initTheme();

    const resetForm = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const resetCard = document.getElementById('resetCard');
    const successState = document.getElementById('successState');

    resetForm.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();

        app.setButtonLoading(submitBtn, true, 'Sending...');

        try {
            await fb.sendPasswordResetEmail(fb.auth, email);
            app.showToast('Recovery link sent successfully!', 'success');
            resetCard.style.display = 'none';
            successState.style.display = 'block';
        } catch (error) {
            console.error(error);
            app.setButtonLoading(submitBtn, false);
            let msg = "Could not send reset link.";
            if (error.code === 'auth/user-not-found') msg = "No account found with this email.";
            app.showToast(msg, 'error');
        }
    };
</script>
</body>
</html>
