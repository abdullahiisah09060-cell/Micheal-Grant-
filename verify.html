<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Email Verification | SBA Grant Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .v-layout { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .v-card { max-width: 480px; width: 100%; animation: fadeSlide 0.4s ease; }
        .envelope-wrap { font-size: 5rem; color: var(--navy); margin-bottom: 30px; animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>
    <div class="gov-banner" style="position: fixed; top: 0; left: 0; right: 0;">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA">
        <span>An official website of the United States government</span>
    </div>

    <div class="v-layout">
        <div class="v-card">
            <div class="envelope-wrap"><i class="fa-solid fa-envelope-open-text"></i></div>
            <h1 style="font-size: 2rem; font-weight: 900; color: var(--navy); margin-bottom: 12px;">Check Your Inbox</h1>
            <p class="text-muted mb-4">A federal verification link has been sent to:</p>
            <div class="badge badge--confirmed mb-8" id="userEmail" style="font-size: 1.1rem; text-transform: none; padding: 12px 24px;">...</div>
            
            <div class="card card--shadow text-left">
                <p class="text-muted mb-6" style="font-size: 0.95rem; line-height: 1.7;">Please click the activation link in the email to secure your account. If you do not see the email, check your <strong>Promotions</strong> or <strong>Spam</strong> folders.</p>
                <div class="flex flex-col gap-4">
                    <button class="btn btn--primary btn--full btn--lg" id="btnResend">Resend Verification Email</button>
                    <button class="btn btn--ghost btn--full" id="btnSignOut">Sign out and try another email</button>
                </div>
            </div>
            <div class="mt-8 text-muted" style="font-size: 0.85rem; font-weight: 600;">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Waiting for verification...
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, sendEmailVerification, signOut, updateUserData } from './firebase-config.js';
        import { showToast, setButtonLoading } from './app.js';

        let resendCooldown = 0;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('userEmail').textContent = user.email;

            if (user.emailVerified) { window.location.href = 'welcome.html'; return; }

            // Polling
            const poll = setInterval(async () => {
                await user.reload();
                if (user.emailVerified) {
                    clearInterval(poll);
                    await updateUserData(user.uid, { emailVerified: true });
                    window.location.href = 'welcome.html';
                }
            }, 4000);
        });

        document.getElementById('btnResend').onclick = async () => {
            if (resendCooldown > 0) return;
            const btn = document.getElementById('btnResend');
            setButtonLoading(btn, true, 'Sending Link...');
            try {
                await sendEmailVerification(auth.currentUser);
                showToast('A new verification link has been sent.', 'success');
                resendCooldown = 60;
                const timer = setInterval(() => {
                    resendCooldown--;
                    btn.textContent = `Resend available in ${resendCooldown}s`;
                    btn.disabled = true;
                    if(resendCooldown <= 0) { clearInterval(timer); btn.textContent = 'Resend Verification Email'; btn.disabled = false; }
                }, 1000);
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setButtonLoading(btn, false, 'Resend Verification Email');
            }
        };

        document.getElementById('btnSignOut').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
