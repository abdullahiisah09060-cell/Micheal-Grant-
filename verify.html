<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify Identity | SBA Grant Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .v-layout { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 24px; text-align: center; }
        .envelope-anim { font-size: 5rem; color: var(--navy); margin-bottom: 32px; animation: bounce 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <div class="gov-banner" style="position: fixed; top: 0; left: 0; right: 0;">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA">
        <span>An official website of the United States government</span>
    </div>

    <div class="v-layout">
        <div style="max-width: 480px; width: 100%;">
            <div class="envelope-anim"><i class="fa-solid fa-envelope-open-text"></i></div>
            <h1 style="font-size: 1.8rem; font-weight: 900; color: var(--navy); margin-bottom: 12px;">Confirm Email Address</h1>
            <p class="text-muted mb-4">A secure verification link has been dispatched to:</p>
            <div class="badge badge--confirmed mb-8" id="u-email" style="font-size: 1.1rem; text-transform: none; padding: 12px 24px;">...</div>
            
            <div class="card card--shadow text-left">
                <p class="text-secondary mb-6" style="font-size: 0.95rem; line-height: 1.6;">Activate your portal account by clicking the link in your email. If you don't see it, please check your <strong>Promotions</strong> or <strong>Spam</strong> folders.</p>
                <div class="flex flex-col gap-4">
                    <button class="btn btn--primary btn--full btn--lg" id="btnResend">Resend Email</button>
                    <button class="btn btn--ghost btn--full" id="btnExit">Sign out and retry</button>
                </div>
            </div>
            <div class="mt-8 text-muted" style="font-size: 0.85rem; font-weight: 700;">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Detecting verification...
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, sendEmailVerification, signOut, updateUserData } from './firebase-config.js';
        import { showToast, setButtonLoading } from './app.js';

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('u-email').textContent = user.email;
            if (user.emailVerified) { window.location.href = 'welcome.html'; return; }

            const poll = setInterval(async () => {
                await user.reload();
                if (user.emailVerified) {
                    clearInterval(poll);
                    await updateUserData(user.uid, { emailVerified: true });
                    window.location.href = 'welcome.html';
                }
            }, 2500);
        });

        document.getElementById('btnResend').onclick = async () => {
            const btn = document.getElementById('btnResend');
            setButtonLoading(btn, true, 'Sending...');
            try {
                await sendEmailVerification(auth.currentUser);
                showToast('Verification email resent.', 'success');
                let count = 60;
                const timer = setInterval(() => {
                    count--; btn.textContent = `Wait ${count}s`; btn.disabled = true;
                    if(count <= 0) { clearInterval(timer); btn.textContent = 'Resend Email'; btn.disabled = false; }
                }, 1000);
            } catch (err) { showToast(err.message, 'error'); setButtonLoading(btn, false); }
        };

        document.getElementById('btnExit').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
