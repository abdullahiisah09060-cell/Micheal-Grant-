<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying... | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--sba-blue-light);">
    <div class="card" style="text-align: center; max-width: 400px; width: 90%;">
        <div style="margin-bottom: 20px;">
            <i class="fa-solid fa-envelope-circle-check" style="font-size: 4rem; color: var(--sba-navy);"></i>
        </div>
        <h2 style="color: var(--sba-navy);">Confirm Your Email</h2>
        <p style="color: var(--text-secondary); margin-top: 10px;">We've sent a verification link to your inbox. Please click the link to activate your portal access.</p>
        <br>
        <div style="padding: 15px; background: #fff8e1; border-radius: 8px; color: #856404; font-size: 13px;">
            <i class="fa-solid fa-circle-info"></i> Polling for verification status automatically...
        </div>
        <br>
        <button class="btn btn-outline btn-full" onclick="location.reload()">I've Clicked the Link</button>
    </div>
</body>
</html>
