<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .verify-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .env-icon { font-size: 5rem; animation: float 3s ease-in-out infinite; margin-bottom: 20px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="card" style="max-width: 440px; text-align: center; padding: 50px 30px;">
            <div class="env-icon">📩</div>
            <h2>Verify your email</h2>
            <p style="color: var(--text-secondary); margin: 15px 0 30px;">We've sent a verification link to <br><b id="userEmail" style="color: var(--navy);">...</b></p>
            
            <div id="statusMsg" class="badge badge--pending" style="margin-bottom: 30px;">Waiting for verification...</div>
            
            <button id="resendBtn" class="btn btn--outline btn--full" style="margin-bottom: 15px;">Resend Email</button>
            <a href="login.html" class="btn btn--ghost btn--full">Back to Login</a>
        </div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, sendEmailVerification, updateUserData } from './firebase-config.js';
        import { initTheme, showToast } from './app.js';

        initTheme();

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('userEmail').innerText = user.email;

            // Polling for verification
            const poll = setInterval(async () => {
                await user.reload();
                if (user.emailVerified) {
                    clearInterval(poll);
                    document.getElementById('statusMsg').className = 'badge badge--approved';
                    document.getElementById('statusMsg').innerText = 'Email Verified ✓';
                    await updateUserData(user.uid, { emailVerified: true });
                    setTimeout(() => window.location.href = 'welcome.html', 1500);
                }
            }, 3000);
        });

        document.getElementById('resendBtn').onclick = async (e) => {
            const btn = e.target;
            try {
                await sendEmailVerification(auth.currentUser);
                showToast("Verification email resent!", "success");
                btn.disabled = true;
                let sec = 60;
                const timer = setInterval(() => {
                    btn.innerText = `Resend in ${sec}s`;
                    if(sec <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = "Resend Email"; }
                    sec--;
                }, 1000);
            } catch (err) { showToast(err.message, "error"); }
        };
    </script>
</body>
</html>
