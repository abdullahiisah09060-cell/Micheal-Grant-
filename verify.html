<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify Email | SBA Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="background: var(--bg); display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;">
    
    <div style="max-width: 480px; width: 100%;">
        <div style="font-size: 5rem; color: var(--navy); margin-bottom: 30px; animation: bounce 2s infinite;"><i class="fa-solid fa-envelope-open-text"></i></div>
        <h1 style="font-size: 2rem; font-weight: 900; color: var(--navy); margin-bottom: 12px;">Confirm Email</h1>
        <p class="text-muted mb-8">We've sent a verification link to <strong id="uMail"></strong>. Please click the link to activate your account.</p>
        
        <div class="card card--shadow text-left">
            <button class="btn btn--primary btn--full btn--lg" id="resend">Resend Verification Email</button>
            <button class="btn btn--ghost btn--full mt-4" id="logout">Sign out and retry</button>
        </div>
        
        <div class="mt-8 text-muted" style="font-size: 0.85rem; font-weight: 600;">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Checking verification status...
        </div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, sendEmailVerification, signOut, updateUserData } from './firebase-config.js';
        import { showToast, setButtonLoading } from './app.js';

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('uMail').textContent = user.email;

            if (user.emailVerified) { window.location.href = 'welcome.html'; return; }

            const poll = setInterval(async () => {
                await user.reload();
                if (user.emailVerified) {
                    clearInterval(poll);
                    await updateUserData(user.uid, { emailVerified: true });
                    window.location.href = 'welcome.html';
                }
            }, 3000);
        });

        document.getElementById('resend').onclick = async () => {
            const btn = document.getElementById('resend'); setButtonLoading(btn, true);
            try {
                await sendEmailVerification(auth.currentUser);
                showToast('Email sent!', 'success');
                let timer = 60;
                const cd = setInterval(() => {
                    timer--; btn.textContent = `Wait ${timer}s`; btn.disabled = true;
                    if(timer <= 0) { clearInterval(cd); btn.textContent = 'Resend Email'; btn.disabled = false; }
                }, 1000);
            } catch (err) { showToast(err.message, 'error'); setButtonLoading(btn, false); }
        };

        document.getElementById('logout').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
