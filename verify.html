<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .verify-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
        .verify-card { max-width: 480px; width: 100%; text-align: center; }
        .envelope-anim { font-size: 4rem; color: var(--navy); margin-bottom: 24px; animation: bounce 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <div class="gov-banner">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA">
        <span>An official website of the United States government</span>
    </div>

    <div class="verify-container">
        <div class="verify-card">
            <div class="envelope-anim"><i class="fa-solid fa-envelope-open-text"></i></div>
            <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 12px;">Confirm Your Email</h1>
            <p class="text-muted mb-4">We've sent a verification link to:</p>
            <div class="badge badge--confirmed mb-8" id="userEmail" style="font-size: 1rem; text-transform: none; padding: 10px 20px;">...</div>
            
            <div class="card card--shadow text-left">
                <p class="text-muted mb-6" style="font-size: 0.9rem; line-height: 1.6;">Click the link in the email to activate your account. If you don't see it, please check your <strong>Spam</strong> or <strong>Promotions</strong> folder.</p>
                <div class="flex flex-col gap-4">
                    <button class="btn btn--primary btn--full" id="btnResend">Resend Verification Email</button>
                    <button class="btn btn--ghost btn--full" id="btnSignOut">Wrong email? Sign Out</button>
                </div>
            </div>
            <p class="mt-8 text-muted" style="font-size: 0.8rem;"><i class="fa-solid fa-circle-notch fa-spin"></i> Waiting for verification...</p>
        </div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, sendEmailVerification, signOut, updateUserData } from './firebase-config.js';
        import { showToast, setButtonLoading } from './app.js';

        let resendTimer = 0;

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('userEmail').textContent = user.email;

            if (user.emailVerified) {
                window.location.href = 'welcome.html';
                return;
            }

            // Auto-polling for verification
            const poll = setInterval(async () => {
                await user.reload();
                if (user.emailVerified) {
                    clearInterval(poll);
                    await updateUserData(user.uid, { emailVerified: true });
                    window.location.href = 'welcome.html';
                }
            }, 4000);
        });

        document.getElementById('btnResend').onclick = async () => {
            if (resendTimer > 0) return;
            const btn = document.getElementById('btnResend');
            setButtonLoading(btn, true, 'Sending...');
            
            try {
                await sendEmailVerification(auth.currentUser);
                showToast('Verification email sent!', 'success');
                resendTimer = 60;
                const countdown = setInterval(() => {
                    resendTimer--;
                    btn.textContent = `Resend in ${resendTimer}s`;
                    btn.disabled = true;
                    if (resendTimer <= 0) {
                        clearInterval(countdown);
                        btn.textContent = 'Resend Verification Email';
                        btn.disabled = false;
                    }
                }, 1000);
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setButtonLoading(btn, false, 'Resend Verification Email');
            }
        };

        document.getElementById('btnSignOut').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
