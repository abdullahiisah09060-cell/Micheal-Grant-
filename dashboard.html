<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="mobile-nav-active-wrap">
        <div style="display: grid; grid-template-columns: 280px 1fr;" id="layoutGrid">
            <aside class="sidebar" id="sidebar" style="background: var(--sba-navy-dark); color: white; padding: 30px 20px;">
                <img src="sba-logo.png" style="height: 40px; filter: brightness(0) invert(1); margin-bottom: 40px;">
                <nav style="display: flex; flex-direction: column; gap: 10px;">
                    <a href="dashboard.html" class="btn btn-primary btn-full" style="justify-content: flex-start;"><i class="fa-solid fa-gauge"></i> Overview</a>
                    <a href="apply.html" class="btn btn-full" style="color: white; justify-content: flex-start;"><i class="fa-solid fa-file-signature"></i> Apply Now</a>
                    <a href="ledger.html" class="btn btn-full" style="color: white; justify-content: flex-start;"><i class="fa-solid fa-list-ul"></i> History</a>
                    <a href="settings.html" class="btn btn-full" style="color: white; justify-content: flex-start;"><i class="fa-solid fa-gear"></i> Settings</a>
                    <a href="index.html" class="btn btn-full" style="color: #ff9999; margin-top: 50px; justify-content: flex-start;"><i class="fa-solid fa-power-off"></i> Logout</a>
                </nav>
            </aside>

            <main style="padding: 20px; background: #f1f5f9; min-height: 100vh;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h2 id="greet">Hello, Applicant</h2>
                    <img src="sba-logo.png" class="hide-desktop" style="height: 30px;">
                </div>

                <div class="card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                        <h4 style="color: var(--sba-navy);">Grant Progress</h4>
                        <small class="hide-desktop" style="color: var(--text-muted);">Swipe <i class="fa-solid fa-arrow-right"></i></small>
                    </div>
                    <div class="pipeline-container">
                        <div class="pipeline" id="pipe">
                            <div class="step completed"><div class="step-icon"><i class="fa-solid fa-user-check"></i></div><div class="step-label">KYC</div></div>
                            <div class="step active"><div class="step-icon"><i class="fa-solid fa-file-pen"></i></div><div class="step-label">Apply</div></div>
                            <div class="step"><div class="step-icon"><i class="fa-solid fa-wallet"></i></div><div class="step-label">Deposit</div></div>
                            <div class="step"><div class="step-icon"><i class="fa-solid fa-receipt"></i></div><div class="step-label">Tax</div></div>
                            <div class="step"><div class="step-icon"><i class="fa-solid fa-award"></i></div><div class="step-label">Award</div></div>
                            <div class="step"><div class="step-icon"><i class="fa-solid fa-money-bill-transfer"></i></div><div class="step-label">Withdraw</div></div>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                    <div class="card" style="border-left: 5px solid var(--sba-navy);">
                        <p style="font-size: 12px; font-weight: 700; color: var(--text-muted);">BALANCE</p>
                        <h2 id="bal" style="color: var(--sba-navy);">$0.00</h2>
                    </div>
                    <div class="card" style="border-left: 5px solid var(--sba-red);">
                        <p style="font-size: 12px; font-weight: 700; color: var(--text-muted);">REQUESTED</p>
                        <h2 id="req" style="color: var(--sba-navy);">$0.00</h2>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { requireAuth, initMobileNav } from './app.js';
        requireAuth((user, userData) => {
            initMobileNav();
            document.getElementById('greet').innerText = `Hello, ${userData.fullName.split(' ')[0]}`;
            document.getElementById('bal').innerText = `$${userData.balance.toLocaleString()}`;
            document.getElementById('req').innerText = `$${userData.requestedAmount.toLocaleString()}`;
            
            if (window.innerWidth <= 1024) {
                document.getElementById('layoutGrid').style.gridTemplateColumns = '1fr';
            }
        });
    </script>
</body>
</html>
