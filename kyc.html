<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .upload-slot { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; transition: var(--transition); background: white; }
        .upload-slot:hover { border-color: var(--sba-navy); background: var(--sba-blue-light); }
        .upload-slot i { font-size: 2rem; color: var(--text-muted); margin-bottom: 10px; }
        .preview-img { width: 100%; height: 150px; object-fit: contain; display: none; margin-top: 10px; border-radius: 8px; }
        @media (max-width: 600px) { .upload-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="container" style="max-width: 700px;">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="sba-logo.png" style="height: 60px; margin-bottom: 20px;">
            <h2 style="color: var(--sba-navy);">Secure Identity Verification</h2>
            <p style="color: var(--text-secondary);">Upload your Government-Issued Photo ID (Driver's License or Passport)</p>
        </div>

        <div class="card">
            <form id="kycForm">
                <div class="upload-grid">
                    <div class="upload-slot" onclick="document.getElementById('idFront').click()">
                        <i class="fa-solid fa-address-card"></i>
                        <p style="font-weight: 700; font-size: 14px;">Front of ID</p>
                        <input type="file" id="idFront" hidden accept="image/*">
                        <img id="frontPreview" class="preview-img">
                    </div>
                    <div class="upload-slot" onclick="document.getElementById('idBack').click()">
                        <i class="fa-solid fa-barcode"></i>
                        <p style="font-weight: 700; font-size: 14px;">Back of ID</p>
                        <input type="file" id="idBack" hidden accept="image/*">
                        <img id="backPreview" class="preview-img">
                    </div>
                </div>

                <div class="alert" style="background: #e0f2fe; color: #0369a1; padding: 15px; border-radius: 8px; font-size: 13px; display: flex; gap: 10px; margin-bottom: 25px;">
                    <i class="fa-solid fa-shield-halved" style="font-size: 1.2rem;"></i>
                    <span>Your documents are encrypted using 256-bit SSL and stored in a secure federal environment.</span>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="kycSubmitBtn">Submit for Verification</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { compressImage } from './firebase-config.js';
        
        // Preview logic
        const handlePreview = (input, previewId) => {
            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const prev = document.getElementById(previewId);
                        prev.src = e.target.result;
                        prev.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                }
            });
        };

        handlePreview(document.getElementById('idFront'), 'frontPreview');
        handlePreview(document.getElementById('idBack'), 'backPreview');
    </script>
</body>
</html>
