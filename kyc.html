<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .kyc-container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s; background: var(--surface-2); position: relative; }
        .upload-zone:hover { border-color: var(--navy); background: var(--navy-light); }
        .preview-img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="kyc-container">
        <div id="statusArea" class="card" style="display: none; text-align: center; padding: 60px 20px;">
            <div id="kycIcon" style="font-size: 4rem; margin-bottom: 20px;"></div>
            <h2 id="kycTitle"></h2>
            <p id="kycMsg" style="color: var(--text-secondary); margin: 15px 0 30px;"></p>
            <div id="kycActions"></div>
        </div>

        <form id="kycForm" class="card" style="display: none; padding: 32px;">
            <h1 style="text-align: center; margin-bottom: 30px;">Verify Your Identity</h1>
            
            <div class="form-group">
                <label class="form-label">Document Type</label>
                <select name="idType" class="form-select" required>
                    <option value="Drivers License">Driver's License</option>
                    <option value="Passport">Passport</option>
                    <option value="State ID">State ID</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Upload Front of ID</label>
                <div class="upload-zone" onclick="document.getElementById('idFront').click()">
                    <span>Click to upload image</span>
                    <input type="file" id="idFront" accept="image/*" style="display: none;" required>
                    <img id="frontPreview" class="preview-img">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Upload Back of ID</label>
                <div class="upload-zone" onclick="document.getElementById('idBack').click()">
                    <span>Click to upload image</span>
                    <input type="file" id="idBack" accept="image/*" style="display: none;" required>
                    <img id="backPreview" class="preview-img">
                </div>
            </div>

            <button type="submit" class="btn btn--primary btn--full btn--lg">Submit Documents</button>
        </form>
    </div>

    <script type="module">
        import { auth, db, updateUserData, compressToBase64, notify, notifyAdmins } from './firebase-config.js';
        import { requireAuth, hideLoader, showToast } from './app.js';

        requireAuth((user, userData) => {
            if (userData.kycStatus === 'IDLE' || userData.kycStatus === 'REJECTED') {
                document.getElementById('kycForm').style.display = 'block';
            } else {
                document.getElementById('statusArea').style.display = 'block';
                renderKYCStatus(userData);
            }
            hideLoader();
        });

        function renderKYCStatus(data) {
            const icon = document.getElementById('kycIcon');
            const title = document.getElementById('kycTitle');
            const msg = document.getElementById('kycMsg');
            const actions = document.getElementById('kycActions');

            if (data.kycStatus === 'UNDER_REVIEW') {
                icon.innerText = '🔎';
                title.innerText = 'Identity Under Review';
                msg.innerText = 'We are verifying your documents. This usually takes 24-48 hours.';
            } else if (data.kycStatus === 'APPROVED') {
                icon.innerText = '✅';
                title.innerText = 'Identity Verified';
                msg.innerText = 'Your identity has been successfully verified. You can now proceed with your grant application.';
                actions.innerHTML = `<a href="apply.html" class="btn btn--primary">Apply for Grant</a>`;
            }
        }

        const handlePreview = (input, previewId) => {
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if(file) {
                    const base64 = await compressToBase64(file);
                    const preview = document.getElementById(previewId);
                    preview.src = base64;
                    preview.style.display = 'block';
                    input.dataset.base64 = base64;
                }
            };
        };

        handlePreview(document.getElementById('idFront'), 'frontPreview');
        handlePreview(document.getElementById('idBack'), 'backPreview');

        document.getElementById('kycForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const front = document.getElementById('idFront').dataset.base64;
            const back = document.getElementById('idBack').dataset.base64;

            if(!front || !back) return showToast("Please upload both sides", "warning");

            try {
                btn.disabled = true;
                const uid = auth.currentUser.uid;

                await updateUserData(uid, {
                    kycStatus: 'UNDER_REVIEW',
                    kyc: {
                        idType: e.target.idType.value,
                        idFrontBase64: front,
                        idBackBase64: back,
                        submittedAt: new Date().toISOString()
                    }
                });

                await notify(uid, { title: "ID Submitted", message: "Your identity documents are being reviewed.", type: "info" });
                await notifyAdmins({ title: "KYC Pending", message: "A user submitted identity documents.", type: "action", link: "admin-portal.html" });

                showToast("Documents submitted", "success");
                setTimeout(() => location.reload(), 1500);
            } catch (err) {
                showToast(err.message, "error");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
