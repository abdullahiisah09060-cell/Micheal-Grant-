<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Identity Verification | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>

<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="app-sidebar__overlay" id="sidebarOverlay"></div>

    <main class="app-main">
        <div id="pageHeader"></div>

        <div class="app-main__content" style="max-width: 800px;">
            <div id="kycStatusView" style="display:none;">
                <div class="status-screen">
                    <div id="kycIcon" class="status-screen__icon"></div>
                    <h1 id="kycTitle" class="status-screen__title"></h1>
                    <p id="kycMsg" class="status-screen__message"></p>
                    <div id="kycActions"></div>
                </div>
            </div>

            <div id="kycFormView" style="display:none;">
                <div class="card mb-8">
                    <h3 class="mb-4" style="font-weight:800;">Verify Your Identity</h3>
                    <p class="text-muted mb-6" style="font-size:0.9rem;">To prevent fraud and comply with federal regulations, please provide a government-issued ID.</p>
                    
                    <form id="kycForm">
                        <div class="form-row">
                            <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="k-name" class="form-input" required></div>
                            <div class="form-group"><label class="form-label">ID Type</label>
                                <select id="k-type" class="form-select" required>
                                    <option value="Driver's License">Driver's License</option>
                                    <option value="Passport">Passport</option>
                                    <option value="State ID">State ID</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Front of ID</label>
                                <div class="upload-area" id="up-front">
                                    <i class="fa-solid fa-id-card upload-area__icon"></i>
                                    <p class="upload-area__label">Click or Drag to Upload</p>
                                    <img class="upload-area__preview" id="pre-front">
                                    <input type="file" id="in-front" hidden accept="image/*">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Back of ID</label>
                                <div class="upload-area" id="up-back">
                                    <i class="fa-solid fa-address-card upload-area__icon"></i>
                                    <p class="upload-area__label">Click or Drag to Upload</p>
                                    <img class="upload-area__preview" id="pre-back">
                                    <input type="file" id="in-back" hidden accept="image/*">
                                </div>
                            </div>
                        </div>

                        <div class="alert alert--warning mb-6" style="font-size:0.8rem;">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            Ensure all text on the ID is clearly legible and the entire document is visible.
                        </div>

                        <button type="submit" class="btn btn--primary btn--full" id="kycBtn">Submit for Verification</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { updateUserData, serverTimestamp, compressToBase64, notifyAdmins, addLedgerEntry } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading } from './app.js';

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'kyc', userData });
        buildDock({ activeId: 'home' });
        buildPageHeader({ title: 'Identity KYC', subtitle: 'Federal security verification', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        const statusView = document.getElementById('kycStatusView');
        const formView = document.getElementById('kycFormView');

        if(userData.kycStatus === 'IDLE') {
            formView.style.display = 'block';
            document.getElementById('k-name').value = userData.fullName;
        } else {
            statusView.style.display = 'block';
            const icon = document.getElementById('kycIcon');
            if(userData.kycStatus === 'UNDER_REVIEW') {
                icon.className = 'status-screen__icon status-screen__icon--info';
                icon.innerHTML = '<i class="fa-solid fa-magnifying-glass fa-bounce"></i>';
                document.getElementById('kycTitle').textContent = 'Documents Under Review';
                document.getElementById('kycMsg').textContent = 'Our compliance team is verifying your identity documents. This usually takes 24-48 hours.';
            } else if(userData.kycStatus === 'APPROVED') {
                icon.className = 'status-screen__icon status-screen__icon--success';
                icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                document.getElementById('kycTitle').textContent = 'Identity Verified';
                document.getElementById('kycMsg').textContent = 'Your identity has been successfully verified. You can now proceed with your grant application.';
                document.getElementById('kycActions').innerHTML = '<a href="apply.html" class="btn btn--primary">Continue to Application</a>';
            } else if(userData.kycStatus === 'REJECTED') {
                icon.className = 'status-screen__icon status-screen__icon--error';
                icon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                document.getElementById('kycTitle').textContent = 'Verification Failed';
                document.getElementById('kycMsg').textContent = userData.kyc?.reviewNote || 'The documents provided were unclear or invalid.';
                document.getElementById('kycActions').innerHTML = '<button class="btn btn--outline" id="retryKyc">Retry Submission</button>';
                document.getElementById('retryKyc').onclick = () => updateUserData(user.uid, { kycStatus: 'IDLE' }).then(()=>location.reload());
            }
        }

        // Upload Handlers
        let frontB64 = '', backB64 = '';
        const handleUp = async (inId, preId, upId) => {
            const f = document.getElementById(inId).files[0];
            if(!f) return;
            const b64 = await compressToBase64(f);
            document.getElementById(preId).src = b64;
            document.getElementById(preId).style.display = 'block';
            document.getElementById(upId).classList.add('has-file');
            return b64;
        };
        document.getElementById('up-front').onclick = () => document.getElementById('in-front').click();
        document.getElementById('up-back').onclick = () => document.getElementById('in-back').click();
        document.getElementById('in-front').onchange = async () => frontB64 = await handleUp('in-front', 'pre-front', 'up-front');
        document.getElementById('in-back').onchange = async () => backB64 = await handleUp('in-back', 'pre-back', 'up-back');

        document.getElementById('kycForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!frontB64) return showToast('Please upload the front of your ID', 'warning');
            const btn = document.getElementById('kycBtn');
            setButtonLoading(btn, true);

            const payload = {
                fullName: document.getElementById('k-name').value,
                idType: document.getElementById('k-type').value,
                idFrontBase64: frontB64,
                idBackBase64: backB64,
                submittedAt: serverTimestamp()
            };

            try {
                await updateUserData(user.uid, { kyc: payload, kycStatus: 'UNDER_REVIEW' });
                await addLedgerEntry(user.uid, { type: 'kyc', amount: 0, description: 'KYC Identity Submission', status: 'PENDING' });
                await notifyAdmins({ title: 'New KYC Submission', message: `${userData.fullName} submitted identity docs.`, type: 'action' });
                location.reload();
            } catch(err) {
                showToast(err.message, 'error');
                setButtonLoading(btn, false);
            }
        };
    });
</script>
</body>
</html>
