<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: linear-gradient(135deg, #003087 0%, #001f5c 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .welcome-card { background: white; color: var(--text-primary); max-width: 500px; width: 100%; border-radius: var(--r-2xl); padding: 50px 40px; text-align: center; position: relative; z-index: 2; box-shadow: var(--shadow-lg); }
        .success-checkmark { width: 80px; height: 80px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; background: var(--success-bg); color: var(--success); border-radius: 50%; font-size: 2.5rem; }
        .checklist { text-align: left; margin: 30px 0; display: grid; gap: 12px; }
        .check-item { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 500; }
        .check-item i.done { color: var(--success); }
        .check-item i.todo { color: var(--border); }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    
    <div class="welcome-card">
        <div class="success-checkmark"><i class="fa-solid fa-check"></i></div>
        <h1 style="font-weight:900; font-size:1.8rem; line-height:1.2; margin-bottom:12px;">Account Verified! 🎉</h1>
        <p style="color:var(--text-secondary);">Welcome to the SBA Grant Portal. Your enrollment is now active.</p>

        <div class="checklist">
            <div class="check-item"><i class="fa-solid fa-circle-check done"></i> Account Created</div>
            <div class="check-item"><i class="fa-solid fa-circle-check done"></i> Email Verified</div>
            <div class="check-item"><i class="fa-solid fa-circle todo"></i> Complete KYC Identity</div>
            <div class="check-item"><i class="fa-solid fa-circle todo"></i> Submit Grant Application</div>
        </div>

        <a href="dashboard.html" class="btn btn--primary btn--full btn--lg" id="btnDashboard">
            Enter Dashboard <span id="countdown">(5)</span>
        </a>
    </div>

    <script type="module">
        import { requireAuth } from './app.js';
        
        requireAuth((user, userData) => {
            // Confetti implementation
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#003087', '#c8102e', '#fbbf24', '#22c55e', '#ffffff'];

            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3 + 2,
                    angle: Math.random() * 6.28
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, 6.28);
                    ctx.fill();
                    p.y += p.speed;
                    p.x += Math.sin(p.angle) * 2;
                    if(p.y > canvas.height) p.y = -20;
                });
                requestAnimationFrame(draw);
            }
            draw();

            // Auto Redirect
            let count = 5;
            const timer = setInterval(() => {
                count--;
                document.getElementById('countdown').innerText = `(${count})`;
                if(count <= 0) {
                    clearInterval(timer);
                    window.location.href = 'dashboard.html';
                }
            }, 1000);
        });
    </script>
</body>
</html>
