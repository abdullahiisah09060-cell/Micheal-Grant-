<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: radial-gradient(circle at center, var(--navy) 0%, var(--navy-dark) 100%); color: white; overflow: hidden; }
        .welcome-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .check-svg { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--success); margin-bottom: 40px; animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .roadmap { text-align: left; max-width: 350px; margin: 40px auto; }
        .roadmap-item { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; font-size: 0.95rem; opacity: 0; animation: fadeSlide 0.6s forwards; }
        .roadmap-item i { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-style: normal; }
        .roadmap-item.done i { background: var(--success); border-color: var(--success); color: white; }
    </style>
</head>
<body>
    <canvas id="confetti" style="position: fixed; inset: 0; pointer-events: none; z-index: 1000;"></canvas>
    <div class="welcome-page">
        <div class="check-svg"><i class="fa-solid fa-check"></i></div>
        <h1 style="font-size: 2.5rem; font-weight: 900;">Welcome to SBA, <span id="uName"></span>!</h1>
        <p style="opacity: 0.8; font-size: 1.1rem; margin-top: 10px;">Your identity has been verified and your account is active.</p>
        
        <div class="roadmap">
            <div class="roadmap-item done" style="animation-delay: 0.2s;"><i class="fa-solid fa-check"></i> Account Created</div>
            <div class="roadmap-item done" style="animation-delay: 0.4s;"><i class="fa-solid fa-check"></i> Email Verified</div>
            <div class="roadmap-item" style="animation-delay: 0.6s;"><i>3</i> Identity KYC Submittal</div>
            <div class="roadmap-item" style="animation-delay: 0.8s;"><i>4</i> Federal Application Review</div>
        </div>

        <a href="dashboard.html" class="btn btn--primary btn--lg" style="background: white; color: var(--navy); border: none; font-weight: 800;">Enter Dashboard</a>
        <p id="cd" style="margin-top: 30px; font-size: 0.85rem; opacity: 0.5;">Redirecting in 8s...</p>
    </div>

    <script type="module">
        import { requireAuth, hideLoader } from './app.js';
        requireAuth((user, userData) => {
            hideLoader();
            document.getElementById('uName').textContent = userData.fullName.split(' ')[0];
            let timer = 8;
            setInterval(() => {
                timer--; document.getElementById('cd').textContent = `Redirecting in ${timer}s...`;
                if(timer === 0) window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>
</html>
