<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: linear-gradient(135deg, #003087 0%, #001f5c 100%); color: white; overflow: hidden; }
        .welcome-card { text-align: center; padding: 40px; animation: scaleUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .check-circle { width: 80px; height: 80px; background: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; font-size: 2.5rem; }
        
        .progress-list { text-align: left; background: rgba(255,255,255,0.1); padding: 20px; border-radius: var(--r-md); margin: 30px 0; }
        .progress-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.9rem; }
        .progress-item.done { color: #4ade80; }
        .progress-item.todo { opacity: 0.5; }

        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 2px; z-index: 0; animation: fall 4s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; position: relative;">
        <div class="welcome-card" style="z-index: 10; max-width: 500px;">
            <div class="check-circle">✓</div>
            <h1 id="welcomeTitle">Welcome to the SBA!</h1>
            <p style="opacity: 0.8; margin-top: 10px;">Your account is officially verified and active.</p>
            
            <div class="progress-list">
                <div class="progress-item done">● Account Created</div>
                <div class="progress-item done">● Email Verified</div>
                <div class="progress-item todo">○ Complete KYC Verification</div>
                <div class="progress-item todo">○ Submit Grant Application</div>
                <div class="progress-item todo">○ Receive Funding</div>
            </div>

            <a href="dashboard.html" class="btn btn--primary btn--lg btn--full" style="background: white; color: var(--navy);">Go to Dashboard</a>
            <p style="font-size: 0.75rem; margin-top: 20px; opacity: 0.6;">Redirecting in <span id="timer">8</span> seconds...</p>
        </div>
    </div>

    <script type="module">
        import { auth, getUserData } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const data = await getUserData(user.uid);
                if (data) document.getElementById('welcomeTitle').innerText = `Welcome, ${data.fullName.split(' ')[0]}!`;
            }
        });

        // Confetti logic
        const colors = ['#ffffff', '#ff0000', '#003087', '#ffd700'];
        for(let i=0; i<80; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-20px';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.opacity = Math.random();
            c.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(c);
        }

        let timeLeft = 8;
        setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) window.location.href = 'dashboard.html';
        }, 1000);
    </script>
</body>
</html>
