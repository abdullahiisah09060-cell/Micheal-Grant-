<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to the SBA | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: radial-gradient(circle at center, var(--navy) 0%, var(--navy-dark) 100%); color: white; overflow: hidden; }
        .w-layout { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .check-anim { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--success); margin-bottom: 40px; animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
        .roadmap { text-align: left; max-width: 380px; margin: 40px auto; width: 100%; }
        .roadmap-item { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; font-size: 1rem; opacity: 0; transform: translateY(15px); animation: fadeSlide 0.6s forwards; }
        .roadmap-item i { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-style: normal; font-weight: 700; }
        .roadmap-item.done i { background: var(--success); border-color: var(--success); color: white; }
    </style>
</head>
<body>
    <canvas id="confetti" class="confetti"></canvas>

    <div class="w-layout">
        <div class="sba-logo mb-12" style="justify-content: center;">
            <svg class="sba-logo__mark" viewBox="0 0 80 80"><path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#ffffff"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#fbbf24"/><text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#ffffff">S</text><text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#ffffff">B</text><text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#ffffff">A</text></svg>
        </div>

        <div class="check-anim"><i class="fa-solid fa-check"></i></div>
        <h1 style="font-size: 2.5rem; font-weight: 900; line-height: 1.1; letter-spacing: -0.03em;">Welcome to the SBA, <span id="firstName">Applicant</span>! 🎉</h1>
        <p style="opacity: 0.8; margin-top: 16px; font-size: 1.2rem;">Your credentials have been verified. Access granted.</p>
        
        <div class="roadmap">
            <div class="roadmap-item done" style="animation-delay: 0.2s;"><i class="fa-solid fa-check"></i> Account Identity Created</div>
            <div class="roadmap-item done" style="animation-delay: 0.4s;"><i class="fa-solid fa-check"></i> Email Address Verified</div>
            <div class="roadmap-item" style="animation-delay: 0.6s;"><i>3</i> Identity Document Submittal</div>
            <div class="roadmap-item" style="animation-delay: 0.8s;"><i>4</i> Federal Application (Form 424)</div>
            <div class="roadmap-item" style="animation-delay: 1.0s;"><i>5</i> Grant Disbursement Authorization</div>
        </div>

        <a href="dashboard.html" class="btn btn--primary btn--lg" style="background: white; color: var(--navy); border: none; padding: 1.2rem 3rem; font-size: 1.1rem;">Enter Portal Console <i class="fa-solid fa-arrow-right"></i></a>
        <p id="redirectCountdown" style="margin-top: 32px; font-size: 0.9rem; opacity: 0.6; font-weight: 600;">Automated redirect in 8s...</p>
    </div>

    <script type="module">
        import { requireAuth, hideLoader } from './app.js';

        requireAuth((user, userData) => {
            hideLoader();
            document.getElementById('firstName').textContent = userData.fullName.split(' ')[0];
            startConfetti();
            
            let time = 8;
            const timer = setInterval(() => {
                time--;
                document.getElementById('redirectCountdown').textContent = `Automated redirect in ${time}s...`;
                if (time <= 0) { clearInterval(timer); window.location.href = 'dashboard.html'; }
            }, 1000);
        });

        function startConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const pieces = [];
            const colors = ['#ffffff', '#fbbf24', '#c8102e', '#003087', '#15803d'];
            for (let i = 0; i < 70; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 8 + 4,
                    d: Math.random() * 12 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 15) - 15
                });
            }
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                    p.y += (Math.cos(p.d) + 1 + p.r / 2) / 2;
                    p.x += Math.sin(p.d);
                    if (p.y > canvas.height) { p.y = -30; p.x = Math.random() * canvas.width; }
                });
                requestAnimationFrame(draw);
            }
            draw();
            setTimeout(() => { canvas.style.opacity = '0'; canvas.style.transition = 'opacity 3s'; }, 5000);
        }
    </script>
</body>
</html>
