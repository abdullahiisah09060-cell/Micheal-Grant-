<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: radial-gradient(circle at center, var(--navy) 0%, var(--navy-dark) 100%); color: white; overflow: hidden; }
        .welcome-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        
        .check-circle { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--success); margin-bottom: 32px; animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .canvas-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
        
        .onboarding-list { text-align: left; max-width: 320px; margin: 40px auto; }
        .onboarding-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.9rem; opacity: 0; transform: translateY(10px); animation: fadeSlide 0.5s forwards; }
        .onboarding-item i { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .onboarding-item.done i { background: var(--success); border-color: var(--success); color: white; }
    </style>
</head>
<body>
    <canvas id="confetti" class="canvas-confetti"></canvas>

    <div class="welcome-container">
        <div class="check-circle"><i class="fa-solid fa-check"></i></div>
        <h1 style="font-size: 2.2rem; font-weight: 900; line-height: 1.2;">Welcome to the SBA, <span id="userName">Applicant</span>! 🎉</h1>
        <p style="opacity: 0.8; margin-top: 12px; font-size: 1.1rem;">Your account has been successfully verified.</p>
        
        <div class="onboarding-list">
            <div class="onboarding-item done" style="animation-delay: 0.2s;"><i class="fa-solid fa-check"></i> Account Created</div>
            <div class="onboarding-item done" style="animation-delay: 0.4s;"><i class="fa-solid fa-check"></i> Email Verified</div>
            <div class="onboarding-item" style="animation-delay: 0.6s;"><i>3</i> Complete KYC Identity</div>
            <div class="onboarding-item" style="animation-delay: 0.8s;"><i>4</i> Submit Grant Application</div>
            <div class="onboarding-item" style="animation-delay: 1.0s;"><i>5</i> Disburse Funding</div>
        </div>

        <a href="dashboard.html" class="btn btn--primary btn--lg" style="background: white; color: var(--navy); border: none;">Enter Dashboard <i class="fa-solid fa-arrow-right"></i></a>
        <p id="redirectTimer" style="margin-top: 24px; font-size: 0.8rem; opacity: 0.5;">Auto-redirecting in 8s...</p>
    </div>

    <script type="module">
        import { requireAuth } from './app.js';

        requireAuth((user, userData) => {
            document.getElementById('userName').textContent = userData.fullName.split(' ')[0];
            initConfetti();
            
            let timeLeft = 8;
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('redirectTimer').textContent = `Auto-redirecting in ${timeLeft}s...`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    window.location.href = 'dashboard.html';
                }
            }, 1000);
        });

        function initConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#003087', '#c8102e', '#fbbf24', '#ffffff', '#15803d'];

            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3 + 2,
                    angle: Math.random() * 360
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.y += p.speed;
                    p.x += Math.sin(p.angle) * 1;
                    if (p.y > canvas.height) p.y = -20;
                });
                requestAnimationFrame(draw);
            }
            draw();
            setTimeout(() => { canvas.style.opacity = '0'; canvas.style.transition = '2s'; }, 5000);
        }
    </script>
</body>
</html>
