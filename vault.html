<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Vault | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 24px; }
        .doc-card { background: white; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; transition: 0.2s; }
        .doc-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--navy); }
        .doc-preview { height: 140px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .doc-preview img { width: 100%; height: 100%; object-fit: cover; filter: blur(2px) grayscale(0.5); }
        .doc-preview .overlay { position: absolute; inset: 0; background: rgba(0,48,135,0.1); display: flex; align-items: center; justify-content: center; color: white; opacity: 0; transition: 0.3s; }
        .doc-card:hover .overlay { opacity: 1; backdrop-filter: blur(4px); }
        .doc-info { padding: 14px; }
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 40px; }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--r-md); }
        .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <main class="app-main">
            <header class="page-header" id="pageHeader"></header>
            <div class="app-main__content">
                <div class="alert alert--info">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Documents in your vault are encrypted and only accessible to authorized SBA review officers.</span>
                </div>
                
                <div class="vault-grid" id="vaultList"></div>
            </div>
        </main>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose"><i class="fa-solid fa-xmark"></i></span>
        <img src="" id="lightboxImg">
    </div>

    <script type="module">
        import { requireAuth, buildSidebar, buildPageHeader, initTheme } from './app.js';

        requireAuth((user, userData) => {
            initTheme();
            buildSidebar({ activeId: 'vault', userData });
            buildPageHeader({ title: 'Document Vault', subtitle: 'Your encrypted submission records', backUrl: 'dashboard.html' });

            const docs = [];
            if (userData.kyc?.idFrontBase64) docs.push({ name: 'ID Front', img: userData.kyc.idFrontBase64, type: 'Identity' });
            if (userData.kyc?.idBackBase64) docs.push({ name: 'ID Back', img: userData.kyc.idBackBase64, type: 'Identity' });
            if (userData.deposit?.receiptBase64) docs.push({ name: 'Deposit Receipt', img: userData.deposit.receiptBase64, type: 'Payment' });
            if (userData.tax?.receiptBase64) docs.push({ name: 'Tax Receipt', img: userData.tax.receiptBase64, type: 'Payment' });

            const list = document.getElementById('vaultList');
            if (docs.length === 0) {
                list.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:100px 0;"><i class="fa-solid fa-folder-open fa-4x" style="color:var(--border);"></i><p class="text-muted mt-4">No documents found in your vault.</p></div>`;
            } else {
                list.innerHTML = docs.map((doc, idx) => `
                    <div class="doc-card">
                        <div class="doc-preview">
                            <img src="${doc.img}">
                            <div class="overlay" onclick="openLightbox('${doc.img}')"><i class="fa-solid fa-eye fa-2x"></i></div>
                        </div>
                        <div class="doc-info">
                            <div style="font-weight:700; font-size:0.9rem;">${doc.name}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted);">${doc.type}</div>
                        </div>
                    </div>
                `).join('');
            }

            window.openLightbox = (src) => {
                document.getElementById('lightboxImg').src = src;
                document.getElementById('lightbox').style.display = 'flex';
            };

            document.getElementById('lightboxClose').onclick = () => {
                document.getElementById('lightbox').style.display = 'none';
            };
        });
    </script>
</body>
</html>
