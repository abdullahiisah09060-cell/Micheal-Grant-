<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document Vault | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .doc-card { cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .doc-card:hover { transform: translateY(-4px); border-color: var(--navy); }
        .doc-thumb { height: 140px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--text-muted); position: relative; }
        .doc-thumb img { width: 100%; height: 100%; object-fit: cover; filter: blur(4px) grayscale(1); opacity: 0.5; }
        .doc-overlay { position: absolute; inset: 0; background: rgba(0,48,135,0.1); display: flex; align-items: center; justify-content: center; color: var(--navy); font-weight: 800; font-size: 0.8rem; }
        
        #viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 40px; }
        #viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <main class="app-main">
        <div id="pageHeader"></div>
        <div class="app-main__content">
            
            <div class="alert alert--info mb-8">
                <i class="fa-solid fa-shield-halved"></i>
                <p>Documents in your vault are encrypted and only accessible to you and your assigned SBA Case Officer.</p>
            </div>

            <div id="vaultList" class="vault-grid mb-12"></div>

            <div class="card">
                <h3 class="mb-4">Upload Additional Support Docs</h3>
                <div class="form-group"><label class="form-label">Document Label</label><input type="text" id="docLabel" class="form-input" placeholder="e.g. Utility Bill, Business License"></div>
                <div class="upload-area" id="up-v"><i class="fa-solid fa-cloud-arrow-up upload-area__icon"></i><p>Click to select file</p><input type="file" id="in-v" hidden accept="image/*"></div>
                <button class="btn btn--primary mt-6" id="btnSave">Save to Vault</button>
            </div>
        </div>
    </main>
</div>

<div id="viewer" onclick="this.style.display='none'">
    <button class="btn btn--ghost" style="position:absolute; top:20px; right:20px; color:white;"><i class="fa-solid fa-xmark"></i> Close</button>
    <img id="viewImg" src="">
</div>

<script type="module">
    import { updateUserData, arrayUnion, compressToBase64, serverTimestamp } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading, formatDate } from './app.js';

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'vault', userData });
        buildDock({ activeId: 'home' });
        buildPageHeader({ title: 'Document Vault', subtitle: 'Secure Federal Storage', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        const render = () => {
            const list = document.getElementById('vaultList'); list.innerHTML = '';
            const docs = [
                { name: 'ID Front', img: userData.kyc?.idFrontBase64, date: userData.kyc?.submittedAt },
                { name: 'ID Back', img: userData.kyc?.idBackBase64, date: userData.kyc?.submittedAt },
                { name: 'Deposit Receipt', img: userData.deposit?.receiptBase64, date: userData.deposit?.submittedAt },
                { name: 'Tax Receipt', img: userData.tax?.receiptBase64, date: userData.tax?.submittedAt }
            ];

            (userData.additionalDocs || []).forEach(d => docs.push(d));

            docs.filter(d => d.img).forEach(d => {
                const card = document.createElement('div');
                card.className = 'card doc-card';
                card.innerHTML = `
                    <div class="doc-thumb">${d.img ? `<img src="${d.img}">` : '<i class="fa-solid fa-file-image"></i>'}<div class="doc-overlay">VIEW FULL</div></div>
                    <div class="p-3" style="padding:15px;">
                        <div style="font-weight:800; font-size:0.9rem;">${d.name}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted);">${formatDate(d.date)}</div>
                    </div>
                `;
                card.onclick = () => {
                    document.getElementById('viewImg').src = d.img;
                    document.getElementById('viewer').style.display = 'flex';
                };
                list.appendChild(card);
            });
        };
        render();

        document.getElementById('up-v').onclick = () => document.getElementById('in-v').click();
        document.getElementById('btnSave').onclick = async () => {
            const file = document.getElementById('in-v').files[0];
            const label = document.getElementById('docLabel').value;
            if(!file || !label) return showToast('Label and file required', 'warning');
            
            const btn = document.getElementById('btnSave'); setButtonLoading(btn, true);
            const b64 = await compressToBase64(file);
            await updateUserData(user.uid, { additionalDocs: arrayUnion({ name:label, img:b64, date: new Date() }) });
            location.reload();
        };
    });
</script>
</body>
</html>
