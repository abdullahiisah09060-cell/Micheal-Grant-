<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document Vault | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .doc-card { cursor: pointer; transition: 0.2s; position: relative; border-radius: var(--r-lg); overflow: hidden; }
        .doc-card:hover { border-color: var(--navy); transform: translateY(-4px); }
        .doc-thumb { height: 160px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--text-muted); position: relative; }
        .doc-thumb img { width: 100%; height: 100%; object-fit: cover; filter: blur(5px); opacity: 0.4; }
        .doc-overlay { position: absolute; inset: 0; background: rgba(0,48,135,0.05); display: flex; align-items: center; justify-content: center; color: var(--navy); font-weight: 900; font-size: 0.75rem; letter-spacing: 1px; }
        
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 30px; animation: modalIn 0.3s ease; }
        .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <main class="app-main">
            <div id="pageHeader"></div>
            <div class="app-main__content">
                
                <div class="alert alert--info mb-10"><i class="fa-solid fa-lock-shield"></i> <p>Documents in your vault are encrypted with AES-256 standards. Only you and your case officer can access these files.</p></div>

                <div id="vaultList" class="vault-grid mb-12"></div>

                <div class="card" style="max-width: 500px;">
                    <h3 class="mb-6">Upload New Document</h3>
                    <div class="form-group"><label class="form-label">Document Title</label><input type="text" id="v-label" class="form-input" placeholder="e.g. Utility Bill"></div>
                    <div class="upload-area" id="v-up-box"><i class="fa-solid fa-cloud-arrow-up upload-area__icon"></i><p>Select file to encrypt</p><input type="file" id="v-in" hidden accept="image/*"></div>
                    <button class="btn btn--primary btn--full mt-6" id="btnSave">Save to Vault</button>
                </div>
            </div>
        </main>
    </div>

    <div class="lightbox" id="lb" onclick="this.style.display='none'">
        <button class="lightbox-close"><i class="fa-solid fa-xmark"></i></button>
        <img id="lb-img" src="">
        <a id="lb-dl" class="btn btn--primary" style="position: absolute; bottom: 30px;" download="SBA-Document.jpg"><i class="fa-solid fa-download"></i> Download</a>
    </div>

    <script type="module">
        import { updateUserData, arrayUnion, compressToBase64, serverTimestamp } from './firebase-config.js';
        import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading, formatDate } from './app.js';

        requireAuth((user, userData) => {
            buildSidebar({ activeId: 'vault', userData });
            buildDock({ activeId: 'home' });
            buildPageHeader({ title: 'Document Vault', subtitle: 'Secure Federal Cloud Storage', backUrl: 'dashboard.html' });
            initNotificationBadge(user.uid);

            const render = () => {
                const list = document.getElementById('vaultList'); list.innerHTML = '';
                const baseDocs = [
                    { name:'ID Front', img: userData.kyc?.idFrontBase64, date: userData.kyc?.submittedAt },
                    { name:'ID Back', img: userData.kyc?.idBackBase64, date: userData.kyc?.submittedAt },
                    { name:'Deposit Receipt', img: userData.deposit?.receiptBase64, date: userData.deposit?.submittedAt },
                    { name:'Tax Receipt', img: userData.tax?.receiptBase64, date: userData.tax?.submittedAt }
                ];
                const all = [...baseDocs, ...(userData.additionalDocs || [])];

                all.forEach(d => {
                    const card = document.createElement('div');
                    card.className = 'card doc-card';
                    card.innerHTML = `
                        <div class="doc-thumb">${d.img ? `<img src="${d.img}"><div class="doc-overlay">CLICK TO DECRYPT</div>` : '<i class="fa-solid fa-file-circle-exclamation"></i>'}</div>
                        <div style="padding: 15px; border-top: 1px solid var(--border-light);">
                            <div style="font-weight: 800; font-size: 0.9rem;">${d.name}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${d.img ? formatDate(d.date) : 'Not uploaded yet'}</div>
                        </div>
                    `;
                    if(d.img) card.onclick = () => {
                        document.getElementById('lb-img').src = d.img;
                        document.getElementById('lb-dl').href = d.img;
                        document.getElementById('lb').style.display = 'flex';
                    };
                    list.appendChild(card);
                });
            };
            render();

            window.onkeydown = (e) => { if(e.key === 'Escape') document.getElementById('lb').style.display = 'none'; };

            document.getElementById('v-up-box').onclick = () => document.getElementById('v-in').click();
            document.getElementById('btnSave').onclick = async () => {
                const f = document.getElementById('v-in').files[0];
                const l = document.getElementById('v-label').value.trim();
                if(!f || !l) return showToast('Title and file required', 'warning');
                const btn = document.getElementById('btnSave'); setButtonLoading(btn, true, 'Encrypting...');
                const b64 = await compressToBase64(f);
                await updateUserData(user.uid, { additionalDocs: arrayUnion({ name:l, img:b64, date: new Date() }) });
                location.reload();
            };
        });
    </script>
</body>
</html>
