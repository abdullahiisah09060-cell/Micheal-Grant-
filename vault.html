<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Vault | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .doc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .doc-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--navy); }
        .doc-preview { height: 140px; background: #eee; display: flex; align-items: center; justify-content: center; position: relative; }
        .doc-preview img { width: 100%; height: 100%; object-fit: cover; filter: blur(2px); transition: 0.3s; }
        .doc-card:hover .doc-preview img { filter: blur(0); }
        .doc-info { padding: 15px; }
        .doc-info h4 { font-size: 0.85rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .doc-info small { color: var(--text-muted); font-size: 0.75rem; }
        
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
    
    <div class="ledger-container">
        <h1>Document Vault</h1>
        <p style="color: var(--text-secondary);">Securely stored copies of your submitted documentation.</p>

        <div id="vaultGrid" class="vault-grid">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="">
    </div>

    <script type="module">
        import { requireAuth, hideLoader } from './app.js';

        requireAuth((user, userData) => {
            const grid = document.getElementById('vaultGrid');
            const docs = [];

            if (userData.kyc?.idFrontBase64) docs.push({ title: 'ID Front', img: userData.kyc.idFrontBase64, date: userData.kyc.submittedAt });
            if (userData.kyc?.idBackBase64) docs.push({ title: 'ID Back', img: userData.kyc.idBackBase64, date: userData.kyc.submittedAt });
            if (userData.deposit?.receiptBase64) docs.push({ title: 'Deposit Receipt', img: userData.deposit.receiptBase64, date: userData.deposit.submittedAt });
            if (userData.tax?.receiptBase64) docs.push({ title: 'Tax Receipt', img: userData.tax.receiptBase64, date: userData.tax.submittedAt });

            if (docs.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 50px; color: var(--text-muted);">No documents uploaded yet.</p>';
            } else {
                docs.forEach(doc => {
                    const card = document.createElement('div');
                    card.className = 'doc-card';
                    card.innerHTML = `
                        <div class="doc-preview"><img src="${doc.img}"></div>
                        <div class="doc-info">
                            <h4>${doc.title}</h4>
                            <small>${new Date(doc.date).toLocaleDateString()}</small>
                        </div>
                    `;
                    card.onclick = () => {
                        document.getElementById('lightboxImg').src = doc.img;
                        document.getElementById('lightbox').style.display = 'flex';
                    };
                    grid.appendChild(card);
                });
            }
            hideLoader();
        });
    </script>
</body>
</html>
