<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SBA Grant Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .reg-step { display: none; }
        .reg-step.active { display: block; animation: modalIn 0.3s ease; }
        .strength-meter { height: 4px; background: var(--border-light); margin-top: 8px; border-radius: 2px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0%; transition: 0.3s; }
    </style>
</head>
<body style="background: var(--bg); min-height: 100vh; padding: 20px;">
    <div style="max-width: 500px; margin: 40px auto;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div class="sba-logo" style="justify-content:center; margin-bottom:12px;">
                <svg style="width:50px; height:50px;" viewBox="0 0 80 80">
                    <path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/>
                    <text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text>
                    <text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text>
                    <text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text>
                </svg>
            </div>
            <h1 style="font-weight:800; color:var(--navy); font-size:1.4rem;">Grant Enrollment</h1>
        </div>

        <div class="pipeline" style="margin-bottom: 40px;">
            <div class="pipeline__step" id="dot1"><div class="pipeline__dot">1</div></div>
            <div class="pipeline__step" id="dot2"><div class="pipeline__dot">2</div></div>
            <div class="pipeline__step" id="dot3"><div class="pipeline__dot">3</div></div>
        </div>

        <div class="card">
            <form id="regForm">
                <!-- Step 1 -->
                <div class="reg-step active" id="step1">
                    <div class="form-group"><label class="form-label">Full Legal Name</label><input type="text" id="fullName" class="form-input" required></div>
                    <div class="form-group"><label class="form-label">Email Address</label><input type="email" id="email" class="form-input" required></div>
                    <div class="form-group">
                        <label class="form-label">Create Password</label>
                        <input type="password" id="password" class="form-input" required>
                        <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>
                    </div>
                    <button type="button" class="btn btn--primary btn--full" onclick="nextStep(2)">Continue &rarr;</button>
                </div>

                <!-- Step 2 -->
                <div class="reg-step" id="step2">
                    <div class="form-group"><label class="form-label">Username</label><input type="text" id="username" class="form-input" placeholder="Letters/numbers only"></div>
                    <div class="form-group"><label class="form-label">Phone Number</label><input type="tel" id="phoneNumber" class="form-input"></div>
                    <div class="form-group">
                        <label class="form-label">Country</label>
                        <select id="country" class="form-select"><option value="United States">United States</option><option value="Canada">Canada</option></select>
                    </div>
                    <div style="display:flex; gap:12px;">
                        <button type="button" class="btn btn--ghost" onclick="nextStep(1)">Back</button>
                        <button type="button" class="btn btn--primary flex-1" onclick="nextStep(3)">Continue &rarr;</button>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="reg-step" id="step3">
                    <div class="form-group"><label class="form-label">Gender</label><select id="gender" class="form-select"><option>Male</option><option>Female</option><option>Other</option></select></div>
                    <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" id="dob" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Referral Code (Optional)</label><input type="text" id="referredBy" class="form-input"></div>
                    <div style="display:flex; gap:12px;">
                        <button type="button" class="btn btn--ghost" onclick="nextStep(2)">Back</button>
                        <button type="submit" class="btn btn--primary flex-1" id="submitBtn">Create Account</button>
                    </div>
                </div>
            </form>
        </div>
        <p style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-secondary);">Already have an account? <a href="login.html" style="color:var(--navy); font-weight:700;">Sign In</a></p>
    </div>

    <script type="module">
        import { auth, db, createUserWithEmailAndPassword, sendEmailVerification, setDoc, doc, buildNewUserPayload, notifyAdmins } from './firebase-config.js';
        import { setButtonLoading, showToast, initTheme } from './app.js';
        initTheme();

        window.nextStep = (n) => {
            document.querySelectorAll('.reg-step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step${n}`).classList.add('active');
            document.querySelectorAll('.pipeline__step').forEach((s, idx) => {
                s.classList.toggle('approved', idx < n - 1);
                s.classList.toggle('review', idx === n - 1);
            });
        };
        nextStep(1);

        document.getElementById('password').oninput = (e) => {
            const val = e.target.value;
            const bar = document.getElementById('strengthBar');
            let score = val.length > 6 ? 33 : 10;
            if (/[A-Z]/.test(val)) score += 33;
            if (/[0-9]/.test(val)) score += 34;
            bar.style.width = score + '%';
            bar.style.background = score < 40 ? 'var(--red)' : score < 80 ? 'var(--warning)' : 'var(--success)';
        };

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            setButtonLoading(btn, true, 'Creating profile...');

            const data = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                username: document.getElementById('username').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                country: document.getElementById('country').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                referredBy: document.getElementById('referredBy').value
            };

            try {
                const cred = await createUserWithEmailAndPassword(auth, data.email, document.getElementById('password').value);
                const payload = buildNewUserPayload({ uid: cred.user.uid, ...data });
                await setDoc(doc(db, "users", cred.user.uid), payload);
                await sendEmailVerification(cred.user);
                await notifyAdmins({ title: 'New User Registered', message: `${data.fullName} joined the portal.`, type: 'info' });
                window.location.href = 'verify.html';
            } catch (err) {
                setButtonLoading(btn, false);
                showToast(err.message, 'error');
            }
        };
    </script>
</body>
</html>
