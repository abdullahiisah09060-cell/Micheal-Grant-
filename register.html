<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SBA Grant Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .reg-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .reg-card { width: 100%; max-width: 500px; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .step-indicator::before { content: ''; position: absolute; top: 15px; left: 0; right: 0; height: 2px; background: var(--border); z-index: 1; }
        .step-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; z-index: 2; position: relative; transition: var(--t-base); font-size: 0.8rem; }
        .step-dot.active { border-color: var(--navy); background: var(--navy); color: white; }
        .step-dot.completed { border-color: var(--success); background: var(--success); color: white; }
        
        .reg-step { display: none; }
        .reg-step.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .strength-meter { height: 4px; background: var(--border); margin-top: 8px; border-radius: 2px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0; transition: width 0.3s ease, background 0.3s ease; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader"><div class="spinner"></div></div>

    <div class="reg-container">
        <div class="card reg-card">
            <div class="sba-logo" style="justify-content: center; margin-bottom: 30px;">
                <svg width="32" height="32" viewBox="0 0 60 60"><path d="M8 8 H24 V14 H14 V24 H8 Z" fill="#003087"/></svg>
                <span style="font-weight: 800; color: var(--navy);">SBA Registration</span>
            </div>

            <div class="step-indicator">
                <div class="step-dot active" id="dot1">1</div>
                <div class="step-dot" id="dot2">2</div>
                <div class="step-dot" id="dot3">3</div>
            </div>

            <form id="regForm">
                <!-- STEP 1: Account -->
                <div class="reg-step active" id="step1">
                    <h3 style="margin-bottom: 20px;">Account Credentials</h3>
                    <div class="form-group">
                        <label class="form-label">Full Legal Name</label>
                        <input type="text" id="fullName" class="form-input" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-input" required placeholder="johndoe88">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" required placeholder="••••••••">
                        <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>
                    </div>
                    <button type="button" class="btn btn--primary btn--full" onclick="nextStep(2)">Continue →</button>
                </div>

                <!-- STEP 2: Personal -->
                <div class="reg-step" id="step2">
                    <h3 style="margin-bottom: 20px;">Personal Details</h3>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-input" required placeholder="+1 (555) 000-0000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Country</label>
                        <select id="country" class="form-select" required>
                            <option value="United States">United States</option>
                            <option value="Canada">Canada</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <!-- List simplified for brevity, logic remains complete -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select id="gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" id="dob" class="form-input" required>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="btn btn--ghost btn--full" onclick="nextStep(1)">← Back</button>
                        <button type="button" class="btn btn--primary btn--full" onclick="nextStep(3)">Continue</button>
                    </div>
                </div>

                <!-- STEP 3: Program -->
                <div class="reg-step" id="step3">
                    <h3 style="margin-bottom: 20px;">Program Allocation</h3>
                    <div class="card" style="background: var(--navy-light); border: 1px solid var(--navy); margin-bottom: 24px;">
                        <h4 style="color: var(--navy); margin-bottom: 8px;">SBA Grant Program</h4>
                        <p style="font-size: 0.85rem; color: var(--navy);">You are applying for the primary federal small business support grant. Eligible applicants can receive up to $500,000 in non-repayable funding.</p>
                    </div>
                    <div class="form-group">
                        <label style="display: flex; gap: 10px; cursor: pointer; font-size: 0.85rem;">
                            <input type="checkbox" required>
                            <span>I agree to the <a href="terms.html" target="_blank" style="color: var(--navy);">Terms of Service</a> and federal grant regulations.</span>
                        </label>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="btn btn--ghost btn--full" onclick="nextStep(2)">← Back</button>
                        <button type="submit" id="submitBtn" class="btn btn--primary btn--full">Create Account</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db, createUserWithEmailAndPassword, sendEmailVerification, buildNewUserPayload, notifyAdmins } from './firebase-config.js';
        import { setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { showToast, showLoader, hideLoader, initTheme } from './app.js';

        initTheme();

        window.nextStep = (n) => {
            if (n > currentStep && !validateStep(currentStep)) return;
            document.querySelectorAll('.reg-step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            
            // Update dots
            document.querySelectorAll('.step-dot').forEach((dot, idx) => {
                dot.classList.remove('active', 'completed');
                if (idx + 1 < n) dot.classList.add('completed');
                if (idx + 1 === n) dot.classList.add('active');
            });
            currentStep = n;
        };

        let currentStep = 1;

        function validateStep(n) {
            const step = document.getElementById('step' + n);
            const inputs = step.querySelectorAll('input[required], select[required]');
            let valid = true;
            inputs.forEach(i => {
                if (!i.value) {
                    i.style.borderColor = 'var(--error)';
                    valid = false;
                } else {
                    i.style.borderColor = 'var(--border)';
                }
            });
            if(!valid) showToast("Please fill all required fields", "warning");
            return valid;
        }

        // Auto-generate username
        document.getElementById('fullName').oninput = (e) => {
            const val = e.target.value.toLowerCase().replace(/\s+/g, '');
            if (val) document.getElementById('username').value = val + Math.floor(Math.random() * 100);
        };

        // Password strength
        document.getElementById('password').oninput = (e) => {
            const pass = e.target.value;
            const bar = document.getElementById('strengthBar');
            let strength = 0;
            if (pass.length > 6) strength += 25;
            if (pass.match(/[A-Z]/)) strength += 25;
            if (pass.match(/[0-9]/)) strength += 25;
            if (pass.match(/[^A-Za-z0-9]/)) strength += 25;
            bar.style.width = strength + '%';
            bar.style.background = strength < 50 ? 'var(--error)' : strength < 100 ? 'var(--warning)' : 'var(--success)';
        };

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            showLoader();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                const payload = buildNewUserPayload({
                    uid: cred.user.uid,
                    email: email,
                    fullName: document.getElementById('fullName').value,
                    username: document.getElementById('username').value,
                    phoneNumber: document.getElementById('phone').value,
                    country: document.getElementById('country').value,
                    gender: document.getElementById('gender').value,
                    dob: document.getElementById('dob').value
                });

                await setDoc(doc(db, 'users', cred.user.uid), payload);
                await sendEmailVerification(cred.user);
                await notifyAdmins({
                    title: "New Registration",
                    message: `A new user ${payload.fullName} has joined.`,
                    type: "info",
                    link: "admin-portal.html"
                });

                window.location.href = 'verify.html';
            } catch (error) {
                hideLoader();
                showToast(error.message, "error");
            }
        };
    </script>
</body>
</html>
