<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fund Account | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .deposit-step { display: none; animation: fadeSlide 0.3s ease; }
        .deposit-step.active { display: block; }
    </style>
</head>
<body>

    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <main class="app-main">
            <div id="pageHeader"></div>
            <div class="app-main__content" style="max-width: 700px;">
                
                <div id="statusView" class="status-screen" style="display: none;">
                    <div id="stIcon" class="status-screen__icon"></div>
                    <h1 id="stTitle" class="status-screen__title"></h1>
                    <p id="stMsg" class="status-screen__message"></p>
                    <div id="stActions"></div>
                </div>

                <div id="flowView">
                    <!-- Step 1 -->
                    <div class="deposit-step active" id="step1">
                        <h3 class="mb-8">1. Select Payment Method</h3>
                        <div class="method-selector">
                            <div class="method-card" data-m="crypto"><div class="method-card__icon text-warning"><i class="fa-solid fa-bitcoin-sign"></i></div><div class="method-card__name">Cryptocurrency</div></div>
                            <div class="method-card" data-m="bank"><div class="method-card__icon text-navy"><i class="fa-solid fa-building-columns"></i></div><div class="method-card__name">Bank Wire</div></div>
                            <div class="method-card" data-m="zelle"><div class="method-card__icon text-success"><i class="fa-solid fa-envelope"></i></div><div class="method-card__name">Zelle Pay</div></div>
                        </div>
                        <button class="btn btn--primary btn--full btn--lg" id="btn1" disabled>Continue to Details</button>
                    </div>

                    <!-- Step 2: Coin -->
                    <div class="deposit-step" id="step2">
                        <h3 class="mb-8">2. Select Digital Asset</h3>
                        <div class="coin-grid" id="coinGrid"></div>
                        <div id="netList" class="mb-8"></div>
                        <button class="btn btn--ghost" onclick="showStep(1)">Back</button>
                    </div>

                    <!-- Step 3: Address/Receipt -->
                    <div class="deposit-step" id="step3">
                        <h3 class="mb-8">3. Settlement & Receipt</h3>
                        <div id="addrBox" class="address-display"></div>
                        
                        <form id="depForm" class="mt-10">
                            <div class="form-group"><label class="form-label">Amount Sent (USD)</label><input type="number" id="d-amt" class="form-input" placeholder="0.00" required></div>
                            <div class="form-group">
                                <label class="form-label">Upload Proof of Transfer</label>
                                <div class="upload-area" id="up-box"><i class="fa-solid fa-receipt upload-area__icon"></i><p>Tap to upload screenshot</p><img id="pre-r" class="upload-area__preview"><input type="file" id="in-r" hidden accept="image/*"></div>
                            </div>
                            <div class="flex gap-4 mt-8">
                                <button type="button" class="btn btn--ghost" onclick="showStep(1)">Restart</button>
                                <button type="submit" class="btn btn--primary flex-1" id="btnSubmit">Confirm Deposit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, updateUserData, serverTimestamp, compressToBase64, addLedgerEntry, notifyAdmins } from './firebase-config.js';
        import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading, copyToClipboard } from './app.js';

        const WALLETS = {
            BTC:  { name:'Bitcoin', icon:'fa-bitcoin-sign', color:'#f7931a', nets: { 'Bitcoin':'bc1qrrc86d42pzejhwxxsjfctmjkj7dl52q0j0qy9k' }},
            ETH:  { name:'Ethereum', icon:'fa-ethereum', color:'#627eea', nets: { 'ERC20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Base':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' }},
            USDT: { name:'USDT', icon:'fa-dollar-sign', color:'#26a17b', nets: { 'TRC20':'TKZcchSTjdJXEoVZmErwfiSUmZFnh6Tjwx', 'ERC20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'BEP20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Solana':'9UgFrLx796JagxDAJARrqzzW7c9DPHfrS2n3UH7vsMf4' }},
            USDC: { name:'USDC', icon:'fa-circle-dollar-to-slot', color:'#2775ca', nets: { 'ERC20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Base':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Solana':'9UgFrLx796JagxDAJARrqzzW7c9DPHfrS2n3UH7vsMf4' }},
            BNB:  { name:'BNB', icon:'fa-bolt', color:'#f3ba2f', nets: { 'BEP20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' }},
            SOL:  { name:'Solana', icon:'fa-sun', color:'#9945ff', nets: { 'Solana':'9UgFrLx796JagxDAJARrqzzW7c9DPHfrS2n3UH7vsMf4' }},
            TRX:  { name:'TRON', icon:'fa-wave-square', color:'#ef0027', nets: { 'TRC20':'TKZcchSTjdJXEoVZmErwfiSUmZFnh6Tjwx' }},
            TON:  { name:'TON', icon:'fa-circle-nodes', color:'#0098ea', nets: { 'TON Chain':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' }}
        };

        requireAuth((user, userData) => {
            buildSidebar({ activeId: 'deposit', userData });
            buildDock({ activeId: 'deposit' });
            buildPageHeader({ title: 'Fund Account', subtitle: 'Add liquidity to Treasury Wallet', backUrl: 'dashboard.html' });
            initNotificationBadge(user.uid);

            if(userData.depositStatus === 'PENDING') {
                document.getElementById('flowView').style.display = 'none';
                document.getElementById('statusView').style.display = 'block';
                const ic = document.getElementById('stIcon');
                ic.className = 'status-screen__icon status-screen__icon--info';
                ic.innerHTML = '<i class="fa-solid fa-clock fa-spin"></i>';
                document.getElementById('stTitle').textContent = 'Verification Pending';
                document.getElementById('stMsg').textContent = 'Your deposit is being verified with the treasury node. Processing takes 1-4 hours.';
            }

            let selMethod = '', selCoin = '', selNet = '', r64 = '';

            window.showStep = (n) => {
                document.querySelectorAll('.deposit-step').forEach(s => s.classList.remove('active'));
                document.getElementById('step'+n).classList.add('active');
            };

            document.querySelectorAll('.method-card').forEach(c => {
                c.onclick = () => {
                    document.querySelectorAll('.method-card').forEach(x => x.classList.remove('selected'));
                    c.classList.add('selected'); selMethod = c.dataset.m;
                    document.getElementById('btn1').disabled = false;
                };
            });

            document.getElementById('btn1').onclick = () => {
                if(selMethod === 'crypto') {
                    renderCoins(); showStep(2);
                } else {
                    renderLegacy(); showStep(3);
                }
            };

            function renderCoins() {
                const g = document.getElementById('coinGrid'); g.innerHTML = '';
                Object.entries(WALLETS).forEach(([k,v]) => {
                    const d = document.createElement('div'); d.className = 'coin-btn';
                    d.innerHTML = `<i class="fa-solid ${v.icon}" style="color:${v.color}"></i><span class="coin-btn__name">${k}</span>`;
                    d.onclick = () => {
                        selCoin = k; document.getElementById('netList').innerHTML = '<p class="form-label mb-3">Select Network</p>';
                        Object.entries(v.nets).forEach(([n,a]) => {
                            const b = document.createElement('button'); b.className = 'network-btn'; b.textContent = n;
                            b.onclick = () => { selNet = n; renderFinal(a); showStep(3); };
                            document.getElementById('netList').appendChild(b);
                        });
                    };
                    g.appendChild(d);
                });
            }

            function renderFinal(a) {
                document.getElementById('addrBox').innerHTML = `
                    <div class="address-display__label">Send ${selCoin} to this ${selNet} address:</div>
                    <div class="address-display__value">${a}</div>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${a}" style="margin-bottom:15px; border-radius:8px; background:white; padding:5px;">
                    <button type="button" class="btn btn--secondary btn--sm" onclick="copyToClipboard('${a}')">Copy Address</button>
                    <div class="address-display__warning">⚠️ Only send ${selCoin} via ${selNet}. Wrong network results in permanent loss.</div>
                `;
            }

            function renderLegacy() {
                const box = document.getElementById('addrBox');
                if(selMethod === 'bank') box.innerHTML = `<div style="color:white; font-size:0.9rem;"><strong>Treasury Wire</strong><br>Bank: JPMorgan Chase<br>Routing: 021000021<br>Account: SBA-TREAS-${user.uid.substring(0,8).toUpperCase()}</div>`;
                else box.innerHTML = `<div style="color:white; font-size:0.9rem;"><strong>Zelle Settlement</strong><br>Email: treasury.disbursement@sba.gov.us<br>Memo: ${userData.fullName}</div>`;
            }

            document.getElementById('up-box').onclick = () => document.getElementById('in-r').click();
            document.getElementById('in-r').onchange = async (e) => {
                if(!e.target.files[0]) return;
                r64 = await compressToBase64(e.target.files[0]);
                document.getElementById('pre-r').src = r64;
                document.getElementById('pre-r').style.display = 'block';
                document.getElementById('up-box').classList.add('has-file');
            };

            document.getElementById('depForm').onsubmit = async (e) => {
                e.preventDefault();
                if(!r64) return showToast('Receipt required', 'warning');
                const btn = document.getElementById('btnSubmit');
                setButtonLoading(btn, true);
                const amt = parseFloat(document.getElementById('d-amt').value);
                const data = { method:selMethod, coin:selCoin, network:selNet, amount:amt, receiptBase64:r64, submittedAt: serverTimestamp() };
                try {
                    await updateUserData(user.uid, { deposit: data, depositStatus: 'PENDING' });
                    await addLedgerEntry(user.uid, { type:'deposit', amount:amt, description:`Deposit via ${selMethod.toUpperCase()}`, status:'PENDING' });
                    await notifyAdmins({ title: 'New Deposit', message: `${userData.fullName} sent ${formatCurrency(amt)}`, type: 'action' });
                    location.reload();
                } catch(err) { showToast(err.message, 'error'); setButtonLoading(btn, false); }
            };
        });
    </script>
</body>
</html>
