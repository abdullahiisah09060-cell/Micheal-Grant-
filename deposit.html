<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>
<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <main class="app-main">
        <div id="pageHeader"></div>
        <div class="app-main__content" style="max-width: 700px;">
            
            <div id="statusView" style="display:none;" class="status-screen">
                <div id="stIcon" class="status-screen__icon"></div>
                <h1 id="stTitle" class="status-screen__title"></h1>
                <p id="stMsg" class="status-screen__message"></p>
                <div id="stActions"></div>
            </div>

            <div id="flowBox">
                <div id="step-1" class="deposit-step active">
                    <h3 class="mb-6" style="font-weight:900;">1. Select Funding Method</h3>
                    <div class="method-selector">
                        <div class="method-card" data-m="crypto"><div class="method-card__icon text-warning"><i class="fa-solid fa-bitcoin-sign"></i></div><div class="method-card__name">Cryptocurrency</div></div>
                        <div class="method-card" data-m="bank"><div class="method-card__icon text-navy"><i class="fa-solid fa-building-columns"></i></div><div class="method-card__name">Bank Wire</div></div>
                        <div class="method-card" data-m="zelle"><div class="method-card__icon text-success"><i class="fa-solid fa-envelope"></i></div><div class="method-card__name">Zelle Pay</div></div>
                    </div>
                    <button class="btn btn--primary btn--full" id="goStep2" disabled>Proceed to Details</button>
                </div>

                <div id="step-asset" class="deposit-step">
                    <h3 class="mb-6" style="font-weight:900;">2. Select Coin</h3>
                    <div class="coin-grid" id="coinGrid"></div>
                    <div id="netBox" class="mb-6"></div>
                    <button class="btn btn--ghost" onclick="showStep(1)">Back</button>
                </div>

                <div id="step-final" class="deposit-step">
                    <h3 class="mb-6" style="font-weight:900;">3. Final Settlement</h3>
                    <div id="addressDisplay" class="address-display"></div>
                    <form id="depForm" class="mt-8">
                        <div class="form-group"><label class="form-label form-label--required">Exact Amount Sent (USD)</label><input type="number" id="d-amt" class="form-input" placeholder="0.00" required></div>
                        <div class="form-group">
                            <label class="form-label form-label--required">Proof of Transfer (Screenshot)</label>
                            <div class="upload-area" id="up-r"><i class="fa-solid fa-receipt upload-area__icon"></i><p class="upload-area__label">Upload Receipt</p><img id="pre-r" class="upload-area__preview"><input type="file" id="in-r" hidden accept="image/*"></div>
                        </div>
                        <div class="flex gap-4">
                            <button type="button" class="btn btn--ghost" onclick="showStep(1)">Restart</button>
                            <button type="submit" class="btn btn--primary flex-1" id="btnDep">Confirm Submittal</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { updateUserData, serverTimestamp, compressToBase64, notifyAdmins, addLedgerEntry } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading, copyToClipboard, formatCurrency } from './app.js';

    const WALLETS = {
        BTC:  { name:'Bitcoin', icon:'fa-bitcoin-sign', color:'#f7931a', nets: { 'Bitcoin':'bc1qrrc86d42pzejhwxxsjfctmjkj7dl52q0j0qy9k' }},
        ETH:  { name:'Ethereum', icon:'fa-ethereum', color:'#627eea', nets: { 'ERC20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Base':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' }},
        USDT: { name:'USDT', icon:'fa-dollar-sign', color:'#26a17b', nets: { 'TRC20':'TKZcchSTjdJXEoVZmErwfiSUmZFnh6Tjwx', 'ERC20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'BEP20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Solana':'9UgFrLx796JagxDAJARrqzzW7c9DPHfrS2n3UH7vsMf4' }},
        USDC: { name:'USDC', icon:'fa-circle-dollar-to-slot', color:'#2775ca', nets: { 'ERC20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Base':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E', 'Solana':'9UgFrLx796JagxDAJARrqzzW7c9DPHfrS2n3UH7vsMf4' }},
        BNB:  { name:'BNB', icon:'fa-bolt', color:'#f3ba2f', nets: { 'BEP20':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' }},
        SOL:  { name:'Solana', icon:'fa-sun', color:'#9945ff', nets: { 'Solana':'9UgFrLx796JagxDAJARrqzzW7c9DPHfrS2n3UH7vsMf4' }},
        TRX:  { name:'TRON', icon:'fa-wave-square', color:'#ef0027', nets: { 'TRC20':'TKZcchSTjdJXEoVZmErwfiSUmZFnh6Tjwx' }},
        TON:  { name:'TON', icon:'fa-circle-nodes', color:'#0098ea', nets: { 'TON Chain':'0x3b424b2999dEF4894f21f1a5bFe89e97Bc21DE1E' }}
    };

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'deposit', userData });
        buildDock({ activeId: 'deposit' });
        buildPageHeader({ title: 'Fund Account', subtitle: 'Add liquidity to treasury wallet', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        if(userData.depositStatus !== 'IDLE') {
            document.getElementById('flowBox').style.display = 'none';
            const view = document.getElementById('statusView'); view.style.display = 'block';
            const ic = document.getElementById('stIcon');
            if(userData.depositStatus === 'PENDING') {
                ic.className = 'status-screen__icon status-screen__icon--info'; ic.innerHTML = '<i class="fa-solid fa-clock fa-spin"></i>';
                document.getElementById('stTitle').textContent = 'Settlement Pending';
                document.getElementById('stMsg').textContent = 'Your transfer is being confirmed on the blockchain/banking network. Credits typically appear within 1-4 hours.';
            } else if(userData.depositStatus === 'REJECTED') {
                ic.className = 'status-screen__icon status-screen__icon--error'; ic.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                document.getElementById('stTitle').textContent = 'Deposit Rejected';
                document.getElementById('stMsg').textContent = userData.deposit?.rejectReason || 'Transfer could not be verified.';
                document.getElementById('stActions').innerHTML = '<button class="btn btn--outline" onclick="resetDep()">New Deposit</button>';
                window.resetDep = () => updateUserData(user.uid, { depositStatus: 'IDLE' }).then(()=>location.reload());
            }
        }

        let method = '', coin = '', net = '', r64 = '';

        window.showStep = (n) => {
            document.querySelectorAll('.deposit-step').forEach(s => s.classList.remove('active'));
            if(n===1) document.getElementById('step-1').classList.add('active');
            else if(n==='asset') document.getElementById('step-asset').classList.add('active');
            else document.getElementById('step-final').classList.add('active');
        };

        document.querySelectorAll('.method-card').forEach(c => {
            c.onclick = () => {
                document.querySelectorAll('.method-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected'); method = c.dataset.m; document.getElementById('goStep2').disabled = false;
            };
        });

        document.getElementById('goStep2').onclick = () => {
            if(method === 'crypto') {
                const g = document.getElementById('coinGrid'); g.innerHTML = '';
                Object.entries(WALLETS).forEach(([k,v]) => {
                    const b = document.createElement('div'); b.className = 'coin-btn';
                    b.innerHTML = `<i class="fa-solid ${v.icon}" style="color:${v.color}"></i><span class="coin-btn__name">${k}</span>`;
                    b.onclick = () => {
                        coin = k; document.getElementById('netBox').innerHTML = '<p class="form-label mb-3">Select Network</p>';
                        Object.entries(v.nets).forEach(([n,a]) => {
                            const nb = document.createElement('button'); nb.className = 'network-btn'; nb.textContent = n;
                            nb.onclick = () => { net = n; renderFinal(a); showStep('final'); };
                            document.getElementById('netBox').appendChild(nb);
                        });
                    };
                    g.appendChild(b);
                });
                showStep('asset');
            } else {
                renderLegacy(); showStep('final');
            }
        };

        const renderFinal = (a) => {
            document.getElementById('addressDisplay').innerHTML = `
                <div class="address-display__label">Send ${coin} to ${net} address:</div>
                <div class="address-display__value">${a}</div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${a}" style="margin-bottom:15px; border-radius:8px;">
                <button type="button" class="btn btn--secondary btn--sm" onclick="copyToClipboard('${a}')">Copy Address</button>
                <div class="address-display__warning">⚠️ Only send ${coin} via ${net}. Wrong network results in loss.</div>
            `;
        };

        const renderLegacy = () => {
            const box = document.getElementById('addressDisplay');
            if(method === 'bank') box.innerHTML = `<div style="color:white;"><strong>Treasury Wire</strong><br>Bank: JPMorgan Chase<br>Routing: 021000021<br>Account: SBA-TREAS-${user.uid.substring(0,6).toUpperCase()}</div>`;
            else box.innerHTML = `<div style="color:white;"><strong>Zelle Payment</strong><br>Recipient: treasury.disbursement@sba.gov.us<br>Memo: ${userData.fullName}</div>`;
        };

        document.getElementById('up-r').onclick = () => document.getElementById('in-r').click();
        document.getElementById('in-r').onchange = async (e) => {
            r64 = await compressToBase64(e.target.files[0]);
            document.getElementById('pre-r').src = r64; document.getElementById('pre-r').style.display = 'block';
            document.getElementById('up-r').classList.add('has-file');
        };

        document.getElementById('depForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnDep'); setButtonLoading(btn, true);
            const amt = parseFloat(document.getElementById('d-amt').value);
            const payload = { method, coin, network:net, amount:amt, receiptBase64:r64, submittedAt: serverTimestamp() };
            try {
                await updateUserData(user.uid, { deposit: payload, depositStatus: 'PENDING' });
                await addLedgerEntry(user.uid, { type:'deposit', amount:amt, description:`Deposit via ${method.toUpperCase()}`, status:'PENDING' });
                await notifyAdmins({ title:'New Deposit', message:`${userData.fullName} sent ${formatCurrency(amt)}`, type:'action' });
                location.reload();
            } catch(err) { showToast(err.message, 'error'); setButtonLoading(btn, false); }
        };
    });
</script>
</body>
</html>
