<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Funds | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .payment-card { border: 2px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .payment-card:hover { border-color: var(--sba-navy); background: var(--sba-blue-light); }
        .payment-card.active { border-color: var(--sba-navy); background: var(--sba-blue-light); box-shadow: var(--shadow); }
        .payment-card i { font-size: 1.5rem; width: 40px; text-align: center; }
        .address-box { background: #1e293b; color: #60a5fa; padding: 15px; border-radius: 8px; font-family: monospace; display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 13px; }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="container" style="max-width: 600px;">
        <h2 style="color: var(--sba-navy); margin-bottom: 10px;">Fund Your Account</h2>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">Select your preferred deposit method to continue.</p>

        <div class="card">
            <div class="payment-card active" onclick="selectMethod('crypto')">
                <i class="fa-brands fa-bitcoin" style="color: #f59e0b;"></i>
                <div>
                    <h5 style="margin-bottom: 0;">Cryptocurrency</h5>
                    <small>Bitcoin, Ethereum, USDT</small>
                </div>
            </div>

            <div class="payment-card" onclick="selectMethod('bank')">
                <i class="fa-solid fa-building-columns" style="color: var(--sba-navy);"></i>
                <div>
                    <h5 style="margin-bottom: 0;">Bank Wire Transfer</h5>
                    <small>1-3 Business Days</small>
                </div>
            </div>

            <div id="cryptoDetails">
                <p style="font-size: 13px; margin-top: 25px; font-weight: 600;">Transfer USDT (TRC20) to this address:</p>
                <div class="address-box">
                    <span id="walletAddress">TX7vS2yW...L8n2P9q1</span>
                    <i class="fa-solid fa-copy" style="cursor: pointer;" onclick="copyAddress()"></i>
                </div>
                <div class="form-group">
                    <label class="form-label">Upload Transfer Receipt</label>
                    <input type="file" class="form-input" id="receipt">
                </div>
            </div>

            <button class="btn btn-primary btn-full" style="margin-top: 10px;">Confirm Deposit</button>
        </div>
    </div>

    <script>
        function selectMethod(method) {
            document.querySelectorAll('.payment-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        function copyAddress() {
            const addr = document.getElementById('walletAddress').innerText;
            navigator.clipboard.writeText(addr);
            alert('Address copied to clipboard'); // Replace with showToast later
        }
    </script>
</body>
</html>
