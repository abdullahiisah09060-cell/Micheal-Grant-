<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Application | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .apply-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .form-section { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
        .form-section h3 { margin-bottom: 20px; color: var(--navy); display: flex; align-items: center; gap: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .status-hero { text-align: center; padding: 60px 20px; }
        .status-icon { font-size: 4rem; margin-bottom: 20px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="apply-container">
        <!-- Locked State -->
        <div id="lockedState" class="card" style="display: none; text-align: center; padding: 60px 20px;">
            <div style="font-size: 4rem; margin-bottom: 20px;">🔒</div>
            <h2>Verification Required</h2>
            <p style="color: var(--text-secondary); margin: 15px 0 30px;">You must complete Identity Verification (KYC) before you can apply for a grant.</p>
            <a href="kyc.html" class="btn btn--primary">Complete KYC Now</a>
        </div>

        <!-- Status States -->
        <div id="statusState" class="card status-hero" style="display: none;">
            <div id="statusIcon" class="status-icon"></div>
            <h2 id="statusTitle"></h2>
            <p id="statusMsg" style="color: var(--text-secondary); margin: 15px 0 30px;"></p>
            <div id="statusActions"></div>
        </div>

        <!-- Application Form -->
        <form id="applyForm" class="card" style="display: none; padding: 40px;">
            <div style="text-align: center; margin-bottom: 40px;">
                <h1>Grant Application</h1>
                <p style="color: var(--text-secondary);">Federal Small Business Support Program</p>
            </div>

            <div class="form-section">
                <h3><span>01</span> Personal Identity</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Full Legal Name</label>
                        <input type="text" name="fullName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="dob" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">SSN (Last 4 Digits)</label>
                        <input type="password" name="ssn" class="form-input" maxlength="4" placeholder="****" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Home Address</label>
                        <input type="text" name="address" class="form-input" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3><span>02</span> Business Profile</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Business Name</label>
                        <input type="text" name="bizName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Entity Type</label>
                        <select name="bizType" class="form-select" required>
                            <option value="LLC">LLC</option>
                            <option value="Corporation">Corporation</option>
                            <option value="Sole Proprietorship">Sole Proprietorship</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">EIN (XX-XXXXXXX)</label>
                        <input type="text" name="ein" class="form-input" placeholder="00-0000000" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Annual Revenue</label>
                        <select name="bizRevenue" class="form-select" required>
                            <option value="Under $100K">Under $100K</option>
                            <option value="$100K - $500K">$100K - $500K</option>
                            <option value="Over $500K">Over $500K</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3><span>03</span> Grant Details</h3>
                <div class="form-group">
                    <label class="form-label">Requested Amount (USD)</label>
                    <input type="number" name="grantAmount" class="form-input" min="50000" max="500000" placeholder="$50,000.00" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Purpose of Funds</label>
                    <textarea name="grantPurpose" class="form-input" style="height: 120px;" placeholder="Describe how these funds will help your business grow..." required></textarea>
                </div>
            </div>

            <div class="form-section" style="border: none;">
                <h3><span>04</span> Certification</h3>
                <label style="display: flex; gap: 10px; font-size: 0.85rem; cursor: pointer;">
                    <input type="checkbox" required>
                    <span>I certify that all information is true and accurate under penalty of perjury.</span>
                </label>
            </div>

            <button type="submit" class="btn btn--primary btn--full btn--lg">Submit Application</button>
        </form>
    </div>

    <script type="module">
        import { auth, db, updateUserData, notify, notifyAdmins, addLedgerEntry, serverTimestamp } from './firebase-config.js';
        import { requireAuth, hideLoader, showToast, formatCurrency } from './app.js';

        requireAuth((user, userData) => {
            const locked = document.getElementById('lockedState');
            const status = document.getElementById('statusState');
            const form = document.getElementById('applyForm');

            if (userData.kycStatus !== 'APPROVED') {
                locked.style.display = 'block';
            } else if (userData.applyStatus === 'IDLE') {
                form.style.display = 'block';
            } else {
                status.style.display = 'block';
                renderStatus(userData);
            }
            hideLoader();
        });

        function renderStatus(data) {
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const msg = document.getElementById('statusMsg');
            const actions = document.getElementById('statusActions');

            if (data.applyStatus === 'PENDING' || data.applyStatus === 'UNDER_REVIEW') {
                icon.innerText = '⏳';
                title.innerText = 'Application Under Review';
                msg.innerText = 'Our agents are currently reviewing your documents. This typically takes 3-5 business days.';
            } else if (data.applyStatus === 'APPROVED') {
                icon.innerText = '🎉';
                title.innerText = 'Application Approved!';
                msg.innerText = `Congratulations! Your grant for ${formatCurrency(data.requestedAmount)} has been approved.`;
                actions.innerHTML = `<a href="deposit.html" class="btn btn--primary">Proceed to Funding</a>`;
            } else if (data.applyStatus === 'REJECTED') {
                icon.innerText = '❌';
                title.innerText = 'Application Declined';
                msg.innerText = data.application?.rejectReason || 'Your application did not meet the eligibility criteria.';
                actions.innerHTML = `<button class="btn btn--outline" onclick="location.reload()">Re-Apply</button>`;
            }
        }

        document.getElementById('applyForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            try {
                document.querySelector('button[type="submit"]').disabled = true;
                const uid = auth.currentUser.uid;

                await updateUserData(uid, {
                    applyStatus: 'PENDING',
                    requestedAmount: Number(data.grantAmount),
                    application: { ...data, submittedAt: new Date().toISOString() }
                });

                await addLedgerEntry(uid, {
                    type: 'Application',
                    amount: 0,
                    description: `Grant Application Submitted (${formatCurrency(data.grantAmount)})`,
                    status: 'PENDING'
                });

                await notify(uid, {
                    title: "Application Received",
                    message: "Your grant application is now under review.",
                    type: "info",
                    link: "apply.html"
                });

                await notifyAdmins({
                    title: "New Application",
                    message: `${data.fullName} applied for ${formatCurrency(data.grantAmount)}`,
                    type: "action",
                    link: "admin-portal.html"
                });

                showToast("Application submitted successfully", "success");
                setTimeout(() => location.reload(), 1500);
            } catch (err) {
                showToast(err.message, "error");
                document.querySelector('button[type="submit"]').disabled = false;
            }
        };
    </script>
</body>
</html>
