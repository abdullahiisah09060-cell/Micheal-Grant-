<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .withdraw-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .method-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .method-btn { flex: 1; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: center; font-weight: 600; transition: 0.2s; font-size: 0.85rem; }
        .method-btn.active { border-color: var(--navy); background: var(--navy-light); color: var(--navy); }
        .withdraw-card { padding: 30px; }
        .balance-hero { background: var(--navy); color: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .pin-input { letter-spacing: 1em; text-align: center; font-size: 1.5rem; font-weight: 800; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="withdraw-container">
        <!-- Locked State -->
        <div id="lockedState" class="card" style="display: none; text-align: center; padding: 60px 20px;">
            <div style="font-size: 4rem; margin-bottom: 20px;">🔒</div>
            <h2>Withdrawal Unavailable</h2>
            <p style="color: var(--text-secondary); margin: 15px 0 30px;">Your grant award must be approved and your tax clearance verified before funds can be released.</p>
            <a href="dashboard.html" class="btn btn--primary">Return to Dashboard</a>
        </div>

        <!-- Pending/Success State -->
        <div id="statusState" class="card" style="display: none; text-align: center; padding: 60px 20px; margin-bottom: 30px;">
            <div id="statusIcon" style="font-size: 4rem; margin-bottom: 20px;"></div>
            <h2 id="statusTitle"></h2>
            <p id="statusMsg" style="margin-bottom: 25px;"></p>
            <div id="statusActions"></div>
        </div>

        <!-- Withdraw Form -->
        <div id="withdrawForm" style="display: none;">
            <div class="balance-hero">
                <p style="opacity: 0.8; font-size: 0.9rem;">Available for Disbursement</p>
                <h1 id="availBalance" style="font-size: 2.5rem; margin-top: 5px;">$0.00</h1>
            </div>

            <div class="card withdraw-card">
                <h3 style="margin-bottom: 20px;">Select Disbursement Method</h3>
                <div class="method-tabs">
                    <button class="method-btn active" onclick="setMethod('bank')">🏦 Bank Transfer</button>
                    <button class="method-btn" onclick="setMethod('zelle')">📱 Zelle</button>
                    <button class="method-btn" onclick="setMethod('crypto')">₿ Crypto</button>
                </div>

                <form id="mainWithdrawForm">
                    <!-- Bank Fields -->
                    <div id="fields-bank" class="method-fields">
                        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group"><label class="form-label">Bank Name</label><input type="text" name="bankName" class="form-input"></div>
                            <div class="form-group"><label class="form-label">Account Holder</label><input type="text" name="accHolder" class="form-input"></div>
                            <div class="form-group"><label class="form-label">Routing Number</label><input type="text" name="routing" class="form-input" maxlength="9"></div>
                            <div class="form-group"><label class="form-label">Account Number</label><input type="text" name="accNumber" class="form-input"></div>
                        </div>
                    </div>

                    <!-- Zelle Fields -->
                    <div id="fields-zelle" class="method-fields" style="display: none;">
                        <div class="form-group"><label class="form-label">Zelle ID (Email or Phone)</label><input type="text" name="zelleId" class="form-input"></div>
                    </div>

                    <!-- Crypto Fields -->
                    <div id="fields-crypto" class="method-fields" style="display: none;">
                        <div class="form-group"><label class="form-label">Cryptocurrency & Network</label><select name="cryptoCoin" class="form-select"><option>USDT (TRC20)</option><option>Bitcoin (Native)</option><option>Ethereum (ERC20)</option></select></div>
                        <div class="form-group"><label class="form-label">Destination Wallet Address</label><input type="text" name="walletAddr" class="form-input"></div>
                    </div>

                    <hr style="margin: 25px 0; border: 0; border-top: 1px solid var(--border-light);">

                    <div class="form-group">
                        <label class="form-label">Amount to Withdraw (USD)</label>
                        <input type="number" id="withdrawAmount" class="form-input form-input--lg" required placeholder="$0.00">
                    </div>

                    <div class="form-group" style="text-align: center; margin-top: 30px;">
                        <label class="form-label">Confirm Transaction PIN</label>
                        <input type="password" id="confirmPin" class="form-input pin-input" maxlength="4" required placeholder="••••">
                    </div>

                    <button type="submit" class="btn btn--primary btn--full btn--lg">Request Disbursement</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, updateUserData, notify, notifyAdmins, addLedgerEntry } from './firebase-config.js';
        import { requireAuth, hideLoader, showToast, formatCurrency, showConfirm } from './app.js';

        let currentMethod = 'bank';
        let userBalance = 0;
        let correctPin = '';

        requireAuth((user, userData) => {
            userBalance = userData.balance;
            correctPin = userData.transactionPin;
            document.getElementById('availBalance').innerText = formatCurrency(userBalance);

            if (userData.awardStatus !== 'APPROVED' || userData.taxStatus !== 'APPROVED') {
                document.getElementById('lockedState').style.display = 'block';
            } else if (userData.withdrawStatus === 'IDLE' || userData.withdrawStatus === 'DECLINED') {
                document.getElementById('withdrawForm').style.display = 'block';
            } else {
                renderWithdrawStatus(userData);
            }
            hideLoader();
        });

        window.setMethod = (m) => {
            currentMethod = m;
            document.querySelectorAll('.method-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(m)));
            document.querySelectorAll('.method-fields').forEach(f => f.style.display = f.id === `fields-${m}` ? 'block' : 'none');
        };

        function renderWithdrawStatus(data) {
            const status = document.getElementById('statusState');
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const msg = document.getElementById('statusMsg');
            
            status.style.display = 'block';
            if (data.withdrawStatus === 'PENDING') {
                icon.innerText = '⏳';
                title.innerText = 'Disbursement Pending';
                msg.innerText = 'Your withdrawal request is being processed. Typical delivery time is 24-72 hours.';
            } else if (data.withdrawStatus === 'APPROVED') {
                icon.innerText = '✅';
                title.innerText = 'Funds Released';
                msg.innerText = `Successfully disbursed ${formatCurrency(data.withdrawal?.amount)} to your chosen account.`;
            }
        }

        document.getElementById('mainWithdrawForm').onsubmit = async (e) => {
            e.preventDefault();
            const amount = Number(document.getElementById('withdrawAmount').value);
            const pin = document.getElementById('confirmPin').value;

            if (amount <= 0 || amount > userBalance) return showToast("Invalid amount", "warning");
            if (pin !== correctPin) return showToast("Incorrect Transaction PIN", "error");

            showConfirm({
                title: "Confirm Disbursement",
                message: `Are you sure you want to withdraw ${formatCurrency(amount)} via ${currentMethod.toUpperCase()}?`,
                onConfirm: async () => {
                    try {
                        const uid = auth.currentUser.uid;
                        const formData = new FormData(e.target);
                        const details = Object.fromEntries(formData.entries());

                        await updateUserData(uid, {
                            withdrawStatus: 'PENDING',
                            withdrawal: { method: currentMethod, amount, details, submittedAt: new Date().toISOString() }
                        });

                        await addLedgerEntry(uid, {
                            type: 'Withdrawal',
                            amount: -amount,
                            description: `Grant Disbursement Request (${currentMethod})`,
                            status: 'PENDING'
                        });

                        await notifyAdmins({ title: "Withdrawal Request", message: `User requested ${formatCurrency(amount)}`, type: "action" });
                        showToast("Request submitted successfully", "success");
                        setTimeout(() => location.reload(), 1500);
                    } catch (err) { showToast(err.message, "error"); }
                }
            });
        };
    </script>
</body>
</html>
