<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support Chat | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .chat-layout { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
        .chat-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .chat-input-bar { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; }
        
        .agent-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface); position: absolute; bottom: 0; right: 0; }
        
        .chat-input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 20px; font-family: inherit; font-size: 0.9rem; outline: none; }
    </style>
</head>
<body>
<div class="chat-layout">
    <header class="chat-header">
        <a href="dashboard.html" class="page-header__back" style="width:32px; height:32px;"><i class="fa-solid fa-arrow-left"></i></a>
        <div style="position:relative;">
            <div id="a-initials" class="agent-avatar">SA</div>
            <div class="status-dot"></div>
        </div>
        <div style="flex:1;">
            <div id="a-name" style="font-weight:800; font-size:0.95rem;">Assigned Agent</div>
            <div style="font-size:0.7rem; color:var(--text-muted);">SBA Federal Case Officer</div>
        </div>
        <button class="btn btn--ghost" style="padding:8px;"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </header>

    <div class="chat-body" id="chatBody"></div>

    <div class="chat-input-bar">
        <button class="btn btn--ghost" id="btnImg" style="padding:8px; font-size:1.2rem;"><i class="fa-solid fa-paperclip"></i></button>
        <input type="file" id="in-chat-img" hidden accept="image/*">
        <input type="text" id="m-input" class="chat-input" placeholder="Type a message...">
        <button class="btn btn--primary" id="btnSend" style="padding:10px; border-radius:50%; width:40px; height:40px;"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    import { db, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, notifyAdmins } from './firebase-config.js';
    import { requireAuth, hideLoader, timeAgo } from './app.js';

    requireAuth((user, userData) => {
        hideLoader();
        const agent = userData.assignedAgent || 'Sarah Mitchell';
        document.getElementById('a-name').textContent = agent;
        document.getElementById('a-initials').textContent = agent.split(' ').map(n=>n[0]).join('');

        const body = document.getElementById('chatBody');
        const q = query(collection(db, 'chat', user.uid, 'messages'), orderBy('timestamp', 'asc'));

        onSnapshot(q, (snap) => {
            if(snap.empty) {
                // Auto-welcome
                addDoc(collection(db, 'chat', user.uid, 'messages'), {
                    sender: 'agent', message: `Hello ${userData.fullName.split(' ')[0]}, I'm ${agent}, your dedicated SBA officer. How can I help you with your grant today?`,
                    timestamp: serverTimestamp(), read: false
                });
                return;
            }
            body.innerHTML = '';
            snap.forEach(doc => {
                const m = doc.data();
                const div = document.createElement('div');
                div.className = `bubble bubble--${m.sender}`;
                div.innerHTML = `<div>${m.message}</div><div class="bubble__time" style="font-size:0.6rem; opacity:0.6; margin-top:4px;">${m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '...'}</div>`;
                body.appendChild(div);
            });
            body.scrollTop = body.scrollHeight;
        });

        const send = async () => {
            const val = document.getElementById('m-input').value.trim();
            if(!val) return;
            document.getElementById('m-input').value = '';
            await addDoc(collection(db, 'chat', user.uid, 'messages'), { sender: 'user', message: val, timestamp: serverTimestamp(), read: false });
            await notifyAdmins({ title: 'New Support Message', message: `${userData.fullName}: ${val.substring(0, 40)}...`, type: 'action' });
        };

        document.getElementById('btnSend').onclick = send;
        document.getElementById('m-input').onkeydown = (e) => { if(e.key === 'Enter') send(); };
    });
</script>
</body>
</html>
