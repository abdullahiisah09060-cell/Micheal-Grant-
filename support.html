<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .chat-layout { height: 100vh; display: flex; flex-direction: column; }
        .chat-header { padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; background: #f8fafc; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .bubble--user { align-self: flex-end; background: var(--navy); color: white; border-bottom-right-radius: 4px; }
        .bubble--agent { align-self: flex-start; background: white; color: var(--text-primary); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .chat-footer { padding: 20px; background: var(--surface); border-top: 1px solid var(--border); }
        .chat-input-wrap { display: flex; gap: 10px; background: var(--surface-2); border-radius: 30px; padding: 5px 15px; border: 1px solid var(--border); }
        .chat-input { flex: 1; border: none; background: transparent; padding: 10px; outline: none; }
    </style>
</head>
<body>
    <div class="chat-layout">
        <header class="chat-header">
            <a href="dashboard.html" style="text-decoration:none;">⬅️</a>
            <div style="width:40px; height:40px; border-radius:50%; background:var(--navy); display:flex; align-items:center; justify-content:center; color:white; font-weight:800;">SA</div>
            <div>
                <h4 style="font-size:0.95rem;">SBA Support Agent</h4>
                <small style="color:var(--success); font-weight:700;">● Online</small>
            </div>
        </header>

        <div class="chat-body" id="chatBody">
            <!-- Messages load here -->
        </div>

        <footer class="chat-footer">
            <form id="chatForm" class="chat-input-wrap">
                <input type="text" id="msgInput" class="chat-input" placeholder="Type your message..." autocomplete="off">
                <button type="submit" class="btn btn--primary" style="border-radius:50%; width:40px; height:40px; padding:0;">➡️</button>
            </form>
        </footer>
    </div>

    <script type="module">
        import { db, onSnapshot, collection, addDoc, serverTimestamp, query, orderBy } from './firebase-config.js';
        import { requireAuth, showToast } from './app.js';

        let currentUser = null;

        requireAuth((user) => {
            currentUser = user;
            const q = query(collection(db, `chat/${user.uid}/messages`), orderBy('timestamp', 'asc'));
            
            onSnapshot(q, (snap) => {
                const body = document.getElementById('chatBody');
                body.innerHTML = '';

                if (snap.empty) {
                    body.innerHTML = `<div class="bubble bubble--agent">Hello! I am your dedicated SBA case officer. How can I assist you with your grant application today?</div>`;
                }

                snap.forEach(d => {
                    const m = d.data();
                    const b = document.createElement('div');
                    b.className = `bubble bubble--${m.sender}`;
                    b.innerText = m.message;
                    body.appendChild(b);
                });
                body.scrollTop = body.scrollHeight;
            });
        });

        document.getElementById('chatForm').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg) return;

            try {
                const text = msg;
                input.value = '';
                await addDoc(collection(db, `chat/${currentUser.uid}/messages`), {
                    sender: 'user',
                    message: text,
                    timestamp: serverTimestamp()
                });
            } catch (err) { showToast("Message failed to send", "error"); }
        };
    </script>
</body>
</html>
