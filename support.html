<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support Chat | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        .chat-header { background: white; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 14px; z-index: 100; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .chat-footer { background: white; border-top: 1px solid var(--border); padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        
        .agent-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; position: relative; }
        .online-status { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; border: 2px solid white; position: absolute; bottom: 0; right: 0; }
        
        .chat-textarea { flex: 1; background: var(--surface-2); border: 1px solid var(--border); padding: 12px 18px; border-radius: 24px; font-size: 0.95rem; outline: none; transition: 0.2s; max-height: 120px; resize: none; font-family: inherit; }
        .chat-textarea:focus { border-color: var(--navy); background: white; }

        .date-divider { text-align: center; margin: 24px 0; position: relative; }
        .date-divider::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--border-light); }
        .date-divider span { background: var(--bg); padding: 0 16px; position: relative; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <a href="dashboard.html" class="page-header__back" style="width:36px; height:36px;"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="agent-avatar"><span id="av-txt">SA</span><div class="online-status"></div></div>
            <div style="flex:1">
                <div id="ag-name" style="font-weight:900; font-size:1rem; color:var(--navy);">Assigned Officer</div>
                <div style="font-size:0.7rem; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:5px;"><i class="fa-solid fa-circle-check" style="color:#22c55e"></i> Federal Case Officer • Active</div>
            </div>
            <button class="btn btn--ghost" style="padding:10px;"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </header>

        <div class="chat-body" id="chatBody"></div>

        <div class="chat-footer">
            <div class="flex items-center gap-3">
                <button class="btn btn--ghost" id="btnClip" style="padding:0; width:40px; height:40px; font-size:1.3rem;"><i class="fa-solid fa-paperclip"></i></button>
                <input type="file" id="f-in" hidden accept="image/*">
                <textarea id="m-input" class="chat-textarea" placeholder="Type federal inquiry..." rows="1"></textarea>
                <button class="btn btn--primary" id="btnSend" style="width:44px; height:44px; border-radius:50%; padding:0;" disabled><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, notifyAdmins } from './firebase-config.js';
        import { requireAuth, hideLoader, compressToBase64 } from './app.js';

        requireAuth((user, userData) => {
            hideLoader();
            const officer = userData.assignedAgent || 'Sarah Mitchell';
            document.getElementById('ag-name').textContent = officer;
            document.getElementById('av-txt').textContent = officer.split(' ').map(n=>n[0]).join('');

            const body = document.getElementById('chatBody');
            const q = query(collection(db, 'chat', user.uid, 'messages'), orderBy('timestamp', 'asc'));
            let lastDate = '';

            onSnapshot(q, (snap) => {
                if(snap.empty) {
                    addDoc(collection(db, 'chat', user.uid, 'messages'), { sender:'agent', message:`Hello ${userData.fullName.split(' ')[0]}, I'm ${officer}. How can I assist with your grant payout or documentation today?`, timestamp:serverTimestamp() });
                    return;
                }
                body.innerHTML = ''; lastDate = '';
                snap.forEach(d => {
                    const m = d.data();
                    const dStr = m.timestamp ? m.timestamp.toDate().toDateString() : '';
                    if(dStr && dStr !== lastDate) {
                        const div = document.createElement('div'); div.className = 'date-divider';
                        div.innerHTML = `<span>${dStr === new Date().toDateString() ? 'Today' : dStr}</span>`;
                        body.appendChild(div);
                        lastDate = dStr;
                    }
                    const b = document.createElement('div');
                    b.className = `bubble bubble--${m.sender}`;
                    b.innerHTML = `
                        ${m.sender==='agent' ? `<div style="font-size:0.65rem; font-weight:800; margin-bottom:4px; opacity:0.7;">${officer}</div>` : ''}
                        <div>${m.message}</div>
                        <div class="bubble__time" style="font-size:0.6rem; margin-top:5px; opacity:0.6;">${m.timestamp ? m.timestamp.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '...'}</div>
                    `;
                    body.appendChild(b);
                });
                body.scrollTop = body.scrollHeight;
            });

            const txt = document.getElementById('m-input');
            const btn = document.getElementById('btnSend');
            txt.oninput = () => { txt.style.height = 'auto'; txt.style.height = (txt.scrollHeight) + 'px'; btn.disabled = !txt.value.trim(); };

            const sendMsg = async () => {
                const val = txt.value.trim(); if(!val) return;
                txt.value = ''; txt.style.height = 'auto'; btn.disabled = true;
                await addDoc(collection(db, 'chat', user.uid, 'messages'), { sender:'user', message:val, timestamp:serverTimestamp(), read:false });
                await notifyAdmins({ title: 'New Message', message: `${userData.fullName}: ${val}`, type: 'action' });
            };
            btn.onclick = sendMsg;
            txt.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
            document.getElementById('btnClip').onclick = () => document.getElementById('f-in').click();
        });
    </script>
</body>
</html>
