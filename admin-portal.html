<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: #0b0f19; color: white; }
        .admin-sidebar { background: #111827; border-right: 1px solid #1f2937; padding: 30px 15px; height: 100vh; position: sticky; top: 0; }
        .table-scroll { overflow-x: auto; background: #111827; border-radius: 8px; border: 1px solid #1f2937; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #1f2937; padding: 15px; text-align: left; font-size: 12px; color: #9ca3af; }
        td { padding: 15px; border-bottom: 1px solid #1f2937; font-size: 14px; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div style="display: grid; grid-template-columns: 280px 1fr;" id="adminGrid">
        <aside class="sidebar admin-sidebar">
            <img src="sba-logo.png" style="height: 40px; filter: invert(1); margin-bottom: 40px;">
            <nav style="display: flex; flex-direction: column; gap: 5px;">
                <button class="btn btn-primary btn-full" style="justify-content: flex-start;"><i class="fa-solid fa-users"></i> Users</button>
                <button class="btn btn-full" style="color: #9ca3af; justify-content: flex-start;"><i class="fa-solid fa-file-invoice"></i> Grant Apps</button>
                <button class="btn btn-full" style="color: #ef4444; margin-top: 40px; justify-content: flex-start;"><i class="fa-solid fa-power-off"></i> Sign Out</button>
            </nav>
        </aside>

        <main style="padding: 25px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h3>Administrative Directory</h3>
                <img src="sba-logo.png" class="hide-desktop" style="height: 30px; filter: invert(1);">
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>User Profile</th>
                            <th>Identity Status</th>
                            <th>Current Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsers">
                        <!-- Data rows here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { requireAdmin, initMobileNav } from './app.js';
        import { db, collection, onSnapshot, query, orderBy } from './firebase-config.js';

        requireAdmin((user, userData) => {
            initMobileNav();
            if (window.innerWidth <= 1024) {
                document.getElementById('adminGrid').style.gridTemplateColumns = '1fr';
            }

            const q = query(collection(db, "users"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const tbody = document.getElementById('adminUsers');
                tbody.innerHTML = snap.docs.map(doc => {
                    const u = doc.data();
                    return `
                        <tr>
                            <td>
                                <div style="font-weight: 700;">${u.fullName}</div>
                                <div style="font-size: 11px; color: #6b7280;">${u.email}</div>
                            </td>
                            <td><span style="color: ${u.kycStatus==='approved'?'#22c55e':'#f59e0b'}; font-weight: 800;">${u.kycStatus.toUpperCase()}</span></td>
                            <td style="color: #22c55e; font-weight: 800;">$${u.balance.toLocaleString()}</td>
                            <td><button class="btn btn-outline btn-sm" style="color: white; border-color: #374151;">Manage</button></td>
                        </tr>
                    `;
                }).join('');
            });
        });
    </script>
</body>
</html>
