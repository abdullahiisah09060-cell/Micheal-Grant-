<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SBA | Admin Portal</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #0f172a; color: #f1f5f9; font-family: var(--font); margin: 0; overflow-x: hidden; }

    /* Header */
    .admin-header {
      background: #0f172a; border-bottom: 1px solid #1e293b;
      padding: var(--sp-4) var(--sp-5);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200; max-width: 500px; margin: 0 auto;
      width: 100%;
    }
    .admin-header__logo { font-size: var(--text-xl); font-weight: var(--fw-bold); color: #38bdf8; letter-spacing: -0.02em; }
    .admin-header__count { font-size: var(--text-xs); color: #64748b; font-weight: var(--fw-medium); }

    /* Tabs */
    .admin-tabs {
      display: grid; grid-template-columns: repeat(4,1fr);
      background: #0f172a; border-bottom: 1px solid #1e293b;
      position: sticky; top: 57px; z-index: 190; max-width: 500px; margin: 0 auto; width: 100%;
    }
    .admin-tab {
      padding: var(--sp-3) 0; text-align: center; cursor: pointer;
      font-size: 11px; font-weight: var(--fw-semi); color: #475569;
      border-bottom: 2px solid transparent; transition: all var(--t-fast);
      position: relative;
    }
    .admin-tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .admin-tab i { display: block; font-size: 1rem; margin-bottom: 3px; }
    .tab-badge {
      position: absolute; top: 6px; right: 18%;
      background: #f43f5e; color: white; font-size: 9px;
      font-weight: 700; border-radius: var(--r-full);
      padding: 1px 5px; border: 2px solid #0f172a;
    }

    /* Pane */
    .admin-pane { display: none; padding: var(--sp-4); max-width: 500px; margin: 0 auto; padding-bottom: var(--sp-20); }
    .admin-pane.active { display: block; }

    /* Search */
    .admin-search {
      display: flex; align-items: center; gap: var(--sp-3);
      background: #1e293b; border: 1px solid #334155;
      border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-4);
    }
    .admin-search input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: var(--text-sm); color: #f1f5f9; font-family: var(--font);
    }
    .admin-search input::placeholder { color: #475569; }

    /* User card */
    .user-card {
      background: #1e293b; border: 1px solid #334155;
      border-radius: var(--r-xl); padding: var(--sp-4);
      margin-bottom: var(--sp-3);
    }
    .user-card__header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--sp-3); }
    .user-card__name   { font-size: var(--text-sm); font-weight: var(--fw-bold); color: #f1f5f9; }
    .user-card__email  { font-size: var(--text-xs); color: #64748b; margin-top: 2px; }
    .user-card__balance { font-size: var(--text-lg); font-weight: var(--fw-bold); color: #4ade80; }
    .user-card__bal-label { font-size: 11px; color: #64748b; }

    .user-card__details {
      background: #0f172a; border-radius: var(--r-md);
      padding: var(--sp-3); margin-bottom: var(--sp-3);
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2);
    }
    .detail-item__label { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; }
    .detail-item__value { font-size: var(--text-xs); font-weight: var(--fw-semi); color: #cbd5e1; margin-top: 2px; word-break: break-all; }

    .user-card__actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .action-btn {
      flex: 1; min-width: 80px; height: 36px; border-radius: var(--r-md);
      font-size: 11px; font-weight: var(--fw-semi); cursor: pointer;
      border: 1px solid transparent; font-family: var(--font); transition: all var(--t-fast);
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .action-btn--chat    { background: rgba(56,189,248,0.1); color: #38bdf8; border-color: rgba(56,189,248,0.2); }
    .action-btn--fund    { background: rgba(74,222,128,0.1); color: #4ade80; border-color: rgba(74,222,128,0.2); }
    .action-btn--verify  { background: rgba(251,191,36,0.1); color: #fbbf24; border-color: rgba(251,191,36,0.2); }
    .action-btn--delete  { background: rgba(244,63,94,0.1);  color: #f43f5e; border-color: rgba(244,63,94,0.2); }
    .action-btn:hover { opacity: 0.8; }

    /* Withdraw details strip */
    .withdraw-strip {
      background: rgba(56,189,248,0.05); border: 1px solid rgba(56,189,248,0.15);
      border-radius: var(--r-md); padding: var(--sp-3); margin-bottom: var(--sp-3);
    }
    .withdraw-strip__title { font-size: 10px; font-weight: var(--fw-bold); color: #38bdf8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--sp-2); }
    .withdraw-strip__row   { font-size: var(--text-xs); color: #94a3b8; display: flex; gap: var(--sp-2); }
    .withdraw-strip__row strong { color: #f1f5f9; }

    /* Task card */
    .task-card {
      background: #1e293b; border: 1px solid #334155;
      border-left: 3px solid #fbbf24;
      border-radius: var(--r-xl); padding: var(--sp-4);
      margin-bottom: var(--sp-3);
    }
    .task-card__user  { font-size: var(--text-sm); font-weight: var(--fw-bold); color: #f1f5f9; }
    .task-card__type  { font-size: var(--text-xs); color: #fbbf24; font-weight: var(--fw-semi); margin-top: 2px; }
    .task-images { display: flex; gap: var(--sp-2); margin: var(--sp-3) 0; flex-wrap: wrap; }
    .task-images img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--r-md); cursor: pointer; border: 1px solid #334155; }
    .task-actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-3); }
    .task-approve { flex: 1; height: 40px; background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); border-radius: var(--r-md); font-size: var(--text-xs); font-weight: var(--fw-semi); cursor: pointer; font-family: var(--font); }
    .task-decline { flex: 1; height: 40px; background: rgba(244,63,94,0.1);  color: #f43f5e; border: 1px solid rgba(244,63,94,0.2);  border-radius: var(--r-md); font-size: var(--text-xs); font-weight: var(--fw-semi); cursor: pointer; font-family: var(--font); }

    /* Chat */
    .chat-list-item {
      background: #1e293b; border: 1px solid #334155;
      border-radius: var(--r-xl); padding: var(--sp-4);
      margin-bottom: var(--sp-3); cursor: pointer;
      display: flex; align-items: center; gap: var(--sp-3);
      transition: border-color var(--t-fast);
    }
    .chat-list-item:hover { border-color: #38bdf8; }
    .chat-list-item.unread { border-left: 3px solid #38bdf8; }
    .chat-avatar { width: 42px; height: 42px; border-radius: var(--r-full); background: #334155; display: flex; align-items: center; justify-content: center; font-size: var(--text-base); font-weight: var(--fw-bold); color: #38bdf8; flex-shrink: 0; }
    .chat-preview { font-size: var(--text-xs); color: #64748b; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

    /* Log rows */
    .log-row { background: #1e293b; border: 1px solid #1e293b; border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .log-row__text { font-size: var(--text-xs); color: #94a3b8; flex: 1; }
    .log-row__time { font-size: 10px; color: #475569; flex-shrink: 0; }

    /* Chat overlay */
    .chat-overlay {
      display: none; position: fixed; inset: 0;
      background: #0f172a; z-index: 1000;
      flex-direction: column; max-width: 500px; margin: 0 auto;
    }
    .chat-overlay.open { display: flex; }
    .chat-overlay__header {
      background: #1e293b; border-bottom: 1px solid #334155;
      padding: var(--sp-4) var(--sp-5);
      display: flex; align-items: center; gap: var(--sp-3); flex-shrink: 0;
    }
    .chat-overlay__messages {
      flex: 1; overflow-y: auto; padding: var(--sp-5);
      display: flex; flex-direction: column; gap: var(--sp-3);
    }
    .chat-overlay__messages::-webkit-scrollbar { width: 4px; }
    .chat-overlay__messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .chat-msg {
      max-width: 82%; padding: var(--sp-3) var(--sp-4);
      border-radius: var(--r-lg); font-size: var(--text-sm); line-height: 1.5;
    }
    .chat-msg--user  { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-msg--admin { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-msg img    { max-width: 100%; border-radius: var(--r-md); margin-top: var(--sp-2); cursor: pointer; }
    .chat-msg__time  { font-size: 10px; opacity: 0.5; margin-top: 4px; text-align: right; }
    .chat-overlay__input {
      background: #1e293b; border-top: 1px solid #334155;
      padding: var(--sp-3) var(--sp-4);
      padding-bottom: calc(var(--sp-3) + env(safe-area-inset-bottom, 0));
      display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0;
    }
    .chat-overlay__input input {
      flex: 1; background: #0f172a; border: 1px solid #334155;
      border-radius: var(--r-lg); padding: var(--sp-2) var(--sp-4);
      font-size: var(--text-sm); color: #f1f5f9; outline: none; font-family: var(--font);
    }
    .chat-overlay__input input::placeholder { color: #475569; }
    .chat-send { width: 40px; height: 40px; background: #0284c7; border: none; border-radius: var(--r-md); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chat-attach { width: 40px; height: 40px; background: #334155; border: none; border-radius: var(--r-md); color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Image viewer */
    .img-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: var(--sp-4); }
    .img-viewer.open { display: flex; }
    .img-viewer img { max-width: 100%; max-height: 90vh; border-radius: var(--r-lg); }
  </style>
</head>
<body>

  <!-- Admin Header -->
  <div style="max-width:500px;margin:0 auto;width:100%;">
    <div class="admin-header">
      <div>
        <div class="admin-header__logo">SBA Admin</div>
        <div class="admin-header__count" id="userCount">Users: 0</div>
      </div>
      <div style="display:flex;gap:var(--sp-2);">
        <button onclick="location.reload()" style="width:36px;height:36px;background:#1e293b;border:1px solid #334155;border-radius:var(--r-md);color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <i class="fa-solid fa-rotate-right" style="font-size:0.85rem;"></i>
        </button>
        <button id="logoutBtn" style="width:36px;height:36px;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.2);border-radius:var(--r-md);color:#f43f5e;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <i class="fa-solid fa-power-off" style="font-size:0.85rem;"></i>
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="admin-tabs">
      <div class="admin-tab active" id="tab-users" onclick="switchTab('users')">
        <i class="fa-solid fa-users"></i>Users
      </div>
      <div class="admin-tab" id="tab-tasks" onclick="switchTab('tasks')">
        <i class="fa-solid fa-bolt"></i>Tasks
        <span class="tab-badge" id="taskBadge" style="display:none;">0</span>
      </div>
      <div class="admin-tab" id="tab-chat" onclick="switchTab('chat')">
        <i class="fa-solid fa-comment-alt"></i>Chat
        <span class="tab-badge" id="chatBadge" style="display:none;">0</span>
      </div>
      <div class="admin-tab" id="tab-logs" onclick="switchTab('logs')">
        <i class="fa-solid fa-terminal"></i>Logs
      </div>
    </div>
  </div>

  <!-- Panes -->
  <div id="pane-users" class="admin-pane active">
    <div class="admin-search">
      <i class="fa-solid fa-search" style="color:#475569;font-size:0.85rem;"></i>
      <input type="text" id="searchInput" placeholder="Search by name, email, or status…">
    </div>
    <div id="userList"></div>
  </div>

  <div id="pane-tasks" class="admin-pane">
    <div id="taskList"></div>
    <p id="noTasks" style="display:none;text-align:center;color:#475569;font-size:var(--text-sm);padding:var(--sp-12);">No pending tasks.</p>
  </div>

  <div id="pane-chat" class="admin-pane">
    <div id="chatList"></div>
    <p id="noChats" style="display:none;text-align:center;color:#475569;font-size:var(--text-sm);padding:var(--sp-12);">No messages yet.</p>
  </div>

  <div id="pane-logs" class="admin-pane">
    <div id="logList"></div>
  </div>

  <!-- Chat Overlay -->
  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-overlay__header">
      <button onclick="closeChat()" style="width:36px;height:36px;background:#334155;border:none;border-radius:var(--r-full);color:#f1f5f9;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div>
        <div id="chatOverlayName" style="font-size:var(--text-sm);font-weight:var(--fw-bold);color:#f1f5f9;"></div>
        <div style="font-size:var(--text-xs);color:#4ade80;">Secure channel · Active</div>
      </div>
    </div>
    <div class="chat-overlay__messages" id="chatMessages"></div>
    <div class="chat-overlay__input">
      <div id="imgAttachPreview" style="display:none;padding:var(--sp-2);background:#0f172a;border-radius:var(--r-md);margin-bottom:var(--sp-2);">
        <img id="imgAttachThumb" style="width:48px;height:48px;object-fit:cover;border-radius:var(--r-sm);" alt="attachment">
        <button onclick="clearAttach()" style="background:none;border:none;color:#f43f5e;font-size:0.75rem;cursor:pointer;margin-left:8px;">Remove</button>
      </div>
      <label class="chat-attach" for="imgAttachInput" title="Attach image">
        <i class="fa-solid fa-camera"></i>
        <input type="file" id="imgAttachInput" style="display:none;" accept="image/*">
      </label>
      <input type="text" id="chatMsgInput" placeholder="Type a message…" autocomplete="off">
      <button class="chat-send" id="chatSendBtn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- Image viewer -->
  <div class="img-viewer" id="imgViewer" onclick="this.classList.remove('open')">
    <img id="imgViewerSrc" alt="full view">
  </div>

  <script type="module">
    import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import {
      collection, onSnapshot, doc, updateDoc, deleteDoc, getDoc,
      addDoc, arrayUnion, increment, query, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    let allUsers  = [];
    let activeChatUid = null;
    let attachBase64  = null;
    let chatUnsub     = null;

    const APPROVED  = ['VERIFIED','SUCCESSFUL','APPROVED'];
    const STATUS_COLORS = { SUCCESSFUL:'#4ade80', APPROVED:'#4ade80', FAILED:'#f43f5e', DECLINED:'#f43f5e', REJECTED:'#f43f5e', PENDING:'#fbbf24' };

    // ── Auth guard ──
    onAuthStateChanged(auth, (user) => {
      if (!user || user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        location.href = 'login.html';
        return;
      }
      init();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => location.href = 'login.html');
    });

    // ── Tab switching ──
    window.switchTab = (tab) => {
      document.querySelectorAll('.admin-tab,.admin-pane').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('pane-' + tab).classList.add('active');
    };

    // ── Search ──
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderUsers(e.target.value.toLowerCase());
    });

    // ── Init ──
    function init() {
      // Users listener
      onSnapshot(collection(db, 'users'), (snap) => {
        allUsers = [];
        let taskCount = 0, chatCount = 0;
        snap.forEach(d => {
          const data = { id: d.id, ...d.data() };
          if (data.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase()) return;
          allUsers.push(data);

          const needsAction = ['PENDING','UNDER_REVIEW'].includes(data.kycStatus) ||
            ['PENDING'].includes(data.applyStatus) || ['PENDING'].includes(data.awardStatus) ||
            ['PENDING'].includes(data.withdrawStatus) || ['PENDING'].includes(data.depositStatus) ||
            ['PENDING','PENDING_VALIDATION'].includes(data.taxStatus);
          if (needsAction) taskCount++;

          if (data.chatHistory?.length) {
            const last = data.chatHistory[data.chatHistory.length - 1];
            if (last?.sender === 'USER') chatCount++;
          }
        });

        document.getElementById('userCount').textContent = `Users: ${allUsers.length}`;

        const tBadge = document.getElementById('taskBadge');
        tBadge.textContent = taskCount;
        tBadge.style.display = taskCount > 0 ? 'inline' : 'none';

        const cBadge = document.getElementById('chatBadge');
        cBadge.textContent = chatCount;
        cBadge.style.display = chatCount > 0 ? 'inline' : 'none';

        renderUsers('');
        renderTasks();
        renderChatList();
      });

      // Logs listener
      onSnapshot(query(collection(db, 'logs'), orderBy('timestamp','desc'), limit(60)), (snap) => {
        const list = document.getElementById('logList');
        list.innerHTML = '';
        snap.forEach(l => {
          const log = l.data();
          const color = STATUS_COLORS[log.action?.split(' ')[0]] || '#94a3b8';
          list.innerHTML += `
            <div class="log-row">
              <div class="log-row__text">
                <strong style="color:#f1f5f9;">${log.targetUser || 'System'}</strong>:
                <span style="color:${color};">${log.action || ''}</span>
              </div>
              <div class="log-row__time">${new Date(log.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
          `;
        });
        if (!snap.size) list.innerHTML = '<p style="text-align:center;color:#475569;font-size:var(--text-sm);padding:var(--sp-8);">No logs yet.</p>';
      });
    }

    // ── Render Users ──
    function renderUsers(query) {
      const list = document.getElementById('userList');
      const filtered = allUsers.filter(u =>
        !query ||
        (u.fullName  || '').toLowerCase().includes(query) ||
        (u.email     || '').toLowerCase().includes(query) ||
        (u.kycStatus || '').toLowerCase().includes(query)
      );
      if (!filtered.length) { list.innerHTML = '<p style="text-align:center;color:#475569;font-size:var(--text-sm);padding:var(--sp-8);">No users found.</p>'; return; }

      list.innerHTML = filtered.map(u => {
        const kycVerified = APPROVED.includes(u.kycStatus);
        const hasWithdraw = u.withdrawStatus === 'PENDING';
        const wDetails = hasWithdraw && u.withdrawDetails ? `
          <div class="withdraw-strip">
            <div class="withdraw-strip__title"><i class="fa-solid fa-paper-plane" style="margin-right:5px;"></i>Withdrawal Request — $${Number(u.withdrawAmount||0).toLocaleString()}</div>
            <div class="withdraw-strip__row">Method: <strong>${(u.withdrawMethod||'').toUpperCase()}</strong></div>
            ${u.withdrawDetails.type === 'ACH' ? `<div class="withdraw-strip__row">Bank: <strong>${u.withdrawDetails.bank||'—'}</strong> · Routing: <strong>${u.withdrawDetails.routing||'—'}</strong> · Account: <strong>${u.withdrawDetails.account||'—'}</strong></div>` : ''}
            ${u.withdrawDetails.type === 'WIRE' ? `<div class="withdraw-strip__row">SWIFT: <strong>${u.withdrawDetails.swift||'—'}</strong> · Beneficiary: <strong>${u.withdrawDetails.beneficiary||'—'}</strong> · Account: <strong>${u.withdrawDetails.account||'—'}</strong></div>` : ''}
            ${u.withdrawDetails.type === 'CARD' ? `<div class="withdraw-strip__row">Card: <strong>${u.withdrawDetails.number||'—'}</strong> · Name: <strong>${u.withdrawDetails.name||'—'}</strong></div>` : ''}
            ${u.withdrawDetails.type === 'CRYPTO' ? `<div class="withdraw-strip__row">Network: <strong>${u.withdrawDetails.network||'—'}</strong></div><div class="withdraw-strip__row">Address: <strong style="font-family:monospace;font-size:10px;">${u.withdrawDetails.address||'—'}</strong></div>` : ''}
          </div>` : '';

        return `
          <div class="user-card">
            <div class="user-card__header">
              <div>
                <div class="user-card__name">${u.fullName || 'Unknown'}</div>
                <div class="user-card__email">${u.email || '—'}</div>
                <div style="margin-top:var(--sp-2);display:flex;align-items:center;gap:var(--sp-2);">
                  <span class="badge ${kycVerified ? 'badge--success' : 'badge--neutral'}" style="font-size:10px;">${kycVerified ? 'KYC Verified' : 'KYC Pending'}</span>
                  ${u.withdrawPin ? `<span style="font-size:10px;color:#475569;">PIN: ${u.withdrawPin}</span>` : ''}
                </div>
              </div>
              <div style="text-align:right;">
                <div class="user-card__bal-label">Balance</div>
                <div class="user-card__balance">$${Number(u.balance||0).toLocaleString()}</div>
              </div>
            </div>

            <div class="user-card__details">
              <div class="detail-item">
                <div class="detail-item__label">Phone</div>
                <div class="detail-item__value">${u.phoneNumber || '—'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item__label">Country</div>
                <div class="detail-item__value">${u.country || '—'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item__label">Program</div>
                <div class="detail-item__value">${u.allocatedProgram || '—'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item__label">Apply Status</div>
                <div class="detail-item__value" style="color:${STATUS_COLORS[u.applyStatus]||'#94a3b8'};">${u.applyStatus || 'IDLE'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item__label">Deposit</div>
                <div class="detail-item__value" style="color:${STATUS_COLORS[u.depositStatus]||'#94a3b8'};">${u.depositStatus || 'IDLE'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item__label">Withdrawal</div>
                <div class="detail-item__value" style="color:${STATUS_COLORS[u.withdrawStatus]||'#94a3b8'};">${u.withdrawStatus || 'IDLE'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item__label">Tax</div>
                <div class="detail-item__value" style="color:${STATUS_COLORS[u.taxStatus]||'#94a3b8'};">${u.taxStatus || 'IDLE'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item__label">Award</div>
                <div class="detail-item__value" style="color:${STATUS_COLORS[u.awardStatus]||'#94a3b8'};">${u.awardStatus || 'IDLE'}</div>
              </div>
            </div>

            ${wDetails}

            <div class="user-card__actions">
              <button class="action-btn action-btn--chat" onclick="openChat('${u.id}','${(u.fullName||'User').replace(/'/g,"\\'")}')"><i class="fa-solid fa-comment"></i> Chat</button>
              <button class="action-btn action-btn--fund" onclick="fundUser('${u.id}')"><i class="fa-solid fa-plus"></i> Fund</button>
              <button class="action-btn action-btn--verify" onclick="toggleKyc('${u.id}','${u.kycStatus||'IDLE'}')">${kycVerified ? 'Revoke KYC' : 'Verify KYC'}</button>
              <button class="action-btn action-btn--delete" onclick="deleteUser('${u.id}','${(u.fullName||'User').replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ── Render Tasks ──
    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      let count = 0;

      allUsers.forEach(u => {
        const name = u.fullName || 'Unknown';

        function makeTask(type, label, images, amt) {
          count++;
          const imgs = (images || []).filter(Boolean);
          list.innerHTML += `
            <div class="task-card">
              <div class="task-card__user">${name}</div>
              <div class="task-card__type">${label}</div>
              ${imgs.length ? `<div class="task-images">${imgs.map(i => `<img src="${i}" onclick="viewImage('${i}')" alt="evidence">`).join('')}</div>` : ''}
              <div class="task-actions">
                <button class="task-approve" onclick="processTask('${u.id}','${type}','SUCCESSFUL',${amt},'${name}')">Approve</button>
                <button class="task-decline" onclick="processTask('${u.id}','${type}','FAILED',${amt},'${name}')">Decline</button>
              </div>
            </div>
          `;
        }

        if (['PENDING','UNDER_REVIEW'].includes(u.kycStatus)) makeTask('kyc', 'ID Verification', [u.idFront, u.idBack], 0);
        if (u.applyStatus === 'PENDING')    makeTask('apply',   `Grant Application — $${Number(u.requestedAmount||0).toLocaleString()}`, null, u.requestedAmount||0);
        if (u.depositStatus === 'PENDING')  makeTask('deposit', `Deposit Proof — $${Number(u.depositAmount||0).toLocaleString()}`, [u.depositProof], u.depositAmount||0);
        if (['PENDING','PENDING_VALIDATION'].includes(u.taxStatus)) makeTask('tax', 'Tax Compliance', [u.taxProof], 0);
        if (u.withdrawStatus === 'PENDING') makeTask('withdraw', `Withdrawal Request — $${Number(u.withdrawAmount||0).toLocaleString()}`, null, u.withdrawAmount||0);
        if (u.awardStatus === 'PENDING')    makeTask('award', 'Award Certificate Request', null, 0);
      });

      document.getElementById('noTasks').style.display = count === 0 ? 'block' : 'none';
    }

    // ── Render Chat List ──
    function renderChatList() {
      const list = document.getElementById('chatList');
      const withChats = allUsers.filter(u => u.chatHistory?.length);
      document.getElementById('noChats').style.display = withChats.length === 0 ? 'block' : 'none';
      list.innerHTML = withChats.map(u => {
        const last   = u.chatHistory[u.chatHistory.length - 1];
        const unread = last?.sender === 'USER';
        const time   = last ? new Date(last.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
        return `
          <div class="chat-list-item ${unread ? 'unread' : ''}" onclick="openChat('${u.id}','${(u.fullName||'User').replace(/'/g,"\\'")}')">
            <div class="chat-avatar">${(u.fullName||'U')[0].toUpperCase()}</div>
            <div style="flex:1;overflow:hidden;">
              <div style="font-size:var(--text-sm);font-weight:var(--fw-semi);color:#f1f5f9;">${u.fullName || 'Unknown'}</div>
              <div class="chat-preview">${last?.text || '📷 Image'}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
              ${unread ? '<span style="width:8px;height:8px;border-radius:50%;background:#38bdf8;display:block;"></span>' : ''}
              <span style="font-size:10px;color:#475569;">${time}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // ── Process Task ──
    window.processTask = async (uid, type, status, amt, name) => {
      let note = '';
      if (status === 'FAILED') {
        note = prompt(`Decline reason for ${name}:`, 'Documentation could not be verified. Please resubmit.');
        if (note === null) return;
      }

      const ref    = doc(db, 'users', uid);
      const update = {};
      update[`${type}Status`] = status;
      if (note) update[`${type}Note`] = note;
      if (note && type === 'withdraw') { update.withdrawReason = note; update.depositReason = note; }

      if (status === 'SUCCESSFUL') {
        if (['apply','deposit'].includes(type)) update.balance = increment(Number(amt));
      } else if (status === 'FAILED' && type === 'withdraw') {
        update.balance = increment(Number(amt)); // refund
      }

      update.ledger = arrayUnion({
        type:   type.toUpperCase(), amount: Number(amt), status,
        date:   new Date().toLocaleDateString(), reason: note || ''
      });

      try {
        await updateDoc(ref, update);
        await addDoc(collection(db, 'logs'), {
          targetUser: name, action: `${status}: ${type.toUpperCase()} ($${amt})`,
          timestamp:  new Date().toISOString()
        });
      } catch (e) { alert('Error: ' + e.message); }
    };

    // ── Fund User ──
    window.fundUser = async (uid) => {
      const val = prompt('Enter amount to add or subtract (e.g. 5000 or -1000):');
      if (!val || isNaN(val)) return;
      const ref = doc(db, 'users', uid);
      await updateDoc(ref, {
        balance: increment(Number(val)),
        ledger:  arrayUnion({ type:'ADMIN ADJUSTMENT', amount: Math.abs(val), status:'SUCCESSFUL', date: new Date().toLocaleDateString(), reason:'Manual admin adjustment' })
      });
      const snap = await getDoc(ref);
      await addDoc(collection(db,'logs'),{ targetUser: snap.data()?.fullName||'User', action:`Manual Adjustment: $${val}`, timestamp: new Date().toISOString() });
    };

    // ── Toggle KYC ──
    window.toggleKyc = async (uid, current) => {
      const status = APPROVED.includes(current) ? 'IDLE' : 'VERIFIED';
      await updateDoc(doc(db,'users',uid), { kycStatus: status });
      const snap = await getDoc(doc(db,'users',uid));
      await addDoc(collection(db,'logs'),{ targetUser: snap.data()?.fullName||'User', action:`KYC set to ${status}`, timestamp: new Date().toISOString() });
    };

    // ── Delete User ──
    window.deleteUser = async (uid, name) => {
      if (!confirm(`Permanently delete ${name}?`)) return;
      await deleteDoc(doc(db,'users',uid));
      await addDoc(collection(db,'logs'),{ targetUser: name, action:'ACCOUNT DELETED', timestamp: new Date().toISOString() });
    };

    // ── Chat ──
    window.openChat = (uid, name) => {
      activeChatUid = uid;
      document.getElementById('chatOverlayName').textContent = name;
      document.getElementById('chatOverlay').classList.add('open');

      if (chatUnsub) chatUnsub();
      chatUnsub = onSnapshot(doc(db,'users',uid), (snap) => {
        const history = snap.data()?.chatHistory || [];
        const msgs    = document.getElementById('chatMessages');
        msgs.innerHTML = history.map(m => `
          <div class="chat-msg chat-msg--${m.sender === 'ADMIN' ? 'admin' : 'user'}">
            ${m.text ? `<p style="margin:0;">${m.text}</p>` : ''}
            ${m.image ? `<img src="${m.image}" onclick="viewImage('${m.image}')" alt="attachment">` : ''}
            <div class="chat-msg__time">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        `).join('');
        setTimeout(() => msgs.scrollTo({ top: msgs.scrollHeight, behavior:'smooth' }), 80);
      });
    };

    window.closeChat = () => {
      document.getElementById('chatOverlay').classList.remove('open');
      if (chatUnsub) { chatUnsub(); chatUnsub = null; }
      activeChatUid = null;
    };

    // Attach image in chat
    document.getElementById('imgAttachInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.src = ev.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale  = 600 / img.width;
          canvas.width = 600; canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
          attachBase64 = canvas.toDataURL('image/jpeg',0.7);
          document.getElementById('imgAttachThumb').src = attachBase64;
          document.getElementById('imgAttachPreview').style.display = 'flex';
        };
      };
      reader.readAsDataURL(file);
    });

    window.clearAttach = () => {
      attachBase64 = null;
      document.getElementById('imgAttachPreview').style.display = 'none';
      document.getElementById('imgAttachInput').value = '';
    };

    document.getElementById('chatSendBtn').addEventListener('click', async () => {
      if (!activeChatUid) return;
      const text = document.getElementById('chatMsgInput').value.trim();
      if (!text && !attachBase64) return;
      const btn = document.getElementById('chatSendBtn');
      btn.disabled = true;
      try {
        await updateDoc(doc(db,'users',activeChatUid), {
          chatHistory: arrayUnion({ sender:'ADMIN', text, image: attachBase64, time: new Date().toISOString() })
        });
        document.getElementById('chatMsgInput').value = '';
        clearAttach();
      } catch (e) { console.error(e); }
      btn.disabled = false;
    });

    document.getElementById('chatMsgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('chatSendBtn').click();
    });

    // ── Image viewer ──
    window.viewImage = (src) => {
      document.getElementById('imgViewerSrc').src = src;
      document.getElementById('imgViewer').classList.add('open');
    };
  </script>
</body>
</html>
