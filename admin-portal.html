<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel | SBA Grant Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        /* Admin specific layout overrides */
        body { background: #0f172a; color: #f1f5f9; }
        .admin-main__content { padding: 24px; max-width: 100%; }
        
        /* User Card Detail Grid */
        .user-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; margin-top: 12px; }
        .detail-item { font-size: 0.8rem; }
        .detail-label { color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.65rem; margin-bottom: 4px; }
        .detail-val { color: #cbd5e1; word-break: break-all; }

        /* Chat Admin UI */
        .admin-chat-layout { display: grid; grid-template-columns: 320px 1fr; height: 700px; background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        .chat-list { border-right: 1px solid #334155; overflow-y: auto; background: #0f172a; }
        .chat-thread { padding: 16px; border-bottom: 1px solid #1e293b; cursor: pointer; transition: 0.2s; }
        .chat-thread:hover, .chat-thread.active { background: #1e293b; }
        .chat-view { display: flex; flex-direction: column; background: #1e293b; }
        .chat-messages-admin { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* Modal for Admin Actions */
        .admin-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .admin-modal { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 500px; padding: 32px; box-shadow: var(--shadow-lg); }
        
        /* Lightbox for receipts */
        .admin-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        .admin-lightbox img { max-width: 100%; max-height: 80vh; border-radius: 8px; border: 4px solid #334155; }

        /* Scrollbar styling for Admin */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-sidebar__logo">
                <div class="sba-logo">
                    <svg class="sba-logo__mark" viewBox="0 0 80 80">
                        <path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#ffffff"/>
                        <path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/>
                        <text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#ffffff">S</text>
                        <text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#ffffff">B</text>
                        <text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#ffffff">A</text>
                    </svg>
                    <div class="sba-logo__text">
                        <span class="sba-logo__name" style="color:white;">SBA Admin</span>
                        <span class="sba-logo__sub" style="color:#64748b;">Control Portal</span>
                    </div>
                </div>
            </div>
            <nav class="admin-sidebar__nav">
                <button class="admin-nav-item active" data-tab="overview"><i class="fa-solid fa-gauge"></i> Overview</button>
                <button class="admin-nav-item" data-tab="users"><i class="fa-solid fa-users"></i> User Database</button>
                <button class="admin-nav-item" data-tab="applications"><i class="fa-solid fa-file-contract"></i> Applications <span class="admin-nav-item__badge" id="count-apply">0</span></button>
                <button class="admin-nav-item" data-tab="kyc"><i class="fa-solid fa-id-card"></i> KYC Verification <span class="admin-nav-item__badge" id="count-kyc">0</span></button>
                <button class="admin-nav-item" data-tab="deposits"><i class="fa-solid fa-wallet"></i> Deposits <span class="admin-nav-item__badge" id="count-deposit">0</span></button>
                <button class="admin-nav-item" data-tab="withdrawals"><i class="fa-solid fa-money-bill-transfer"></i> Withdrawals <span class="admin-nav-item__badge" id="count-withdraw">0</span></button>
                <button class="admin-nav-item" data-tab="tax"><i class="fa-solid fa-receipt"></i> Tax Clearance <span class="admin-nav-item__badge" id="count-tax">0</span></button>
                <button class="admin-nav-item" data-tab="chat"><i class="fa-solid fa-comments"></i> Support Desk <span class="admin-nav-item__badge" id="count-chat">0</span></button>
                <button class="admin-nav-item" data-tab="logs"><i class="fa-solid fa-scroll"></i> Audit Logs</button>
                <button class="admin-nav-item" data-tab="settings"><i class="fa-solid fa-gear"></i> Platform Config</button>
                <div style="margin-top:auto; padding-top:20px;">
                    <button class="admin-nav-item" id="adminSignOut" style="color:#f43f5e;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </nav>
        </aside>

        <div class="app-sidebar__overlay" id="adminOverlay"></div>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button class="hamburger" id="adminHamburger" style="color:white; border-color:#334155;"><i class="fa-solid fa-bars"></i></button>
                    <h2 id="currentTabTitle" style="font-weight:800; font-size:1.2rem;">Overview</h2>
                </div>
                <div style="display:flex; align-items:center; gap:20px;">
                    <div id="adminUser" style="text-align:right; font-size:0.8rem; color:#94a3b8;">
                        <div style="font-weight:700; color:white;" id="adminEmailLabel">...</div>
                        <div>Administrator Access</div>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <!-- Overview Tab -->
                <div class="admin-pane active" id="pane-overview">
                    <div class="admin-stats">
                        <div class="admin-stat"><div class="admin-stat__label">Total Users</div><div class="admin-stat__value" id="stat-totalUsers">0</div></div>
                        <div class="admin-stat"><div class="admin-stat__label">Active Grants</div><div class="admin-stat__value" id="stat-activeGrants">0</div></div>
                        <div class="admin-stat"><div class="admin-stat__label">Total Disbursed</div><div class="admin-stat__value" id="stat-totalDisbursed">$0.00</div></div>
                        <div class="admin-stat"><div class="admin-stat__label">Pending Action</div><div class="admin-stat__value text-error" id="stat-pendingAction">0</div></div>
                    </div>
                    <div class="admin-card">
                        <h3 style="margin-bottom:20px; font-weight:800;">Announcement Banner</h3>
                        <div class="form-group">
                            <input type="text" id="platformAnnouncement" class="form-input" style="background:#0f172a; border-color:#334155;" placeholder="Enter message for all users...">
                        </div>
                        <button class="btn btn--primary" id="btnSaveAnnouncement">Update Announcement</button>
                    </div>
                </div>

                <!-- Users Tab -->
                <div class="admin-pane" id="pane-users">
                    <div style="display:flex; gap:12px; margin-bottom:20px;">
                        <input type="text" id="userSearch" class="form-input" style="background:#1e293b; border-color:#334155;" placeholder="Search by name or email...">
                    </div>
                    <div id="userList"></div>
                </div>

                <!-- KYC Tab -->
                <div class="admin-pane" id="pane-kyc">
                    <div id="kycQueue"></div>
                </div>

                <!-- Applications Tab -->
                <div class="admin-pane" id="pane-applications">
                    <div id="appQueue"></div>
                </div>

                <!-- Deposits Tab -->
                <div class="admin-pane" id="pane-deposits">
                    <div id="depositQueue"></div>
                </div>

                <!-- Withdrawals Tab -->
                <div class="admin-pane" id="pane-withdrawals">
                    <div id="withdrawQueue"></div>
                </div>

                <!-- Tax Tab -->
                <div class="admin-pane" id="pane-tax">
                    <div id="taxQueue"></div>
                </div>

                <!-- Chat Tab -->
                <div class="admin-pane" id="pane-chat">
                    <div class="admin-chat-layout">
                        <div class="chat-list" id="adminChatList"></div>
                        <div class="chat-view">
                            <div class="chat-messages-admin" id="adminChatMessages">
                                <div style="margin:auto; text-align:center; color:#64748b;">
                                    <i class="fa-solid fa-comments fa-3x mb-4"></i>
                                    <p>Select a user to start chatting</p>
                                </div>
                            </div>
                            <form class="chat-input-area" id="adminChatForm" style="background:#0f172a; border-top-color:#334155; display:none;">
                                <input type="text" class="chat-input" id="adminChatInput" placeholder="Type a message..." style="background:#1e293b; border-color:#334155; color:white;">
                                <button type="submit" class="btn btn--primary"><i class="fa-solid fa-paper-plane"></i></button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Audit Logs Tab -->
                <div class="admin-pane" id="pane-logs">
                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target UID</th></tr></thead>
                            <tbody id="auditTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Platform Settings Tab -->
                <div class="admin-pane" id="pane-settings">
                    <div class="admin-card">
                        <h3 class="mb-6">Global Platform Control</h3>
                        <div class="form-group">
                            <label class="form-label">Total Disbursed Counter ($)</label>
                            <input type="number" id="conf-totalDisbursed" class="form-input" style="background:#0f172a; border-color:#334155;">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Default Tax Fee ($)</label>
                            <input type="number" id="conf-taxFee" class="form-input" style="background:#0f172a; border-color:#334155;">
                        </div>
                        <button class="btn btn--primary" id="btnSaveConfig">Save Global Settings</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Admin Modals -->
    <div class="admin-modal-overlay" id="adminModal">
        <div class="admin-modal" id="adminModalContent"></div>
    </div>

    <div class="admin-lightbox" id="adminLightbox" onclick="this.style.display='none'">
        <button class="btn btn--ghost" style="position:absolute; top:20px; right:20px; color:white;"><i class="fa-solid fa-xmark fa-2x"></i></button>
        <img src="" id="lightboxImgTarget">
        <p style="margin-top:20px; font-weight:600; color:#94a3b8;" id="lightboxCaption"></p>
    </div>

    <script type="module">
        import { 
            db, auth, onSnapshot, collection, query, where, orderBy, limit, 
            doc, getDoc, updateDoc, deleteDoc, increment, serverTimestamp, 
            addDoc, signOut, notify, logAdminAction, formatCurrency
        } from './firebase-config.js';
        import { requireAdmin, initTheme, showToast, showConfirm, setButtonLoading } from './app.js';

        requireAdmin((user, userData) => {
            initTheme();
            document.getElementById('adminEmailLabel').innerText = user.email;

            // Tab Navigation
            document.querySelectorAll('.admin-nav-item[data-tab]').forEach(btn => {
                btn.onclick = () => {
                    const tab = btn.dataset.tab;
                    document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.admin-pane').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`pane-${tab}`).classList.add('active');
                    document.getElementById('currentTabTitle').innerText = btn.innerText;
                };
            });

            // Global Real-time Counts for Badges
            onSnapshot(collection(db, "users"), (snap) => {
                let kycCount = 0, applyCount = 0, depCount = 0, withCount = 0, taxCount = 0;
                let totalDisbursed = 0;
                
                snap.forEach(d => {
                    const u = d.data();
                    if(u.kycStatus === 'UNDER_REVIEW') kycCount++;
                    if(u.applyStatus === 'PENDING') applyCount++;
                    if(u.depositStatus === 'PENDING') depCount++;
                    if(u.withdrawStatus === 'PENDING') withCount++;
                    if(u.taxStatus === 'PENDING') taxCount++;
                });

                document.getElementById('count-kyc').innerText = kycCount;
                document.getElementById('count-apply').innerText = applyCount;
                document.getElementById('count-deposit').innerText = depCount;
                document.getElementById('count-withdraw').innerText = withCount;
                document.getElementById('count-tax').innerText = taxCount;
                document.getElementById('stat-totalUsers').innerText = snap.size;
                document.getElementById('stat-pendingAction').innerText = kycCount + applyCount + depCount + withCount + taxCount;
            });

            // Overview Section logic
            onSnapshot(doc(db, "config", "platform"), (snap) => {
                if(snap.exists()){
                    const data = snap.data();
                    document.getElementById('stat-totalDisbursed').innerText = formatCurrency(data.totalDisbursed || 0);
                    document.getElementById('platformAnnouncement').value = data.announcementBanner || '';
                    document.getElementById('conf-totalDisbursed').value = data.totalDisbursed || 0;
                    document.getElementById('conf-taxFee').value = data.taxFeeDefault || 0;
                }
            });

            document.getElementById('btnSaveAnnouncement').onclick = async () => {
                const val = document.getElementById('platformAnnouncement').value;
                await updateDoc(doc(db, "config", "platform"), { announcementBanner: val });
                showToast('Announcement updated');
            };

            document.getElementById('btnSaveConfig').onclick = async () => {
                await updateDoc(doc(db, "config", "platform"), {
                    totalDisbursed: parseFloat(document.getElementById('conf-totalDisbursed').value),
                    taxFeeDefault: parseFloat(document.getElementById('conf-taxFee').value)
                });
                showToast('Global configuration saved');
            };

            // User List with Detailed Actions
            let allUsers = [];
            onSnapshot(query(collection(db, "users"), orderBy("createdAt", "desc")), (snap) => {
                allUsers = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderUsers(allUsers);
            });

            function renderUsers(users) {
                const list = document.getElementById('userList');
                list.innerHTML = users.map(u => `
                    <div class="admin-card">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px;">
                            <div style="display:flex; gap:12px; align-items:center;">
                                <div style="width:40px; height:40px; border-radius:50%; background:#334155; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.9rem;">
                                    ${u.fullName.charAt(0)}
                                </div>
                                <div>
                                    <div style="font-weight:700;">${u.fullName} <span style="font-size:0.7rem; opacity:0.5;">#${u.id.substring(0,8)}</span></div>
                                    <div style="font-size:0.75rem; color:#94a3b8;">${u.email}</div>
                                </div>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button class="btn btn--secondary btn--sm" onclick="adminFundUser('${u.id}', '${u.fullName}')"><i class="fa-solid fa-coins"></i> Fund</button>
                                <button class="btn btn--secondary btn--sm" onclick="adminSetTax('${u.id}')"><i class="fa-solid fa-receipt"></i> Tax</button>
                                <button class="btn btn--secondary btn--sm" onclick="adminToggleStatus('${u.id}', '${u.accountStatus}')">${u.accountStatus === 'active' ? 'Suspend' : 'Activate'}</button>
                                <button class="btn btn--danger btn--sm" onclick="adminDeleteUser('${u.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="user-detail-grid">
                            <div class="detail-item"><div class="detail-label">Balance</div><div class="detail-val" style="color:#22c55e; font-weight:800;">${formatCurrency(u.balance)}</div></div>
                            <div class="detail-item"><div class="detail-label">Requested</div><div class="detail-val">${formatCurrency(u.requestedAmount)}</div></div>
                            <div class="detail-item"><div class="detail-label">Awarded</div><div class="detail-val" style="color:#eab308;">${formatCurrency(u.totalAward)}</div></div>
                            <div class="detail-item"><div class="detail-label">Status</div><div class="detail-val">${u.accountStatus.toUpperCase()}</div></div>
                            <div class="detail-item"><div class="detail-label">Role</div><div class="detail-val">${u.role.toUpperCase()}</div></div>
                            <div class="detail-item"><div class="detail-label">Last Seen</div><div class="detail-val">${u.lastSeen ? new Date(u.lastSeen.seconds * 1000).toLocaleString() : 'N/A'}</div></div>
                        </div>
                    </div>
                `).join('');
            }

            // KYC Verification Queue
            onSnapshot(query(collection(db, "users"), where("kycStatus", "==", "UNDER_REVIEW")), (snap) => {
                const q = document.getElementById('kycQueue');
                if(snap.empty) { q.innerHTML = '<p class="text-muted">No KYC documents pending review.</p>'; return; }
                q.innerHTML = snap.docs.map(doc => {
                    const u = doc.data();
                    return `
                        <div class="admin-card">
                            <div class="flex justify-between mb-4">
                                <div><h4 style="margin-bottom:4px;">${u.fullName}</h4><p class="detail-label">KYC Submission</p></div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn btn--primary btn--sm" onclick="adminApproveKyc('${doc.id}')">Approve</button>
                                    <button class="btn btn--danger btn--sm" onclick="adminRejectKyc('${doc.id}')">Reject</button>
                                </div>
                            </div>
                            <div style="display:flex; gap:12px;">
                                <img src="${u.kyc.idFrontBase64}" style="width:120px; height:80px; object-fit:cover; border-radius:4px; cursor:pointer;" onclick="openAdminLightbox('${u.kyc.idFrontBase64}', 'ID Front - ${u.fullName}')">
                                <img src="${u.kyc.idBackBase64}" style="width:120px; height:80px; object-fit:cover; border-radius:4px; cursor:pointer;" onclick="openAdminLightbox('${u.kyc.idBackBase64}', 'ID Back - ${u.fullName}')">
                            </div>
                        </div>
                    `;
                }).join('');
            });

            // Applications Queue
            onSnapshot(query(collection(db, "users"), where("applyStatus", "==", "PENDING")), (snap) => {
                const q = document.getElementById('appQueue');
                if(snap.empty) { q.innerHTML = '<p class="text-muted">No grant applications pending review.</p>'; return; }
                q.innerHTML = snap.docs.map(doc => {
                    const u = doc.data();
                    const app = u.application;
                    return `
                        <div class="admin-card">
                            <div class="flex justify-between mb-4">
                                <div><h4 style="margin-bottom:4px;">${u.fullName}</h4><p class="detail-label">Grant Application: ${formatCurrency(u.requestedAmount)}</p></div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn btn--primary btn--sm" onclick="adminApproveApp('${doc.id}')">Approve</button>
                                    <button class="btn btn--danger btn--sm" onclick="adminRejectApp('${doc.id}')">Reject</button>
                                </div>
                            </div>
                            <div class="user-detail-grid">
                                <div class="detail-item"><div class="detail-label">Biz Name</div><div class="detail-val">${app.bizName}</div></div>
                                <div class="detail-item"><div class="detail-label">Biz Type</div><div class="detail-val">${app.bizType}</div></div>
                                <div class="detail-item"><div class="detail-label">EIN</div><div class="detail-val">${app.ein}</div></div>
                                <div class="detail-item"><div class="detail-label">Purpose</div><div class="detail-val">${app.grantPurpose}</div></div>
                            </div>
                        </div>
                    `;
                }).join('');
            });

            // Deposit Queue
            onSnapshot(query(collection(db, "users"), where("depositStatus", "==", "PENDING")), (snap) => {
                const q = document.getElementById('depositQueue');
                if(snap.empty) { q.innerHTML = '<p class="text-muted">No deposits pending verification.</p>'; return; }
                q.innerHTML = snap.docs.map(doc => {
                    const u = doc.data();
                    const dep = u.deposit;
                    return `
                        <div class="admin-card">
                            <div class="flex justify-between mb-4">
                                <div><h4 style="margin-bottom:4px;">${u.fullName}</h4><p class="detail-label">Deposit: ${formatCurrency(dep.amount)} via ${dep.method}</p></div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn btn--primary btn--sm" onclick="adminConfirmDeposit('${doc.id}')">Confirm</button>
                                    <button class="btn btn--danger btn--sm" onclick="adminRejectDeposit('${doc.id}')">Reject</button>
                                </div>
                            </div>
                            <div style="display:flex; gap:16px;">
                                <img src="${dep.receiptBase64}" style="width:100px; height:100px; object-fit:contain; background:#000; border-radius:4px; cursor:pointer;" onclick="openAdminLightbox('${dep.receiptBase64}', 'Receipt - ${u.fullName}')">
                                <div class="detail-item"><div class="detail-label">Coin/Net</div><div class="detail-val">${dep.coin} (${dep.network || 'N/A'})</div></div>
                            </div>
                        </div>
                    `;
                }).join('');
            });

            // Support Chat management
            let currentChatUid = null;
            onSnapshot(query(collection(db, "users"), orderBy("updatedAt", "desc")), (snap) => {
                const list = document.getElementById('adminChatList');
                list.innerHTML = snap.docs.filter(d => d.data().role !== 'admin').map(d => {
                    const u = d.data();
                    return `
                        <div class="chat-thread ${currentChatUid === d.id ? 'active' : ''}" onclick="openChatThread('${d.id}')">
                            <div style="font-weight:700; font-size:0.85rem;">${u.fullName}</div>
                            <div style="font-size:0.7rem; color:#94a3b8;">${u.email}</div>
                        </div>
                    `;
                }).join('');
            });

            window.openChatThread = (uid) => {
                currentChatUid = uid;
                document.getElementById('adminChatForm').style.display = 'flex';
                const msgBox = document.getElementById('adminChatMessages');
                
                onSnapshot(query(collection(db, "chat", uid, "messages"), orderBy("timestamp", "asc")), (snap) => {
                    msgBox.innerHTML = snap.docs.map(doc => {
                        const m = doc.data();
                        const isAgent = m.sender === 'agent';
                        return `
                            <div class="bubble bubble--${isAgent ? 'user' : 'agent'}" style="align-self: ${isAgent ? 'flex-end' : 'flex-start'}; background: ${isAgent ? '#3b82f6' : '#334155'}">
                                ${m.message}
                            </div>
                        `;
                    }).join('');
                    msgBox.scrollTop = msgBox.scrollHeight;
                });
            };

            document.getElementById('adminChatForm').onsubmit = async (e) => {
                e.preventDefault();
                const msg = document.getElementById('adminChatInput').value;
                if(!msg || !currentChatUid) return;
                
                await addDoc(collection(db, "chat", currentChatUid, "messages"), {
                    sender: 'agent',
                    message: msg,
                    timestamp: serverTimestamp()
                });
                
                document.getElementById('adminChatInput').value = '';
                notify(currentChatUid, { title: 'New Message from Support', message: msg, type: 'info', link: 'support.html' });
            };

            // Global Lightbox
            window.openAdminLightbox = (src, caption) => {
                document.getElementById('lightboxImgTarget').src = src;
                document.getElementById('lightboxCaption').innerText = caption;
                document.getElementById('adminLightbox').style.display = 'flex';
            };

            // Sign out
            document.getElementById('adminSignOut').onclick = () => {
                signOut(auth).then(() => window.location.href = 'login.html');
            };

            // Hamburger
            document.getElementById('adminHamburger').onclick = () => {
                document.getElementById('adminSidebar').classList.toggle('open');
                document.getElementById('adminOverlay').classList.toggle('show');
            };

            // Helper for Modal UI
            window.openAdminModal = (html) => {
                const m = document.getElementById('adminModal');
                document.getElementById('adminModalContent').innerHTML = html;
                m.style.display = 'flex';
            };
            window.closeAdminModal = () => document.getElementById('adminModal').style.display = 'none';

            // Exposed global functions for action buttons
            window.adminFundUser = (uid, name) => {
                openAdminModal(`
                    <h3 class="mb-4">Fund User: ${name}</h3>
                    <div class="form-group"><label class="form-label">Amount ($)</label><input type="number" id="fundAmt" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Note</label><input type="text" id="fundNote" class="form-input" placeholder="e.g. Approved Grant Disbursement"></div>
                    <div class="flex gap-4">
                        <button class="btn btn--primary flex-1" id="btnDoFund">Credit Account</button>
                        <button class="btn btn--ghost" onclick="closeAdminModal()">Cancel</button>
                    </div>
                `);
                document.getElementById('btnDoFund').onclick = async () => {
                    const amt = parseFloat(document.getElementById('fundAmt').value);
                    const note = document.getElementById('fundNote').value;
                    await updateDoc(doc(db, "users", uid), { balance: increment(amt), totalAward: increment(amt) });
                    await addDoc(collection(db, "users", uid, "ledger"), { type: 'award', amount: amt, description: note, status: 'CONFIRMED', createdAt: serverTimestamp() });
                    logAdminAction(user.uid, user.email, 'CREDIT_USER', uid, { amount: amt, note });
                    notify(uid, { title: 'Account Credited', message: `Your account has been credited with ${formatCurrency(amt)}.`, type: 'success' });
                    closeAdminModal();
                    showToast('Funds credited successfully');
                };
            };

            window.adminApproveKyc = (uid) => {
                showConfirm({
                    title: 'Approve Identity', message: 'Confirm documents are authentic and valid?',
                    onConfirm: async () => {
                        await updateDoc(doc(db, "users", uid), { kycStatus: 'APPROVED' });
                        notify(uid, { title: 'Identity Verified', message: 'Your identity documents have been approved. You can now apply for grants.', type: 'success', link: 'apply.html' });
                        logAdminAction(user.uid, user.email, 'APPROVE_KYC', uid);
                        showToast('KYC Approved');
                    }
                });
            };

            window.adminApproveApp = (uid) => {
                showConfirm({
                    title: 'Approve Grant Application', message: 'Set this application as approved?',
                    onConfirm: async () => {
                        await updateDoc(doc(db, "users", uid), { applyStatus: 'APPROVED' });
                        notify(uid, { title: 'Application Approved', message: 'Congratulations! Your grant application has been approved. Proceed to tax clearance.', type: 'success', link: 'tax.html' });
                        logAdminAction(user.uid, user.email, 'APPROVE_APP', uid);
                        showToast('Application Approved');
                    }
                });
            };

            window.adminConfirmDeposit = (uid) => {
                showConfirm({
                    title: 'Confirm Deposit', message: 'Add funds to user balance based on receipt?',
                    onConfirm: async () => {
                        const userDoc = await getDoc(doc(db, "users", uid));
                        const dep = userDoc.data().deposit;
                        await updateDoc(doc(db, "users", uid), { depositStatus: 'CONFIRMED', balance: increment(dep.amount) });
                        await addDoc(collection(db, "users", uid, "ledger"), { type: 'deposit', amount: dep.amount, description: 'Deposit Verified', status: 'CONFIRMED', createdAt: serverTimestamp() });
                        notify(uid, { title: 'Deposit Confirmed', message: `${formatCurrency(dep.amount)} has been added to your balance.`, type: 'success' });
                        logAdminAction(user.uid, user.email, 'CONFIRM_DEPOSIT', uid, { amount: dep.amount });
                        showToast('Deposit Confirmed');
                    }
                });
            };

            window.adminDeleteUser = (uid) => {
                showConfirm({
                    title: 'Delete User', message: 'Permanently delete this user? This cannot be undone.', danger: true,
                    onConfirm: async () => {
                        await deleteDoc(doc(db, "users", uid));
                        logAdminAction(user.uid, user.email, 'DELETE_USER', uid);
                        showToast('User Deleted');
                    }
                });
            };

            window.adminToggleStatus = async (uid, current) => {
                const next = current === 'active' ? 'suspended' : 'active';
                await updateDoc(doc(db, "users", uid), { accountStatus: next });
                logAdminAction(user.uid, user.email, 'TOGGLE_STATUS', uid, { status: next });
                showToast(`User ${next}`);
            };

            window.adminSetTax = (uid) => {
                openAdminModal(`
                    <h3 class="mb-4">Set Tax Clearance Fee</h3>
                    <div class="form-group"><label class="form-label">Fee Amount ($)</label><input type="number" id="taxFeeVal" class="form-input"></div>
                    <button class="btn btn--primary btn--full" id="btnDoTax">Assign Fee</button>
                `);
                document.getElementById('btnDoTax').onclick = async () => {
                    const fee = parseFloat(document.getElementById('taxFeeVal').value);
                    await updateDoc(doc(db, "users", uid), { taxFeeRequired: fee });
                    notify(uid, { title: 'Tax Requirement Updated', message: `A tax clearance fee of ${formatCurrency(fee)} is required.`, type: 'warning', link: 'tax.html' });
                    closeAdminModal();
                    showToast('Tax fee assigned');
                };
            };

            // Audit Logs Loading
            onSnapshot(query(collection(db, "auditLog"), orderBy("timestamp", "desc"), limit(50)), (snap) => {
                const body = document.getElementById('auditTableBody');
                body.innerHTML = snap.docs.map(doc => {
                    const log = doc.data();
                    return `
                        <tr>
                            <td>${log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleString() : '...'}</td>
                            <td>${log.adminEmail}</td>
                            <td><span style="color:#60a5fa; font-weight:700;">${log.action}</span></td>
                            <td>${log.targetUid}</td>
                        </tr>
                    `;
                }).join('');
            });

            hideLoader();
        });
    </script>
</body>
</html>
