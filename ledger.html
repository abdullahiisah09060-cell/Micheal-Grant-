<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transactions | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>
<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <main class="app-main">
        <div id="pageHeader"></div>
        <div class="app-main__content">
            
            <div class="stats-grid mb-8">
                <div class="stat-card">
                    <div class="stat-card__label">Total Balance</div>
                    <div class="stat-card__value" id="ledgerBal">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card__label">Lifetime Awards</div>
                    <div class="stat-card__value" id="ledgerAward">$0.00</div>
                </div>
            </div>

            <div class="card">
                <div class="flex justify-between items-center mb-6 overflow-x-auto gap-4 pb-2">
                    <div class="flex gap-2">
                        <button class="btn btn--sm btn--secondary active" data-filter="all">All</button>
                        <button class="btn btn--sm btn--ghost" data-filter="deposit">Deposits</button>
                        <button class="btn btn--sm btn--ghost" data-filter="withdrawal">Payouts</button>
                    </div>
                    <button class="btn btn--outline btn--sm" id="btnExport"><i class="fa-solid fa-file-export"></i> Export CSV</button>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Transaction</th>
                                <th>Status</th>
                                <th>Amount</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerBody"></tbody>
                    </table>
                </div>
                <div id="emptyState" style="display:none;" class="text-center py-12">
                    <i class="fa-solid fa-inbox text-muted mb-4" style="font-size:3rem;"></i>
                    <p class="text-muted">No transactions found matching your filters.</p>
                </div>
            </div>

        </div>
    </main>
</div>

<script type="module">
    import { db, collection, query, orderBy, onSnapshot } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, initNotificationBadge, formatCurrency, formatDate, renderStatusBadge } from './app.js';

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'ledger', userData });
        buildDock({ activeId: 'home' });
        buildPageHeader({ title: 'Transaction History', subtitle: 'Treasury Wallet Ledger', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        document.getElementById('ledgerBal').textContent = formatCurrency(userData.balance || 0);
        document.getElementById('ledgerAward').textContent = formatCurrency(userData.totalAward || 0);

        let transactions = [];
        const q = query(collection(db, 'users', user.uid, 'ledger'), orderBy('createdAt', 'desc'));
        
        onSnapshot(q, (snap) => {
            const body = document.getElementById('ledgerBody');
            transactions = [];
            body.innerHTML = '';
            
            if(snap.empty) { document.getElementById('emptyState').style.display = 'block'; return; }
            document.getElementById('emptyState').style.display = 'none';

            snap.forEach(doc => {
                const t = doc.data();
                transactions.push(t);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="flex items-center gap-3">
                            <div style="width:32px; height:32px; border-radius:50%; background:var(--navy-light); color:var(--navy); display:flex; align-items:center; justify-content:center; font-size:0.75rem;">
                                <i class="fa-solid ${getIcon(t.type)}"></i>
                            </div>
                            <span style="font-weight:700;">${t.description}</span>
                        </div>
                    </td>
                    <td>${renderStatusBadge(t.status || 'CONFIRMED')}</td>
                    <td style="font-weight:800; color:${t.amount >= 0 ? 'var(--success)' : 'var(--error)'}">${t.amount >= 0 ? '+' : ''}${formatCurrency(t.amount)}</td>
                    <td class="text-muted" style="font-size:0.8rem;">${formatDate(t.createdAt)}</td>
                `;
                body.appendChild(row);
            });
        });

        document.getElementById('btnExport').onclick = () => {
            let csv = 'Date,Description,Type,Amount,Status\n';
            transactions.forEach(t => {
                csv += `${formatDate(t.createdAt)},"${t.description}",${t.type},${t.amount},${t.status}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'SBA-Transactions.csv'; a.click();
        };
    });

    function getIcon(type) {
        const m = { deposit: 'fa-wallet', withdrawal: 'fa-money-bill-transfer', award: 'fa-trophy', fee: 'fa-receipt' };
        return m[type] || 'fa-file-invoice';
    }
</script>
</body>
</html>
