<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .ledger-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .ledger-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .ledger-table th { text-align: left; padding: 15px; background: var(--surface-2); font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; }
        .ledger-table td { padding: 15px; border-bottom: 1px solid var(--border-light); }
        .amount--plus { color: var(--success); font-weight: 700; }
        .amount--minus { color: var(--error); font-weight: 700; }
        @media (max-width: 768px) {
            .ledger-table thead { display: none; }
            .ledger-table tr { display: block; padding: 15px; background: var(--surface); margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); }
            .ledger-table td { display: flex; justify-content: space-between; padding: 8px 0; border: none; text-align: right; }
            .ledger-table td::before { content: attr(data-label); font-weight: 700; color: var(--text-muted); text-align: left; }
        }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
    
    <div class="ledger-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
            <div>
                <h1>Transaction Ledger</h1>
                <p style="color: var(--text-secondary);">Full history of your grant account activity.</p>
            </div>
            <button id="exportCsv" class="btn btn--outline btn--sm">Export CSV</button>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <table class="ledger-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
            <div id="emptyState" style="display: none; padding: 60px; text-align: center; color: var(--text-muted);">
                <div style="font-size: 3rem; margin-bottom: 15px;">📊</div>
                <p>No transactions found in your history.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, onSnapshot, collection, query, orderBy } from './firebase-config.js';
        import { requireAuth, hideLoader, formatCurrency, formatDate } from './app.js';

        let transactions = [];

        requireAuth((user) => {
            const q = query(collection(db, `users/${user.uid}/ledger`), orderBy('createdAt', 'desc'));
            
            onSnapshot(q, (snap) => {
                const body = document.getElementById('ledgerBody');
                const empty = document.getElementById('emptyState');
                transactions = [];

                if (snap.empty) {
                    body.innerHTML = '';
                    empty.style.display = 'block';
                } else {
                    empty.style.display = 'none';
                    body.innerHTML = '';
                    snap.forEach(d => {
                        const t = d.data();
                        transactions.push(t);
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td data-label="Date">${formatDate(t.createdAt)}</td>
                            <td data-label="Description"><b>${t.description}</b></td>
                            <td data-label="Type"><span class="badge badge--pending" style="background:var(--navy-light); color:var(--navy);">${t.type}</span></td>
                            <td data-label="Status"><span class="badge badge--${t.status.toLowerCase()}">${t.status}</span></td>
                            <td data-label="Amount" class="${t.amount >= 0 ? 'amount--plus' : 'amount--minus'}">
                                ${t.amount >= 0 ? '+' : ''}${formatCurrency(t.amount)}
                            </td>
                        `;
                        body.appendChild(row);
                    });
                }
                hideLoader();
            });
        });

        document.getElementById('exportCsv').onclick = () => {
            if (!transactions.length) return;
            const headers = ['Date', 'Description', 'Type', 'Status', 'Amount'];
            const rows = transactions.map(t => [
                formatDate(t.createdAt),
                t.description,
                t.type,
                t.status,
                t.amount
            ]);
            
            let csvContent = "data:text/csv;charset=utf-8," 
                + headers.join(",") + "\n"
                + rows.map(e => e.join(",")).join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `SBA_Ledger_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        };
    </script>
</body>
</html>
