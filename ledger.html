<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SBA | Transaction Ledger</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: calc(var(--dock-h) + var(--sp-8)); }
    .balance-strip {
      background: var(--navy); padding: var(--sp-5);
      display: flex; align-items: center; justify-content: space-between;
    }
    .balance-strip__label  { font-size: var(--text-xs); color: rgba(255,255,255,0.5); margin-bottom: 4px; }
    .balance-strip__amount { font-size: var(--text-2xl); font-weight: var(--fw-bold); color: white; letter-spacing: -0.02em; }
    .balance-strip__award  { font-size: var(--text-xs); color: rgba(255,255,255,0.5); margin-top: 4px; }

    .search-bar {
      display: flex; align-items: center; gap: var(--sp-3);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4);
    }
    .search-bar input {
      flex: 1; border: none; outline: none; font-size: var(--text-sm);
      font-family: var(--font); color: var(--text-primary); background: transparent;
    }
    .search-bar input::placeholder { color: var(--text-muted); }

    .ledger-table { width: 100%; border-collapse: collapse; }
    .ledger-table th {
      text-align: left; font-size: var(--text-xs); font-weight: var(--fw-semi);
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .ledger-table td { padding: var(--sp-4); border-bottom: 1px solid var(--border-light); vertical-align: top; }
    .ledger-table tr:last-child td { border-bottom: none; }
    .ledger-table tr:hover td { background: var(--bg); }

    .tx-type   { font-size: var(--text-sm); font-weight: var(--fw-semi); color: var(--text-primary); }
    .tx-date   { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
    .tx-amount { font-size: var(--text-sm); font-weight: var(--fw-bold); font-family: var(--font-mono); }
    .tx-reason { font-size: var(--text-xs); color: var(--red); margin-top: var(--sp-2); padding: var(--sp-2) var(--sp-3); background: var(--error-bg); border-left: 3px solid var(--red); border-radius: 0 var(--r-sm) var(--r-sm) 0; }

    .shimmer { background: linear-gradient(90deg, var(--border-light) 25%, var(--border) 50%, var(--border-light) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; height: 12px; border-radius: var(--r-sm); }
    @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  </style>
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="page-loader__spinner"></div>
    <p class="page-loader__text">Loading ledger…</p>
  </div>

  <header class="page-header">
    <a href="dashboard.html" class="page-header__back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="page-header__logo">SBA</div>
    <div style="flex:1;">
      <div class="page-header__title">Transaction Ledger</div>
      <span class="page-header__sub" id="ledgerRef">REF: Loading…</span>
    </div>
    <a href="dashboard.html" class="page-header__action"><i class="fa-solid fa-times"></i></a>
  </header>

  <!-- Balance strip -->
  <div class="balance-strip">
    <div>
      <div class="balance-strip__label">Available Balance</div>
      <div class="balance-strip__amount" id="balAmount">$0.00</div>
      <div class="balance-strip__award">Award: <span id="awardAmount">$0.00</span></div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:var(--text-xs);color:rgba(255,255,255,0.4);margin-bottom:4px;">Sync Status</div>
      <div id="syncStatus" style="font-size:var(--text-xs);font-weight:var(--fw-semi);color:#4ade80;display:flex;align-items:center;gap:5px;">
        <i class="fa-solid fa-circle-notch fa-spin"></i> Syncing
      </div>
    </div>
  </div>

  <div style="max-width:480px;margin:0 auto;padding:var(--sp-4);">

    <!-- Search -->
    <div class="search-bar" style="margin-bottom:var(--sp-4);">
      <i class="fa-solid fa-search" style="color:var(--text-muted);font-size:0.85rem;"></i>
      <input type="text" id="searchInput" placeholder="Filter by type, status, or amount…">
    </div>

    <!-- Table -->
    <div class="card card--shadow" style="overflow:hidden;">
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Transaction</th>
            <th style="text-align:right;">Amount</th>
            <th style="text-align:right;">Status</th>
          </tr>
        </thead>
        <tbody id="ledgerBody">
          <tr>
            <td colspan="3" style="padding:var(--sp-8);">
              <div class="shimmer" style="width:70%;margin-bottom:var(--sp-3);"></div>
              <div class="shimmer" style="width:50%;margin-bottom:var(--sp-3);"></div>
              <div class="shimmer" style="width:60%;"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <nav class="bottom-dock">
    <a href="dashboard.html" class="dock-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="ledger.html" class="dock-item active"><i class="fa-solid fa-list-ul"></i><span>Ledger</span></a>
    <a href="kyc.html" class="dock-item dock-item--cta"><i class="fa-solid fa-shield-halved"></i></a>
    <a href="support.html" class="dock-item"><i class="fa-solid fa-headset"></i><span>Support</span></a>
    <a href="settings.html" class="dock-item"><i class="fa-solid fa-user-gear"></i><span>Settings</span></a>
  </nav>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    let allItems = [];

    const CLEARED  = ['SUCCESS','CLEARED','APPROVED','PAID','SUCCESSFUL'];
    const DECLINED = ['FAILED','REJECTED','DECLINED','ON HOLD','HOLD'];

    function statusClass(s) {
      const u = (s || '').toUpperCase();
      if (CLEARED.includes(u))  return 'badge--success';
      if (DECLINED.includes(u)) return 'badge--error';
      return 'badge--warning';
    }
    function statusLabel(s) {
      const u = (s || 'PENDING').toUpperCase();
      if (CLEARED.includes(u))  return 'Cleared';
      if (DECLINED.includes(u)) return u.includes('HOLD') ? 'On Hold' : 'Declined';
      return 'Pending';
    }

    function renderTable(items) {
      const body = document.getElementById('ledgerBody');
      if (!items.length) {
        body.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:var(--sp-10);color:var(--text-muted);font-size:var(--text-sm);">No transactions found.</td></tr>';
        return;
      }
      body.innerHTML = items.map(item => {
        const type     = (item.type || 'Transfer').toUpperCase();
        const isCredit = item.isCredit || ['GRANT','DEPOSIT','AWARD','PRINCIPAL','ALLOTMENT','ADJUSTMENT'].some(k => type.includes(k));
        const amount   = Number(item.amount || 0);
        const sClass   = statusClass(item.status);
        const sLabel   = statusLabel(item.status);
        const declined = DECLINED.includes((item.status||'').toUpperCase());
        return `
          <tr>
            <td>
              <div class="tx-type">${type}</div>
              <div class="tx-date">${item.date || 'Processing…'}</div>
              ${(item.reason && declined) ? `<div class="tx-reason">${item.reason}</div>` : ''}
            </td>
            <td style="text-align:right;">
              <div class="tx-amount" style="color:${isCredit ? 'var(--success)' : 'var(--red)'};">
                ${isCredit ? '+' : '-'}$${amount.toLocaleString()}
              </div>
            </td>
            <td style="text-align:right;">
              <span class="badge ${sClass}">${sLabel}</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) { location.href = 'login.html'; return; }
      document.getElementById('ledgerRef').textContent = 'REF: ' + user.uid.substring(0, 10).toUpperCase();

      onSnapshot(doc(db, 'users', user.uid), (snap) => {
        document.getElementById('pageLoader').style.display = 'none';
        if (!snap.exists()) return;
        const d = snap.data();

        document.getElementById('balAmount').textContent   = Number(d.balance || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        document.getElementById('awardAmount').textContent = Number(d.totalAward || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        document.getElementById('syncStatus').innerHTML    = '<i class="fa-solid fa-circle-check"></i> Live';

        const history = Array.isArray(d.history) ? d.history : [];
        const ledger  = Array.isArray(d.ledger)  ? d.ledger  : [];
        const combined = [...history, ...ledger].sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

        // De-duplicate
        const seen = new Set();
        allItems = [];
        combined.forEach(item => {
          const key = `${item.type}-${item.amount}-${item.date}`;
          if (!seen.has(key)) { seen.add(key); allItems.push(item); }
        });

        if (d.totalAward) {
          allItems.push({ type: 'Principal Allotment', amount: d.totalAward, status: 'CLEARED', date: 'Origin', isCredit: true });
        }

        renderTable(allItems);
      });

      document.getElementById('searchInput').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        renderTable(allItems.filter(i =>
          (i.type   || '').toLowerCase().includes(q) ||
          (i.status || '').toLowerCase().includes(q) ||
          String(i.amount || '').includes(q)
        ));
      });
    });
  </script>
</body>
</html>
