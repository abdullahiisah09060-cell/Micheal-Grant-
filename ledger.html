<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .ledger-row { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-light); gap: 16px; transition: 0.2s; }
        .ledger-row:hover { background: var(--surface-2); }
        .ledger-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <div class="app-sidebar__overlay" id="sidebarOverlay"></div>
        <main class="app-main">
            <header class="page-header" id="pageHeader"></header>
            <div class="app-main__content" style="max-width: 900px;">
                <div class="card mb-6" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div class="text-muted" style="font-size:0.75rem; font-weight:700; text-transform:uppercase;">Current Balance</div>
                        <div id="ledgerBalance" style="font-size:1.8rem; font-weight:900; color:var(--navy);">$0.00</div>
                    </div>
                    <button class="btn btn--secondary btn--sm" id="btnExport"><i class="fa-solid fa-file-export"></i> Export CSV</button>
                </div>

                <div class="card" style="padding:0; overflow:hidden;">
                    <div id="ledgerList">
                        <div style="padding:40px; text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, collection, query, orderBy, onSnapshot } from './firebase-config.js';
        import { requireAuth, buildSidebar, buildPageHeader, initTheme, formatCurrency } from './app.js';

        requireAuth((user, userData) => {
            initTheme();
            buildSidebar({ activeId: 'ledger', userData });
            buildPageHeader({ title: 'Ledger History', subtitle: 'Detailed record of all account activity', backUrl: 'dashboard.html' });

            document.getElementById('ledgerBalance').innerText = formatCurrency(userData.balance);

            const q = query(collection(db, "users", user.uid, "ledger"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snap) => {
                const list = document.getElementById('ledgerList');
                if (snap.empty) {
                    list.innerHTML = `<div style="padding:60px; text-align:center;"><i class="fa-solid fa-inbox fa-3x" style="color:var(--border); margin-bottom:16px;"></i><p class="text-muted">No transactions found.</p></div>`;
                    return;
                }

                const typeMap = {
                    deposit: { icon: 'fa-arrow-down-long', color: 'var(--success)', bg: 'var(--success-bg)' },
                    withdrawal: { icon: 'fa-arrow-up-long', color: 'var(--red)', bg: 'var(--red-light)' },
                    application: { icon: 'fa-file-signature', color: 'var(--navy)', bg: 'var(--navy-light)' },
                    fee: { icon: 'fa-receipt', color: 'var(--warning)', bg: 'var(--warning-bg)' },
                    award: { icon: 'fa-trophy', color: '#a16207', bg: '#fefce8' },
                    credit: { icon: 'fa-plus', color: 'var(--success)', bg: 'var(--success-bg)' }
                };

                list.innerHTML = snap.docs.map(doc => {
                    const data = doc.data();
                    const style = typeMap[data.type] || typeMap.application;
                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : 'Pending';
                    const isDebit = ['withdrawal', 'fee'].includes(data.type);
                    
                    return `
                        <div class="ledger-row">
                            <div class="ledger-icon" style="background:${style.bg}; color:${style.color};">
                                <i class="fa-solid ${style.icon}"></i>
                            </div>
                            <div style="flex:1;">
                                <div style="font-weight:700; font-size:0.95rem;">${data.description}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${date}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:800; color:${isDebit ? 'var(--red)' : 'var(--success)'};">
                                    ${isDebit ? '-' : '+'}${formatCurrency(data.amount)}
                                </div>
                                <div class="badge badge--idle" style="font-size:0.6rem; padding:2px 6px; margin-top:4px;">${data.status}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            });

            document.getElementById('btnExport').onclick = () => {
                showToast('Preparing CSV...', 'info');
                // Basic CSV generation logic would go here
            };
        });
    </script>
</body>
</html>
