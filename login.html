<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SBA Grant Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
    <div class="gov-banner">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA Flag" style="height:11px;">
        <span>An official website of the United States government</span>
    </div>

    <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div style="max-width:440px; width:100%;">
            <div style="text-align:center; margin-bottom:32px;">
                <div class="sba-logo" style="justify-content:center; margin-bottom:12px;">
                    <svg style="width:60px; height:60px;" viewBox="0 0 80 80">
                        <path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/>
                        <text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text>
                        <text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text>
                        <text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text>
                    </svg>
                </div>
                <h1 style="font-size:1.5rem; font-weight:800; color:var(--navy);">Portal Login</h1>
            </div>

            <div class="card">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <label class="form-label" style="margin-bottom:0;">Password</label>
                            <a href="forget-password.html" style="font-size:0.8rem; font-weight:600; color:var(--navy); text-decoration:none;">Forgot?</a>
                        </div>
                        <input type="password" id="password" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Sign In</button>
                </form>
                <div style="margin-top:24px; text-align:center; border-top:1px solid var(--border-light); padding-top:20px;">
                    <p style="font-size:0.9rem; color:var(--text-secondary);">New applicant?</p>
                    <a href="register.html" style="font-weight:700; color:var(--navy); text-decoration:none;">Create a Portal Account &rarr;</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, getUserData, setUserOnline } from './firebase-config.js';
        import { redirectIfLoggedIn, setButtonLoading, initTheme, showToast } from './app.js';
        initTheme();
        redirectIfLoggedIn();

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            setButtonLoading(btn, true, 'Authenticating...');
            
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                await setUserOnline(cred.user.uid, true);
                const data = await getUserData(cred.user.uid);
                window.location.href = (data?.role === 'admin') ? 'admin-portal.html' : 'dashboard.html';
            } catch (err) {
                setButtonLoading(btn, false);
                const msg = err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' 
                    ? 'Invalid email or password.' : 'Login failed. Please try again.';
                showToast(msg, 'error');
            }
        };
    </script>
</body>
</html>
