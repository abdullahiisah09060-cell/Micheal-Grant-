<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 420px; padding: 40px; }
        .auth-logo { margin: 0 auto 30px; justify-content: center; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader"><div class="spinner"></div></div>

    <div class="gov-banner" style="position: fixed; top: 0; width: 100%;">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" style="height:10px;">
        <span>Official Government Portal</span>
    </div>

    <div class="auth-container">
        <div class="card auth-card">
            <div class="sba-logo auth-logo">
                <svg width="40" height="40" viewBox="0 0 60 60"><path d="M8 8 H24 V14 H14 V24 H8 Z" fill="#003087"/><path d="M36 46 H46 V36 H52 V52 H36 Z" fill="#c8102e"/></svg>
                <div class="sba-logo__text">
                    <span class="sba-logo__name">SBA Portal</span>
                    <span class="sba-logo__sub">Secure Sign In</span>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label class="form-label">Password</label>
                        <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--navy);">Forgot?</a>
                    </div>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>
                
                <div id="errorBox" class="alert alert--error" style="display: none; margin-bottom: 20px; padding: 10px; font-size: 0.85rem; border-radius: 6px; background: #fee2e2; color: #991b1b;"></div>

                <button type="submit" id="submitBtn" class="btn btn--primary btn--full">Sign In</button>
            </form>

            <div style="margin-top: 30px; text-align: center; font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--navy); font-weight: 600;">Apply Now →</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, getUserData, setUserOnline, isAdmin } from './firebase-config.js';
        import { initTheme, showToast, redirectIfLoggedIn, showLoader, hideLoader } from './app.js';

        initTheme();
        redirectIfLoggedIn();

        const form = document.getElementById('loginForm');
        const errBox = document.getElementById('errorBox');

        form.onsubmit = async (e) => {
            e.preventDefault();
            errBox.style.display = 'none';
            showLoader();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const userData = await getUserData(cred.user.uid);

                if(userData.accountStatus === 'suspended') {
                    await auth.signOut();
                    throw { code: 'auth/user-disabled' };
                }

                await setUserOnline(cred.user.uid, true);
                
                if(userData.role === 'admin') {
                    window.location.href = 'admin-portal.html';
                } else {
                    window.location.href = 'dashboard.html';
                }

            } catch (error) {
                hideLoader();
                errBox.style.display = 'block';
                switch(error.code) {
                    case 'auth/user-not-found': errBox.innerText = "No account found with this email."; break;
                    case 'auth/wrong-password': errBox.innerText = "Incorrect password."; break;
                    case 'auth/user-disabled': errBox.innerText = "This account has been suspended."; break;
                    case 'auth/too-many-requests': errBox.innerText = "Too many attempts. Try again later."; break;
                    default: errBox.innerText = "Authentication failed. Please check your credentials.";
                }
            }
        };
    </script>
</body>
</html>
