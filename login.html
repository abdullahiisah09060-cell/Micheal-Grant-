<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | SBA Grant Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .auth-container { min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
        .auth-content { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
        .auth-card { width:100%; max-width:440px; animation:fadeSlide 0.4s ease; }
        .input-icon { position:relative; }
        .input-icon i { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-muted); }
        .input-icon input { padding-left:45px; }
        .pass-toggle { position:absolute; right:16px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--text-muted); cursor:pointer; }
    </style>
</head>
<body>

<div id="pageLoader" class="page-loader"><div class="spinner"></div></div>

<div class="gov-banner">
    <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA">
    <span>An official website of the United States government</span>
</div>

<div class="auth-container">
    <div class="auth-content">
        <div class="auth-card">
            <div class="text-center mb-8">
                <div class="sba-logo" style="justify-content:center; margin-bottom:24px;">
                    <svg class="sba-logo__mark" viewBox="0 0 80 80"><path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/><text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text><text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text><text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text></svg>
                    <div class="sba-logo__text"><span class="sba-logo__name">U.S. Small Business</span><span class="sba-logo__sub">Administration</span></div>
                </div>
                <h1 style="font-size:1.5rem; font-weight:800; color:var(--text-primary);">Welcome Back</h1>
                <p class="text-muted">Access your secure federal grant account</p>
            </div>

            <div class="card card--shadow">
                <div id="authError" class="alert alert--error mb-4" style="display:none;"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="flex justify-between items-center mb-2">
                            <label class="form-label" style="margin-bottom:0;">Password</label>
                            <a href="forgot-password.html" class="text-navy" style="font-size:0.8rem; font-weight:700;">Forgot?</a>
                        </div>
                        <div class="input-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                            <button type="button" class="pass-toggle" id="passToggle"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-group flex items-center gap-2">
                        <input type="checkbox" id="remember" style="width:16px; height:16px; cursor:pointer;">
                        <label for="remember" style="font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">Remember this device</label>
                    </div>
                    <button type="submit" class="btn btn--primary btn--full" id="loginBtn">Sign In to Portal</button>
                </form>

                <div style="margin:24px 0; text-align:center; position:relative;">
                    <hr style="border:none; border-top:1px solid var(--border-light);">
                    <span style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:0 12px; font-size:0.7rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Secure Access</span>
                </div>

                <a href="register.html" class="btn btn--ghost btn--full" style="font-weight:700; color:var(--navy);">New here? Apply for Funding <i class="fa-solid fa-arrow-right" style="margin-left:6px;"></i></a>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { auth, signInWithEmailAndPassword, setUserOnline, doc, onSnapshot, db } from './firebase-config.js';
    import { initTheme, redirectIfLoggedIn, setButtonLoading, showToast } from './app.js';

    initTheme();
    redirectIfLoggedIn();

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('authError');
    const passToggle = document.getElementById('passToggle');
    const passInput = document.getElementById('password');

    passToggle.onclick = () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        passToggle.innerHTML = `<i class="fa-solid ${isPass ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
    };

    form.onsubmit = async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        const btn = document.getElementById('loginBtn');
        setButtonLoading(btn, true, 'Verifying...');

        const email = document.getElementById('email').value.trim();
        const pass = passInput.value;

        try {
            const cred = await signInWithEmailAndPassword(auth, email, pass);
            await setUserOnline(cred.user.uid, true);
            
            onSnapshot(doc(db, "users", cred.user.uid), (snap) => {
                const data = snap.data();
                if(data.role === 'admin') window.location.href = 'admin-portal.html';
                else window.location.href = 'dashboard.html';
            });
        } catch (err) {
            console.error(err);
            let msg = "Invalid email or password.";
            const code = err.code;
            if(code === 'auth/user-not-found') msg = "No account found with this email.";
            else if(code === 'auth/wrong-password') msg = "The password you entered is incorrect.";
            else if(code === 'auth/invalid-email') msg = "Please enter a valid email address.";
            else if(code === 'auth/user-disabled') msg = "This account has been disabled by the SBA.";
            else if(code === 'auth/too-many-requests') msg = "Too many failed attempts. Try again in 5 minutes.";
            else if(code === 'auth/invalid-credential') msg = "Invalid login credentials provided.";
            
            errBox.textContent = msg;
            errBox.style.display = 'flex';
            setButtonLoading(btn, false);
        }
    };
</script>
</body>
</html>
