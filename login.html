<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SBA Grant Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-6 selection:bg-amber-500 selection:text-slate-950">
    <div class="w-full max-w-md p-8 rounded-3xl bg-slate-900/80 border border-slate-800 shadow-2xl backdrop-blur-xl">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-500/20 text-2xl mx-auto mb-4">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Welcome Back</h1>
            <p class="text-xs text-slate-400 mt-1">Sign in to your SBA Grant portal account</p>
        </div>

        <div id="loginError" class="hidden mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold flex items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation text-base"></i>
            <span id="loginErrorText">Error message here</span>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="loginEmail" required placeholder="name@business.com" class="w-full pl-11 pr-4 py-3 rounded-xl glass-input text-sm font-medium">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Password</label>
                    <a href="forgot-password.html" class="text-xs text-amber-400 hover:underline font-semibold">Forgot Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-11 pr-12 py-3 rounded-xl glass-input text-sm font-medium">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300">
                        <i class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="w-full py-3.5 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 text-sm">
                <span>Sign In to Portal</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Don't have an account? <a href="register.html" class="text-amber-400 font-bold hover:underline">Apply for Grant</a>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, getUserData, isAdmin } from './firebase-config.js';

        const form = document.getElementById('loginForm');
        const errBox = document.getElementById('loginError');
        const errText = document.getElementById('loginErrorText');
        const btn = document.getElementById('loginBtn');
        const passInput = document.getElementById('loginPassword');
        const toggleBtn = document.getElementById('togglePassword');

        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.innerHTML = '<i class="fa-solid fa-eye-slash text-sm"></i>';
            } else {
                passInput.type = 'password';
                toggleBtn.innerHTML = '<i class="fa-solid fa-eye text-sm"></i>';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

            const email = document.getElementById('loginEmail').value.trim();
            const password = passInput.value;

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const userData = await getUserData(cred.user.uid);

                if (userData && userData.accountStatus === 'suspended') {
                    errText.textContent = 'This account has been suspended. Please contact support.';
                    errBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign In to Portal</span> <i class="fa-solid fa-arrow-right"></i>';
                    return;
                }

                if (userData && userData.role === 'admin') {
                    window.location.href = 'admin-portal.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                errText.textContent = error.message.replace('Firebase: ', '');
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In to Portal</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
