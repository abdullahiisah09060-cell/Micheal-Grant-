<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SBA Grant Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <div class="gov-banner">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA Flag">
        <span>A secure federal portal system</span>
    </div>

    <div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 450px; width: 100%;">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="sba-logo.png" alt="SBA Logo" style="height: 60px; margin-bottom: 15px;">
                <h2 style="color: var(--sba-navy);">Portal Login</h2>
                <p style="color: var(--text-secondary); font-size: 14px;">Access your grant application dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label class="form-label">Password</label>
                        <a href="forgot-password.html" style="font-size: 12px; color: var(--sba-navy); font-weight: 600;">Forgot?</a>
                    </div>
                    <div style="position: relative;">
                        <input type="password" id="password" class="form-input" required>
                        <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 15px; top: 13px; color: var(--text-muted); cursor: pointer;"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 25px; border-top: 1px solid var(--border); padding-top: 20px;">
                <p style="font-size: 14px; color: var(--text-secondary);">New applicant?</p>
                <a href="register.html" style="color: var(--sba-navy); font-weight: 700; text-decoration: none;">Create an Account &rarr;</a>
            </div>
        </div>
    </div>

    <script type="module">
        // UI Logic for Password Toggle
        const toggle = document.getElementById('togglePassword');
        const pass = document.getElementById('password');
        toggle.addEventListener('click', () => {
            const type = pass.getAttribute('type') === 'password' ? 'text' : 'password';
            pass.setAttribute('type', type);
            toggle.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
