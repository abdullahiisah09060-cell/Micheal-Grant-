<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | SBA Grant Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); }
        .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { max-width: 440px; width: 100%; animation: fadeSlide 0.4s ease; }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-logo { margin-bottom: 24px; justify-content: center; }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-icon-wrapper .form-input { padding-left: 44px; }
        .pass-toggle { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; }
    </style>
</head>
<body>

    <div id="pageLoader" class="page-loader">
        <div class="spinner"></div>
    </div>

    <!-- Gov Banner -->
    <div class="gov-banner">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA Flag">
        <span>An official website of the United States government</span>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="sba-logo auth-logo">
                    <svg class="sba-logo__mark" viewBox="0 0 80 80">
                        <path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/>
                        <text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text>
                        <text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text>
                        <text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text>
                    </svg>
                    <div class="sba-logo__text"><span class="sba-logo__name">U.S. Small Business</span><span class="sba-logo__sub">Administration</span></div>
                </a>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">Welcome Back</h1>
                <p class="text-muted">Sign in to your secure grant portal account</p>
            </div>

            <div class="card card--shadow">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="flex justify-between items-center mb-2">
                            <label class="form-label" style="margin-bottom: 0;">Password</label>
                            <a href="forgot-password.html" class="text-navy" style="font-size: 0.8rem; font-weight: 600;">Forgot?</a>
                        </div>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                            <button type="button" class="pass-toggle" onclick="togglePass()"><i class="fa-solid fa-eye" id="eyeIcon"></i></button>
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="remember" style="width: 16px; height: 16px;">
                        <label for="remember" style="font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">Remember this device</label>
                    </div>

                    <div id="errorBox" class="alert alert--error mb-4" style="display: none;">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="errorMsg"></span>
                    </div>

                    <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Sign In</button>
                </form>

                <div style="margin: 24px 0; text-align: center; position: relative;">
                    <hr style="border: none; border-top: 1px solid var(--border-light);">
                    <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 0 12px; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Secure Portal</span>
                </div>

                <a href="register.html" class="btn btn--ghost btn--full" style="font-size: 0.85rem; font-weight: 700; color: var(--navy);">New here? Apply for a Grant <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i></a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, doc, onSnapshot, db, setUserOnline } from './firebase-config.js';
        import { initTheme, redirectIfLoggedIn, showToast, setButtonLoading } from './app.js';

        initTheme();
        redirectIfLoggedIn();

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorBox = document.getElementById('errorBox');
        const errorMsg = document.getElementById('errorMsg');

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            setButtonLoading(submitBtn, true, 'Verifying...');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                await setUserOnline(cred.user.uid, true);
                
                // Real-time check for role-based redirection
                onSnapshot(doc(db, "users", cred.user.uid), (snap) => {
                    const userData = snap.data();
                    if (userData.role === 'admin') window.location.href = 'admin-portal.html';
                    else window.location.href = 'dashboard.html';
                });

            } catch (err) {
                console.error(err);
                let message = "Invalid email or password.";
                if (err.code === 'auth/user-not-found') message = "No account found with this email.";
                if (err.code === 'auth/wrong-password') message = "Incorrect password.";
                if (err.code === 'auth/too-many-requests') message = "Too many failed attempts. Please try again later.";
                
                errorMsg.textContent = message;
                errorBox.style.display = 'flex';
                setButtonLoading(submitBtn, false);
            }
        };

        window.togglePass = () => {
            const pass = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pass.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        };
    </script>
</body>
</html>
