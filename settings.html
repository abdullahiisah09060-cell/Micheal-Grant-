<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SBA Portal</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .tab-nav { display: flex; gap: 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .tab-btn { padding: 12px 4px; border: none; background: none; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="layout" style="display: flex; min-height: 100vh;">
        <main style="flex: 1; padding: 40px 10%; background: var(--bg);">
            <h1 style="margin-bottom: 30px;">Account Settings</h1>
            
            <div class="card">
                <div class="tab-nav">
                    <button class="tab-btn active" onclick="showTab('profile')">Profile</button>
                    <button class="tab-btn" onclick="showTab('security')">Security</button>
                    <button class="tab-btn" onclick="showTab('appearance')">Appearance</button>
                </div>

                <!-- PROFILE TAB -->
                <div id="profile" class="tab-content active">
                    <form id="profileForm">
                        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                            <div id="avatarPreview" style="width: 80px; height: 80px; border-radius: 50%; background: var(--navy-light); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--navy); font-weight: 800; overflow: hidden;">JD</div>
                            <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                            <button type="button" class="btn btn--outline btn--sm" onclick="document.getElementById('avatarInput').click()">Change Photo</button>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="setFullName" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" id="setUserName" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="text" id="setPhone" class="form-input">
                        </div>
                        <button type="submit" class="btn btn--primary">Save Changes</button>
                    </form>
                </div>

                <!-- SECURITY TAB -->
                <div id="security" class="tab-content">
                    <h3>Transaction PIN</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px;">Required for all withdrawals.</p>
                    <div class="form-group">
                        <label class="form-label">New 4-Digit PIN</label>
                        <input type="password" id="newPin" class="form-input" maxlength="4" placeholder="••••">
                    </div>
                    <button id="updatePinBtn" class="btn btn--primary">Update PIN</button>
                    
                    <hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--border-light);">
                    
                    <h3>Account Access</h3>
                    <button id="resetPassBtn" class="btn btn--outline" style="margin-top: 15px;">Send Password Reset Email</button>
                </div>

                <!-- APPEARANCE TAB -->
                <div id="appearance" class="tab-content">
                    <h3>Theme Preference</h3>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px;">
                        <button class="btn btn--outline" onclick="applyTheme('light')">☀️ Light</button>
                        <button class="btn btn--outline" onclick="applyTheme('dark')">🌙 Dark</button>
                        <button class="btn btn--outline" onclick="applyTheme('system')">💻 System</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, updateUserData, sendPasswordResetEmail, compressToBase64 } from './firebase-config.js';
        import { requireAuth, initTheme, setTheme, showToast, showLoader, hideLoader } from './app.js';

        initTheme();

        requireAuth((user, userData) => {
            document.getElementById('setFullName').value = userData.fullName;
            document.getElementById('setUserName').value = userData.username;
            document.getElementById('setPhone').value = userData.phoneNumber;
            
            const initials = userData.fullName.split(' ').map(n => n[0]).join('');
            if(userData.avatarBase64) {
                document.getElementById('avatarPreview').innerHTML = `<img src="${userData.avatarBase64}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                document.getElementById('avatarPreview').innerText = initials;
            }
        });

        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase() === tabId));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === tabId));
        };

        window.applyTheme = (theme) => {
            setTheme(theme);
            showToast(`Theme set to ${theme}`, "success");
        };

        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            showLoader();
            try {
                await updateUserData(auth.currentUser.uid, {
                    fullName: document.getElementById('setFullName').value,
                    username: document.getElementById('setUserName').value,
                    phoneNumber: document.getElementById('setPhone').value
                });
                showToast("Profile updated", "success");
            } catch (err) { showToast(err.message, "error"); }
            hideLoader();
        };

        document.getElementById('avatarInput').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            showLoader();
            const base64 = await compressToBase64(file);
            await updateUserData(auth.currentUser.uid, { avatarBase64: base64 });
            document.getElementById('avatarPreview').innerHTML = `<img src="${base64}" style="width:100%; height:100%; object-fit:cover;">`;
            hideLoader();
            showToast("Photo updated", "success");
        };

        document.getElementById('updatePinBtn').onclick = async () => {
            const pin = document.getElementById('newPin').value;
            if(pin.length !== 4) return showToast("PIN must be 4 digits", "warning");
            showLoader();
            await updateUserData(auth.currentUser.uid, { transactionPin: pin });
            hideLoader();
            showToast("Transaction PIN updated", "success");
            document.getElementById('newPin').value = '';
        };

        document.getElementById('resetPassBtn').onclick = async () => {
            await sendPasswordResetEmail(auth, auth.currentUser.email);
            showToast("Reset email sent", "success");
        };
    </script>
</body>
</html>
