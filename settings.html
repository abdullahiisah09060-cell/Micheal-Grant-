<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .settings-tab { padding: 10px 20px; cursor: pointer; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; }
        .settings-tab.active { color: var(--sba-navy); border-bottom-color: var(--sba-navy); }
        .settings-pane { display: none; padding-top: 30px; }
        .settings-pane.active { display: block; }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="container" style="max-width: 800px;">
        <h2 style="color: var(--sba-navy); margin-bottom: 30px;">Portal Settings</h2>

        <div class="card">
            <div style="display: flex; gap: 20px; border-bottom: 1px solid var(--border);">
                <div class="settings-tab active" onclick="openTab('profile')">Profile</div>
                <div class="settings-tab" onclick="openTab('security')">Security & PIN</div>
            </div>

            <!-- Profile Pane -->
            <div id="profile" class="settings-pane active">
                <div class="form-group">
                    <label class="form-label">Display Name</label>
                    <input type="text" class="form-input" id="set-name">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-input" id="set-phone">
                </div>
                <button class="btn btn-primary" id="saveProfile">Update Profile</button>
            </div>

            <!-- Security Pane -->
            <div id="security" class="settings-pane">
                <div style="background: var(--sba-blue-light); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                    <h5 style="color: var(--sba-navy);">Withdrawal PIN</h5>
                    <p style="font-size: 13px; color: var(--text-secondary);">Your 4-digit PIN is required for all fund disbursements.</p>
                </div>
                <div class="form-group" style="max-width: 200px;">
                    <label class="form-label">Set 4-Digit PIN</label>
                    <input type="password" maxlength="4" class="form-input" placeholder="****" id="set-pin">
                </div>
                <button class="btn btn-primary" id="savePin">Save Security PIN</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
        </div>
    </div>

    <script>
        function openTab(tabId) {
            document.querySelectorAll('.settings-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
