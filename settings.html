<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SBA Grant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .settings-tab { padding: 12px 20px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; white-space: nowrap; }
        .settings-tab.active { color: var(--navy); border-bottom-color: var(--navy); }
        .settings-pane { display: none; padding-top: 32px; animation: fadeSlide 0.3s ease; }
        .settings-pane.active { display: block; }
        .theme-card { border: 2px solid var(--border); border-radius: var(--r-lg); padding: 16px; cursor: pointer; text-align: center; transition: 0.2s; }
        .theme-card.active { border-color: var(--navy); background: var(--navy-light); }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <div class="app-sidebar__overlay" id="sidebarOverlay"></div>

        <main class="app-main">
            <header class="page-header" id="pageHeader"></header>

            <div class="app-main__content" style="max-width:800px;">
                <div style="display:flex; overflow-x:auto; border-bottom:1px solid var(--border-light); scrollbar-width:none;">
                    <div class="settings-tab active" data-target="profile">Profile</div>
                    <div class="settings-tab" data-target="security">Security</div>
                    <div class="settings-tab" data-target="appearance">Appearance</div>
                </div>

                <!-- Profile Pane -->
                <div class="settings-pane active" id="pane-profile">
                    <div class="card mb-8">
                        <div style="display:flex; align-items:center; gap:24px; margin-bottom:32px;">
                            <div id="avatarWrap" style="position:relative;">
                                <div id="p-avatar" style="width:100px; height:100px; border-radius:50%; background:var(--navy); color:white; display:flex; align-items:center; justify-content:center; font-size:2.5rem; font-weight:800; overflow:hidden;"></div>
                                <label for="avatarInput" style="position:absolute; bottom:0; right:0; width:32px; height:32px; background:var(--white); border:1px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy); box-shadow:var(--shadow-sm);">
                                    <i class="fa-solid fa-camera"></i>
                                </label>
                                <input type="file" id="avatarInput" hidden accept="image/*">
                            </div>
                            <div>
                                <h3 id="p-name" style="font-weight:800; color:var(--navy);">...</h3>
                                <p id="p-email" style="color:var(--text-muted); font-size:0.9rem;"></p>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <input type="text" id="set-phone" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Country</label>
                                <select id="set-country" class="form-select">
                                    <option value="United States">United States</option>
                                    <option value="Canada">Canada</option>
                                    <option value="United Kingdom">United Kingdom</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn--primary" id="btnSaveProfile">Update Profile</button>
                    </div>

                    <div class="card" style="background:var(--surface-2); border-style:dashed;">
                        <h4 style="font-weight:800; color:var(--navy); margin-bottom:12px;">Referral Program</h4>
                        <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:16px;">Invite other small business owners and earn priority processing.</p>
                        <div style="display:flex; gap:12px;">
                            <input type="text" id="refCode" class="form-input" readonly style="font-family:var(--font-mono); background:white;">
                            <button class="btn btn--secondary" id="btnCopyRef"><i class="fa-solid fa-copy"></i> Copy</button>
                        </div>
                    </div>
                </div>

                <!-- Security Pane -->
                <div class="settings-pane" id="pane-security">
                    <div class="card mb-6">
                        <h3 style="font-weight:800; color:var(--navy); margin-bottom:24px;">Transaction PIN</h3>
                        <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:20px;">Required for all withdrawal requests.</p>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">New 4-Digit PIN</label>
                                <input type="password" id="set-pin" class="form-input" maxlength="4" placeholder="••••">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Confirm PIN</label>
                                <input type="password" id="set-pin-confirm" class="form-input" maxlength="4" placeholder="••••">
                            </div>
                        </div>
                        <button class="btn btn--primary" id="btnSavePin">Set PIN</button>
                    </div>

                    <div class="card">
                        <h3 style="font-weight:800; color:var(--navy); margin-bottom:24px;">Change Password</h3>
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" id="cur-pass" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" id="new-pass" class="form-input">
                        </div>
                        <button class="btn btn--outline" id="btnUpdatePass">Update Password</button>
                    </div>
                </div>

                <!-- Appearance Pane -->
                <div class="settings-pane" id="pane-appearance">
                    <div class="card">
                        <h3 style="font-weight:800; color:var(--navy); margin-bottom:24px;">Theme Preference</h3>
                        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">
                            <div class="theme-card" data-theme="light">
                                <i class="fa-solid fa-sun fa-2x" style="color:#eab308; margin-bottom:12px;"></i>
                                <div style="font-weight:700; font-size:0.85rem;">Light</div>
                            </div>
                            <div class="theme-card" data-theme="dark">
                                <i class="fa-solid fa-moon fa-2x" style="color:#6366f1; margin-bottom:12px;"></i>
                                <div style="font-weight:700; font-size:0.85rem;">Dark</div>
                            </div>
                            <div class="theme-card" data-theme="system">
                                <i class="fa-solid fa-desktop fa-2x" style="color:#64748b; margin-bottom:12px;"></i>
                                <div style="font-weight:700; font-size:0.85rem;">System</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { updateUserData, compressToBase64 } from './firebase-config.js';
        import { requireAuth, buildSidebar, buildPageHeader, initTheme, initNotificationBadge, showToast, applyTheme } from './app.js';

        requireAuth((user, userData) => {
            initTheme();
            buildSidebar({ activeId: 'settings', userData });
            buildPageHeader({ title: 'Settings', subtitle: 'Manage your profile and account security', backUrl: 'dashboard.html' });
            initNotificationBadge(user.uid);

            // Populate Profile
            document.getElementById('p-avatar').innerHTML = userData.avatarBase64 
                ? `<img src="${userData.avatarBase64}" style="width:100%; height:100%; object-fit:cover;">`
                : userData.fullName.charAt(0);
            document.getElementById('p-name').innerText = userData.fullName;
            document.getElementById('p-email').innerText = userData.email;
            document.getElementById('set-phone').value = userData.phoneNumber || '';
            document.getElementById('set-country').value = userData.country || 'United States';
            document.getElementById('refCode').value = `SBA-${user.uid.substring(0, 8).toUpperCase()}`;

            // Tab Switching
            document.querySelectorAll('.settings-tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.settings-pane').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`pane-${tab.dataset.target}`).classList.add('active');
                };
            });

            // Avatar Upload
            document.getElementById('avatarInput').onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const b64 = await compressToBase64(file);
                await updateUserData(user.uid, { avatarBase64: b64 });
                document.getElementById('p-avatar').innerHTML = `<img src="${b64}" style="width:100%; height:100%; object-fit:cover;">`;
                showToast('Avatar updated!', 'success');
            };

            // Update Profile
            document.getElementById('btnSaveProfile').onclick = async () => {
                const phone = document.getElementById('set-phone').value;
                const country = document.getElementById('set-country').value;
                await updateUserData(user.uid, { phoneNumber: phone, country });
                showToast('Profile saved', 'success');
            };

            // PIN logic
            document.getElementById('btnSavePin').onclick = async () => {
                const pin = document.getElementById('set-pin').value;
                const confirm = document.getElementById('set-pin-confirm').value;
                if(pin.length !== 4) return showToast('PIN must be 4 digits', 'warning');
                if(pin !== confirm) return showToast('PINs do not match', 'error');
                await updateUserData(user.uid, { transactionPin: pin });
                showToast('Transaction PIN set', 'success');
                document.getElementById('set-pin').value = '';
                document.getElementById('set-pin-confirm').value = '';
            };

            // Appearance selection
            const currentTheme = localStorage.getItem('sba-theme') || 'system';
            document.querySelector(`.theme-card[data-theme="${currentTheme}"]`).classList.add('active');

            document.querySelectorAll('.theme-card').forEach(card => {
                card.onclick = () => {
                    document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    applyTheme(card.dataset.theme);
                    showToast(`Theme set to ${card.dataset.theme}`, 'info');
                };
            });

            document.getElementById('btnCopyRef').onclick = () => {
                navigator.clipboard.writeText(document.getElementById('refCode').value);
                showToast('Referral code copied!', 'success');
            };
        });
    </script>
</body>
</html>
