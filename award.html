<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Award Certificate | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .cert-card { background: white; border: 10px double var(--navy); padding: 40px; position: relative; max-width: 700px; margin: 0 auto; color: var(--navy); text-align: center; font-family: 'Georgia', serif; }
        .cert-logo { width: 80px; height: 80px; margin: 0 auto 20px; }
        .cert-title { font-size: 2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 24px; letter-spacing: 2px; }
        .cert-name { font-size: 1.8rem; font-style: italic; border-bottom: 2px solid var(--navy); display: inline-block; padding: 0 40px; margin-bottom: 20px; }
        .cert-seal { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--navy); display: flex; align-items: center; justify-content: center; font-weight: 900; opacity: 0.2; transform: rotate(-15deg); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>
    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar"></aside>
        <div class="app-sidebar__overlay" id="sidebarOverlay"></div>
        <main class="app-main">
            <header class="page-header" id="pageHeader"></header>
            <div class="app-main__content">
                <div id="awardTarget"></div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module">
        import { requireAuth, buildSidebar, buildPageHeader, initTheme, formatCurrency } from './app.js';

        requireAuth((user, userData) => {
            initTheme();
            buildSidebar({ activeId: 'award', userData });
            buildPageHeader({ title: 'Award Certificate', subtitle: 'Official Grant Disbursement Approval', backUrl: 'dashboard.html' });

            const target = document.getElementById('awardTarget');

            if (userData.awardStatus !== 'APPROVED') {
                target.innerHTML = `
                    <div class="status-screen card">
                        <div class="status-screen__icon status-screen__icon--info"><i class="fa-solid fa-trophy"></i></div>
                        <h2 class="status-screen__title">Certificate Pending</h2>
                        <p class="status-screen__message">Your official certificate of award will be issued once the review process is complete.</p>
                    </div>
                `;
                return;
            }

            const certDate = userData.updatedAt ? new Date(userData.updatedAt.seconds * 1000).toLocaleDateString() : new Date().toLocaleDateString();

            target.innerHTML = `
                <div class="cert-card" id="certificate">
                    <div class="cert-logo">
                        <svg viewBox="0 0 80 80"><path d="M6 6 H32 V14 H14 V32 H6 Z" fill="#003087"/><path d="M48 66 H66 V48 H74 V74 H48 Z" fill="#c8102e"/><text x="8" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">S</text><text x="28" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">B</text><text x="50" y="58" font-family="Arial Black" font-size="36" font-weight="900" fill="#003087">A</text></svg>
                    </div>
                    <div class="cert-title">Certificate of Grant Award</div>
                    <p>This is to officially certify that</p>
                    <div class="cert-name">${userData.fullName}</div>
                    <p>has been awarded the sum of</p>
                    <div style="font-size:1.8rem; font-weight:800; margin:10px 0;">${formatCurrency(userData.totalAward)}</div>
                    <p>under the SBA Grant Assistance Program.</p>
                    <div style="margin-top:40px; border-top:1px solid #ccc; width:200px; margin-left:auto; margin-right:auto; padding-top:10px; font-size:0.8rem;">Administrator, SBA</div>
                    <div style="font-size:0.7rem; color:#666; margin-top:10px;">Issued on ${certDate}</div>
                    <div class="cert-seal">OFFICIAL<br>SBA SEAL</div>
                </div>
                <div style="text-align:center; margin-top:32px; display:flex; gap:12px; justify-content:center;">
                    <button class="btn btn--secondary" id="btnDownload"><i class="fa-solid fa-download"></i> Download PNG</button>
                    <a href="withdraw.html" class="btn btn--primary">Proceed to Withdrawal</a>
                </div>
            `;

            document.getElementById('btnDownload').onclick = () => {
                html2canvas(document.getElementById('certificate')).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `SBA-Award-${user.uid.substring(0,6)}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                });
            };
        });
    </script>
</body>
</html>
