<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | SBA Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        .notif-item { display: flex; gap: 15px; padding: 20px; border-bottom: 1px solid var(--border); transition: var(--transition); }
        .notif-item:hover { background: var(--sba-blue-light); }
        .notif-item.unread { border-left: 4px solid var(--sba-navy); background: #f0f7ff; }
        .notif-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="container" style="max-width: 700px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 30px;">
            <h2 style="color: var(--sba-navy);">Account Notifications</h2>
            <button class="btn btn-outline btn-sm" id="markAllRead">Mark all as read</button>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;" id="notifList">
            <!-- Example Item -->
            <div class="notif-item unread">
                <div class="notif-icon" style="background: var(--sba-blue-light); color: var(--sba-navy);">
                    <i class="fa-solid fa-info-circle"></i>
                </div>
                <div>
                    <h5 style="margin-bottom: 5px;">KYC documents under review</h5>
                    <p style="font-size: 13px; color: var(--text-secondary);">Your identity documents have been received and are being processed by an agent.</p>
                    <small style="color: var(--text-muted);">2 hours ago</small>
                </div>
            </div>
            
            <div class="notif-item">
                <div class="notif-icon" style="background: #dcfce7; color: var(--success);">
                    <i class="fa-solid fa-check-circle"></i>
                </div>
                <div>
                    <h5>Welcome to the Portal</h5>
                    <p style="font-size: 13px; color: var(--text-secondary);">Your enrollment in the SBA Grant Program is successful.</p>
                    <small style="color: var(--text-muted);">Yesterday</small>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="dashboard.html" class="btn btn-primary">Return to Dashboard</a>
        </div>
    </div>
</body>
</html>
