<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications | SBA Grant Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>

<div id="pageLoader" class="page-loader active"><div class="spinner"></div></div>

<div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="app-sidebar__overlay" id="sidebarOverlay"></div>

    <main class="app-main">
        <div id="pageHeader"></div>

        <div class="app-main__content">
            <div class="flex justify-between items-center mb-6">
                <div class="flex gap-2">
                    <button class="btn btn--sm btn--secondary active" data-filter="all">All</button>
                    <button class="btn btn--sm btn--ghost" data-filter="unread">Unread</button>
                </div>
                <button id="markAllRead" class="btn btn--ghost btn--sm" style="display:none;"><i class="fa-solid fa-check-double"></i> Mark All Read</button>
            </div>

            <div id="notifList" class="flex flex-col gap-3">
                <!-- Notifications load here -->
            </div>
        </div>
    </main>

    <nav class="mobile-dock" id="mobileDock"></nav>
</div>

<script type="module">
    import { db, collection, query, where, orderBy, onSnapshot, markNotificationRead, markAllRead } from './firebase-config.js';
    import { requireAuth, buildSidebar, buildDock, buildPageHeader, timeAgo, initNotificationBadge, hideLoader } from './app.js';

    let currentFilter = 'all';

    requireAuth((user, userData) => {
        buildSidebar({ activeId: 'notifications', userData });
        buildDock({ activeId: 'more' });
        buildPageHeader({ title: 'Notifications', subtitle: 'Updates and alerts for your account', backUrl: 'dashboard.html' });
        initNotificationBadge(user.uid);

        const q = query(collection(db, 'notifications'), where('uid', 'in', [user.uid, 'ADMIN']), orderBy('createdAt', 'desc'));
        
        onSnapshot(q, (snap) => {
            const list = document.getElementById('notifList');
            const markBtn = document.getElementById('markAllRead');
            let unreadCount = 0;

            if (snap.empty) {
                list.innerHTML = `<div class="status-screen"><div class="status-screen__icon status-screen__icon--info"><i class="fa-solid fa-bell-slash"></i></div><h2 class="status-screen__title">No Notifications</h2><p class="status-screen__message">You're all caught up! Any updates will appear here.</p></div>`;
                markBtn.style.display = 'none';
                return;
            }

            list.innerHTML = '';
            snap.forEach(doc => {
                const n = doc.data();
                if (!n.read) unreadCount++;
                
                if (currentFilter === 'unread' && n.read) return;

                const card = document.createElement('div');
                card.className = `card flex gap-4 items-start ${n.read ? '' : 'card--shadow'}`;
                card.style.cursor = 'pointer';
                card.style.borderLeft = n.read ? '1px solid var(--border)' : '4px solid var(--navy)';
                
                card.innerHTML = `
                    <div style="width:40px; height:40px; border-radius:50%; background:var(--${n.type || 'info'}-bg); color:var(--${n.type || 'info'}); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                        <i class="fa-solid ${getIcon(n.type)}"></i>
                    </div>
                    <div style="flex:1;">
                        <div class="flex justify-between items-start">
                            <h4 style="font-size:0.9rem; font-weight:700;">${n.title}</h4>
                            <span style="font-size:0.7rem;" class="text-muted">${timeAgo(n.createdAt)}</span>
                        </div>
                        <p style="font-size:0.85rem; margin-top:4px;" class="text-secondary">${n.message}</p>
                    </div>
                `;

                card.onclick = () => {
                    if (!n.read) markNotificationRead(doc.id);
                    if (n.link) window.location.href = n.link;
                };

                list.appendChild(card);
            });

            markBtn.style.display = unreadCount > 0 ? 'block' : 'none';
            markBtn.onclick = () => markAllRead(user.uid);
        });

        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active', 'btn--secondary'));
                document.querySelectorAll('[data-filter]').forEach(b => b.classList.add('btn--ghost'));
                btn.classList.add('active', 'btn--secondary');
                btn.classList.remove('btn--ghost');
                currentFilter = btn.dataset.filter;
                // Snapshot will auto-refresh if currentFilter is reactive, but here we just re-render
            };
        });
    });

    function getIcon(type) {
        const map = { success: 'fa-circle-check', warning: 'fa-triangle-exclamation', error: 'fa-circle-xmark', action: 'fa-bolt' };
        return map[type] || 'fa-circle-info';
    }
</script>

</body>
</html>
